<!doctype html>
<html lang="hi" class="hub-booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="कक्षा 9 लर्निंग हब — सीखें, अभ्यास करें, चुनौती लें और टेस्ट दें।" />
    <meta name="theme-color" content="#111827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Class 9 Hub" />
    <link rel="manifest" href="/Class-9-Learning-Hub/manifest.webmanifest" />
    <link rel="icon" href="/Class-9-Learning-Hub/pwa-icon.svg" type="image/svg+xml" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>कक्षा 9 लर्निंग हब</title>
    <style>html.hub-booting body{visibility:hidden}html.hub-booting{background:#fff}</style>
    <script>
      (function(){
        document.documentElement.classList.remove('hub-booting');
      })();
    </script>
    <script>
      (function(){
        document.addEventListener('click',function(event){
          var tile=event.target&&event.target.closest?event.target.closest('.subject-tile'):null;
          if(!tile)return;
          var text=(tile.textContent||'').replace(/\s+/g,' ').trim();
          if(!text.includes('तर्कशक्ति'))return;
          event.preventDefault();
          event.stopImmediatePropagation();
          var url=new URL(window.location.href);
          url.searchParams.set('page','classes');
          url.searchParams.set('subject','reasoning');
          url.searchParams.delete('chapter');
          url.searchParams.delete('mode');
          window.history.pushState({},'',url.toString());
          window.dispatchEvent(new PopStateEvent('popstate'));
        },true);
      })();
    </script>
    <script>
      (function(){
        if(!('serviceWorker' in navigator))return;
        window.addEventListener('load',function(){
          navigator.serviceWorker.register('/Class-9-Learning-Hub/sw.js',{scope:'/Class-9-Learning-Hub/'})
            .catch(function(){ /* PWA is optional; the web app remains fully functional. */ });
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main2.jsx"></script>
    <script type="module" src="/src/auth/mobileNav.js"></script>
  </body>
</html>
