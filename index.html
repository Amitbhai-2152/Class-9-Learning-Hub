    <script>
      (function(){
        document.addEventListener('click',function(event){
          var tile=event.target&&event.target.closest?event.target.closest('.subject-tile'):null;
          if(!tile)return;
          var text=(tile.textContent||'').replace(/\s+/g,' ').trim();
          if(!text.includes('तर्कशक्ति'))return;
          event.preventDefault();
          event.stopImmediatePropagation();
          var url=new URL(window.location.href);
          url.searchParams.set('page','classes');
          url.searchParams.set('subject','reasoning');
          url.searchParams.delete('chapter');
          url.searchParams.delete('mode');
          window.history.pushState({},'',url.toString());
          window.dispatchEvent(new PopStateEvent('popstate'));
        },true);
      })();
    </script>
    <script>

        if(!('serviceWorker' in navigator))return;
