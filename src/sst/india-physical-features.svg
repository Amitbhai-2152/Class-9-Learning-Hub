<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">भारत के प्रमुख भौतिक विभाग</title>
<desc id="desc">कक्षा 9 के लिए भारत के हिमालय, उत्तर के मैदान, प्रायद्वीपीय पठार, तटीय मैदान, भारतीय मरुस्थल और द्वीप समूह का अध्ययन-आरेख।</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5fbff"/><stop offset="1" stop-color="#eef7f2"/></linearGradient>
 <linearGradient id="land" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#e8dfbf"/><stop offset="0.55" stop-color="#d8d4aa"/><stop offset="1" stop-color="#c9d7b0"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity=".14"/></filter>
 <style>
  .t{font-family:Arial,'Noto Sans Devanagari',sans-serif;fill:#26343a}.title{font-size:34px;font-weight:900}.sub{font-size:18px;fill:#607078}.lab{font-size:20px;font-weight:800}.small{font-size:16px}.tiny{font-size:14px}.water{fill:#dff2fb;stroke:#add3e6;stroke-width:2}.mount{fill:#d8dde4;stroke:#8999a8;stroke-width:2}.plain{fill:#e8efbe;stroke:#aeb97c;stroke-width:2}.plateau{fill:url(#land);stroke:#87925f;stroke-width:2}.desert{fill:#ead09b;stroke:#caa05d;stroke-width:2}.coast{fill:#c8e6c0;stroke:#7da37b;stroke-width:2}.island{fill:#e7bd78;stroke:#b78643;stroke-width:2}.river{fill:none;stroke:#5d9dc0;stroke-width:4;opacity:.9}.boundary{fill:none;stroke:#6d7b82;stroke-width:2;stroke-dasharray:7 6}.call{fill:#fff;stroke:#c9d5da;stroke-width:2}
 </style>
</defs>
<rect width="1200" height="760" rx="28" fill="url(#bg)"/>
<text x="42" y="48" class="t title">भारत : प्रमुख भौतिक विभाग</text>
<text x="42" y="78" class="t sub">कक्षा 9 • भौतिक स्वरूप : संरचना एवं उच्चावच • स्थान-पहचान और तुलना के लिए अध्ययन-आरेख</text>
<rect x="28" y="105" width="1144" height="610" rx="22" class="water" filter="url(#shadow)"/>

<!-- simplified India study silhouette -->
<path d="M420 175 L365 158 L320 175 L295 208 L250 223 L226 256 L245 281 L275 299 L297 333 L326 353 L346 389 L365 430 L395 474 L420 522 L447 568 L470 616 L496 664 L521 629 L541 585 L563 550 L582 505 L610 467 L635 430 L661 389 L682 350 L699 311 L684 276 L705 244 L678 211 L645 198 L609 185 L560 175 L510 168 Z" fill="url(#land)" stroke="#6f7d68" stroke-width="4"/>

