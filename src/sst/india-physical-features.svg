<path d="M458 223 L431 248 L404 274 L385 305 L365 344 L375 390 L401 410 L439 420 L484 422 L528 413 L568 399 L607 381 L642 356 L661 322 L651 292 L629 267 L600 243 L560 225 L510 215 Z" class="plain"/>
