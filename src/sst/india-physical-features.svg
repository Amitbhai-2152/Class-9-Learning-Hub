<g transform="translate(1080 600)"><path d="M0 60 L0 0" stroke="#34444a" stroke-width="4"/><path d="M0 0 L-10 18 L10 18 Z" fill="#34444a"/><text x="-8" y="84" class="t lab">उ.</text></g>

<text x="32" y="744" class="t tiny" fill="#6b7b81">सांकेतिक अध्ययन-आरेख • प्रशासनिक सीमाएँ नहीं • उद्देश्य: भौतिक विभागों की स्थिति और आपसी तुलना समझना</text>
</svg>