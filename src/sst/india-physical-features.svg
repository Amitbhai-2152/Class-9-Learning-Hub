 <rect x="435" y="485" width="195" height="52" class="call" rx="12"/>
 <text x="532" y="518" text-anchor="middle" class="t lab">प्रायद्वीपीय पठार</text>
 <rect x="253" y="344" width="140" height="48" class="call" rx="12"/>
 <text x="323" y="374" text-anchor="middle" class="t lab">भारतीय मरुस्थल</text>
 <rect x="360" y="592" width="145" height="47" class="call" rx="12"/>
 <text x="433" y="622" text-anchor="middle" class="t small">पश्चिमी तटीय मैदान</text>
 <rect x="612" y="470" width="145" height="47" class="call" rx="12"/>
 <text x="684" y="500" text-anchor="middle" class="t small">पूर्वी तटीय मैदान</text>
</g>

<!-- mountain sublabels -->
<rect x="66" y="156" width="220" height="150" class="call" rx="14"/>
<text x="84" y="184" class="t lab">हिमालय की श्रेणियाँ</text>
<text x="84" y="211" class="t small">• महान हिमालय / हिमाद्रि</text>
<text x="84" y="236" class="t small">• मध्य हिमालय</text>
<text x="84" y="261" class="t small">• शिवालिक</text>
<text x="84" y="286" class="t small">• पूर्व में पूर्वांचल</text>

<!-- plateau callout -->
<rect x="760" y="170" width="310" height="130" class="call" rx="14"/>
