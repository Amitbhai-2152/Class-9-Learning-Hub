<ellipse cx="285" cy="555" rx="8" ry="22" class="island"/>
<ellipse cx="303" cy="573" rx="7" ry="18" class="island"/>
<text x="230" y="615" class="t small">लक्षद्वीप</text>

<!-- legend -->
<rect x="784" y="332" width="336" height="105" class="call" rx="14"/>
<text x="804" y="360" class="t lab">मानचित्र संकेत</text>
<rect x="804" y="374" width="18" height="18" class="mount"/><text x="832" y="389" class="t tiny">पर्वतीय क्षेत्र</text>
<rect x="940" y="374" width="18" height="18" class="plain"/><text x="968" y="389" class="t tiny">मैदान</text>
<rect x="804" y="400" width="18" height="18" class="plateau"/><text x="832" y="415" class="t tiny">पठार</text>
<rect x="940" y="400" width="18" height="18" class="desert"/><text x="968" y="415" class="t tiny">मरुस्थल</text>

