<path d="M365 430 L395 474 L420 522 L447 568 L470 616 L496 664 L473 648 L450 616 L428 586 L405 554 L382 519 L363 480 L344 442 Z" class="coast"/>
<path d="M642 356 L661 389 L635 430 L610 467 L582 505 L563 550 L541 585 L521 629 L496 664 L516 642 L538 607 L560 574 L586 543 L611 505 L639 470 L666 429 L688 391 L700 349 L682 350 Z" class="coast"/>

<!-- major rivers for spatial cue -->
<path d="M342 389 C430 395 490 398 561 389 C612 382 648 365 681 340" class="river"/>
<path d="M492 330 C492 372 501 416 520 463 C530 492 536 525 541 556" class="river"/>
<path d="M375 426 C392 451 404 472 420 501" class="river"/>

<!-- region labels -->
<g>
 <rect x="386" y="185" width="170" height="48" class="call" rx="12"/>
