<text x="770" y="382" class="t lab" fill="#387b99">बंगाल की खाड़ी</text>
<text x="472" y="700" class="t lab" fill="#387b99">हिन्द महासागर</text>

<!-- desert callout -->
<rect x="84" y="420" width="220" height="108" class="call" rx="14"/>
<text x="104" y="449" class="t lab">भारतीय मरुस्थल</text>
<text x="104" y="476" class="t small">राजस्थान के पश्चिम में</text>
<text x="104" y="501" class="t small">लूनी प्रमुख नदी</text>

<!-- islands -->
<ellipse cx="885" cy="548" rx="12" ry="38" class="island" transform="rotate(18 885 548)"/>
<ellipse cx="911" cy="575" rx="10" ry="28" class="island" transform="rotate(24 911 575)"/>
<ellipse cx="958" cy="590" rx="12" ry="24" class="island" transform="rotate(16 958 590)"/>
