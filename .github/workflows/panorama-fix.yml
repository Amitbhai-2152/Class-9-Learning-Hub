name: Panorama Runtime Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch Chapter 1
        run: python3 -c "from pathlib import Path; p=Path('src/english/EnglishPanoramaChapter1.jsx'); t=p.read_text(encoding='utf-8'); t=t.replace(\"import React,{useMemo,useState} from 'react';\",\"import React,{useEffect,useMemo,useState} from 'react';\",1); p.write_text(t,encoding='utf-8')"
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/english/EnglishPanoramaChapter1.jsx
          git diff --cached --quiet || (git commit -m 'Fix Panorama Chapter 1 runtime randomization' && git push)