name: Prepare Varnika assessment path
on:
  push:
    branches: [fix/hindi-varnika-assessment-final3]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename Varnika assessment component
        run: |
          set -e
          if [ -f src/HindiVarnikaChapter12View.js ] && [ -f src/HindiVarnikaChapter12View.jsx ]; then
            mv src/HindiVarnikaChapter12View.jsx src/HindiVarnikaChapter12LearnLegacy.jsx
            mv src/HindiVarnikaChapter12View.js src/HindiVarnikaChapter12View.jsx
            sed -i "s#./HindiVarnikaChapter12View.jsx#./HindiVarnikaChapter12LearnLegacy.jsx#" src/HindiVarnikaChapter12View.jsx
            rm -f .github/workflows/prepare-varnika-path.yml .github/workflows/fix-varnika-assessment-path.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'fix: route Varnika chapters 1-2 to dedicated assessments' || true
            git push origin HEAD:fix/hindi-varnika-assessment-final3
          fi
