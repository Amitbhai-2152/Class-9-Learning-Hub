name: Apply Panorama Study Language

on:
  push:
    paths:
      - '.github/workflows/apply-panorama-language.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply separate English and Hindi blocks
        run: |
          node <<'NODE'
          const fs=require('fs');
          const helper=fs.readFileSync('scripts/normalizePanoramaStudy.mjs','utf8');
          const start=helper.indexOf('const sections=');
          const end=helper.indexOf('};',start)+2;
          if(start<0||end<2)throw new Error('Could not read Panorama study mapping');
          const sections=Function(helper.slice(start,end).replace('const sections=','return '))();
          const pairs=Object.values(sections);
          const path='src/english/EnglishPanoramaChapter1.jsx';
          let text=fs.readFileSync(path,'utf8');
          const re=/flow:'[^']*',\n\s*explanation:'[^']*'/g;
          let i=0;
          text=text.replace(re,()=>{
            if(i>=pairs.length)return arguments[0];
            const [flow,explanation]=pairs[i++];
            return `flow:'${flow}',\n      explanation:'${explanation}'`;
          });
          if(i!==pairs.length)throw new Error(`Expected ${pairs.length} reading blocks but updated ${i}`);
          fs.writeFileSync(path,text);
          console.log(`Updated ${i} guided-reading blocks.`);
          NODE
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/english/EnglishPanoramaChapter1.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Separate English reading from Hindi explanation [skip ci]"
          git push
