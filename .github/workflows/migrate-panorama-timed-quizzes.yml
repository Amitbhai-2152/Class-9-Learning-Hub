name: Migrate Panorama timed quizzes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace only Panorama Chapter 1 and 2 quiz shells
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def migrate(path, component_name, title, meta_name, study_name):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              import_line="import PanoramaTimedQuiz from './PanoramaTimedQuiz.jsx';\n"
              if import_line not in text:
                  text=text.replace("import './english-panorama.css';\n", "import './english-panorama.css';\n"+import_line, 1)
              start=text.index(f'export function {component_name}')
              end=text.index(f'export const {meta_name}', start)
              suffix=text[end:]
              meta_start=suffix.index('\nexport const '+study_name)
              suffix=suffix[:meta_start]+'\nexport const '+study_name+suffix[meta_start+len('\nexport const '+study_name):]
              component=f'''export function {component_name}({{initialMode=null,onBack,addXp,finishSession}}) {{
  const [mode,setMode]=useState(initialMode||'learn');
  const begin=m=>setMode(m);
  const banks={{practice,challenge,test:finalTest}};
  if(mode==='learn'||mode===null) return <div className="pg-shell">
    <header className="pg-hero"><div className="pg-kicker">THE PANORAMA • PROSE {1 if 'Chapter1' in component_name else 2}</div><h1>{{study.title}}</h1><p>{{study.author}} · Complete guided study</p></header>
    <div className="pg-modebar">
      <button className="{{mode==='learn'?'active':''}}" onClick={{()=>begin('learn')}}><b>Learn</b><span>पूरा chapter समझें</span></button>
      <button onClick={{()=>begin('practice')}}><b>Practice</b><span>{{practice.length}} questions • Easy → Moderate</span></button>
      <button onClick={{()=>begin('challenge')}}><b>Challenge</b><span>{{challenge.length}} questions • Moderate → Hard</span></button>
      <button onClick={{()=>begin('test')}}><b>Final Test</b><span>{{finalTest.length}} questions • Exam Level</span></button>
    </div>
    <button className="pg-back" onClick={{onBack}}>← English books</button><StudyView/>
  </div>;
  return <PanoramaTimedQuiz mode={{mode}} title={{study.title}} bank={{banks[mode]}} onBack={{()=>setMode('learn')}} addXp={{addXp}} finishSession={{finishSession}}/>;
}}

'''
              p.write_text(text[:start]+component+suffix,encoding='utf-8')

          migrate('src/english/EnglishPanoramaChapter1.jsx','EnglishPanoramaChapter1','Dharam Juddha','englishPanoramaChapter1Meta','englishPanoramaChapter1Study')
          migrate('src/english/EnglishPanoramaChapter2.jsx','EnglishPanoramaChapter2','Yayati','englishPanoramaChapter2Meta','englishPanoramaChapter2Study')

          # Remove the earlier DOM-level workaround and one-time repair workflow.
          Path('src/english/englishChapter1OptionRandomizer.js').unlink(missing_ok=True)
          main=Path('src/main2.jsx')
          main_text=main.read_text(encoding='utf-8').replace("import './english/englishChapter1OptionRandomizer.js';\n",'',1)
          main.write_text(main_text,encoding='utf-8')
          Path('.github/workflows/fix-english-ch1-randomization.yml').unlink(missing_ok=True)
          Path('.github/workflows/repair-panorama-randomization.yml').unlink(missing_ok=True)

          # Self-remove this migration workflow after the migration commit.
          Path('.github/workflows/migrate-panorama-timed-quizzes.yml').unlink(missing_ok=True)

          import subprocess
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','.'],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode==0:
              print('No migration changes needed.')
          else:
              subprocess.run(['git','commit','-m','Migrate Panorama Chapter 1 and 2 to timed quiz engine'],check=True)
              subprocess.run(['git','push'],check=True)
          PY
