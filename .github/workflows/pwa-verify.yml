name: Verify Learning Hub PWA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'supabase/**'
      - 'scripts/qaCrossDeviceSync.mjs'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/pwa-verify.yml'

permissions:
  contents: read

jobs:
  pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Cross-device XP and streak QA
        run: npm run qa:cross-device-sync

      - name: Verify cross-device sync contracts
        run: |
          set -euo pipefail
          grep -q "getXPRoutine,mergeXPRoutines,restoreXPRoutine" src/engines/progress/supabaseSync.js
          grep -q "best_streak" src/engines/progress/supabaseSync.js
          grep -q "active_day_history" src/engines/progress/supabaseSync.js
          grep -q "claimed_level_rewards" src/engines/progress/supabaseSync.js
          grep -q "claimed_streak_rewards" src/engines/progress/supabaseSync.js
          grep -q "add column if not exists best_streak" supabase/004_cross_device_xp_streak_sync.sql
          grep -q "add column if not exists active_day_history" supabase/004_cross_device_xp_streak_sync.sql

      - name: Build web application
        run: npm run build

      - name: Verify PWA assets and APK removal from learner UI
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/app-icon.png
          grep -q 'app-icon.png' dist/manifest.webmanifest
          if grep -R -n -E 'android-latest|app-debug\.apk|Download Android App' src index.html; then
            echo 'APK download UI reference found in learner-facing source.'
            exit 1
          fi
          grep -q 'Install Learning Hub' src/DownloadAppButton.jsx
          grep -q 'beforeinstallprompt' src/DownloadAppButton.jsx
          echo 'Targeted PWA, cross-device, and asset verification passed.'
