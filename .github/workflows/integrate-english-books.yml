name: Integrate English books
on:
  push:
    branches: [main]
    paths: ['.github/workflows/integrate-english-books.yml']
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Integrate English books') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch English navigation
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/App.jsx'); s=p.read_text(encoding='utf-8')
          imp="import {EnglishReaderChapter1} from './english/EnglishReaderChapter1';"
          if "EnglishSubjectSection" not in s:
              s=s.replace(imp, imp+"\nimport {EnglishSubjectSection} from './english/EnglishSubjectSection';",1)
          old="const isHindi=subject?.id==='hindi';const isSanskrit=subject?.id==='sanskrit';if(isHindi)return"
          new="const isHindi=subject?.id==='hindi';const isSanskrit=subject?.id==='sanskrit';const isEnglish=subject?.id==='english';if(isHindi)return"
          if old in s: s=s.replace(old,new,1)
          marker="if(isHindi)return <Simple title={subject.name} back={back}><HindiSubjectSection open={open}/></Simple>;if(isSanskrit)return <Simple title={subject.name} back={back}><SanskritSubjectSection open={open}/></Simple>;"
          if marker in s and "EnglishSubjectSection open={open}" not in s:
              s=s.replace(marker,marker+"if(isEnglish)return <Simple title={subject.name} back={back}><EnglishSubjectSection open={open}/></Simple>;",1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Integrate English books into subject page [skip ci]'
          git push
# trigger