name: Wire Yayati Chapter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !startsWith(github.event.head_commit.message, 'feat: wire English Panorama Chapter 2') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Chapter 2 without touching existing UI/content
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          s=p.read_text(encoding='utf-8')
          old="import {EnglishPanoramaChapter1} from './english/EnglishPanoramaChapter1';"
          new=old+"\nimport {EnglishPanoramaChapter2} from './english/EnglishPanoramaChapter2';"
          if old not in s: raise SystemExit('Chapter 1 import anchor missing')
          if "from './english/EnglishPanoramaChapter2'" not in s: s=s.replace(old,new,1)
          old2="if(subject?.id==='english'&&chapter==='Panorama • Prose 1 Dharam Juddha')return <Simple title={chapter} back={back}><EnglishPanoramaChapter1 initialMode={mode} onBack={back} addXp={addXp} finishSession={finishSession}/></Simple>;"
          new2=old2+"if(subject?.id==='english'&&chapter==='Panorama • Prose 2 Yayati')return <Simple title={chapter} back={back}><EnglishPanoramaChapter2 initialMode={mode} onBack={back} addXp={addXp} finishSession={finishSession}/></Simple>;"
          if old2 not in s: raise SystemExit('Chapter 1 routing anchor missing')
          if "chapter==='Panorama • Prose 2 Yayati'" not in s: s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git diff -- src/App.jsx src/english/EnglishPanoramaChapter2.jsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          git rm .github/workflows/wire-yayati.yml
          git commit -m 'feat: wire English Panorama Chapter 2'
          git push
