name: One-time Quiz Option Shuffle

on:
  push:
    paths:
      - '.github/workflows/quiz-shuffle-trigger.txt'

permissions:
  contents: write

jobs:
  shuffle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shuffle assessment options
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('src/english/EnglishTensesTopic.jsx'),
              Path('src/english/EnglishModalsTopic.jsx'),
              Path('src/english/EnglishActivePassiveTopic.jsx'),
          ]

          option_re = re.compile(
              r"\[(?:'((?:\\'|[^'])*)'|\"((?:\\\"|[^\"])*)\"),"
              r"(?:'((?:\\'|[^'])*)'|\"((?:\\\"|[^\"])*)\"),"
              r"(?:'((?:\\'|[^'])*)'|\"((?:\\\"|[^\"])*)\"),"
              r"(?:'((?:\\'|[^'])*)'|\"((?:\\\"|[^\"])*)\")\],0,"
          )

          changed_total = 0
          for path in files:
              text = path.read_text(encoding='utf-8')
              counter = 0

              def repl(m):
                  nonlocal counter
                  vals = [
                      next(g for g in (m.group(1), m.group(2)) if g is not None),
                      next(g for g in (m.group(3), m.group(4)) if g is not None),
                      next(g for g in (m.group(5), m.group(6)) if g is not None),
                      next(g for g in (m.group(7), m.group(8)) if g is not None),
                  ]
                  # The existing banks mark the first option as correct (index 0).
                  # Rotate deterministically so the correct answer cycles A/B/C/D.
                  shift = (counter * 3 + 1) % 4
                  order = [(i + shift) % 4 for i in range(4)]
                  shuffled = [vals[i] for i in order]
                  correct_index = order.index(0)
                  counter += 1
                  return '[' + ','.join("'" + v.replace("'", "\\'") + "'" for v in shuffled) + f'],{correct_index},'

              new_text, n = option_re.subn(repl, text)
              if n:
                  path.write_text(new_text, encoding='utf-8')
                  changed_total += n
                  print(f'{path}: shuffled {n} questions')
              else:
                  print(f'{path}: no matching question entries found')

          if changed_total < 30:
              raise SystemExit(f'Only {changed_total} questions changed; refusing to commit a partial fix.')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/quiz-option-shuffle.yml

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/english/EnglishTensesTopic.jsx src/english/EnglishModalsTopic.jsx src/english/EnglishActivePassiveTopic.jsx .github/workflows/quiz-option-shuffle.yml
          git diff --cached --quiet && echo 'No changes to commit.' && exit 0
          git commit -m 'fix(english): distribute quiz answers across options'
          git push origin HEAD:main
