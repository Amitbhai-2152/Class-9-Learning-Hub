name: Verify Learning Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Science content QA
        run: npm run qa:science
      - name: Hindi gadhya content QA
        run: npm run qa:hindi:gadhya
      - name: Hindi kavya content QA
        run: npm run qa:hindi:kavya
      - name: Hindi Varnika content QA
        run: npm run qa:hindi:varnika
      - name: Hindi grammar content QA
        run: npm run qa:hindi:grammar
      - name: Hindi grammar dedicated-page QA
        run: npm run qa:hindi:grammar:dedicated
      - name: Hindi unseen passage QA
        run: npm run qa:hindi:unseen
      - name: Civics content QA
        run: npm run qa:civics
      - name: Economics content QA
        run: npm run qa:economics
      - name: SST full audit QA
        run: npm run qa:sst
      - name: History subjective QA
        run: node scripts/qaHistorySubjective.mjs
      - name: Sanskrit content QA
        run: npm run qa:sanskrit
      - name: Sanskrit Grammar QA
        run: npm run qa:sanskrit:grammar
      - name: English content QA
        run: npm run qa:english
      - name: English Reader QA
        run: npm run qa:english:reader
      - name: English Phase 2 pedagogy QA
        run: npm run qa:english:phase2
      - name: English Phase 3 prose revision QA
        run: npm run qa:english:phase3
      - name: English Phase 4 language QA
        run: npm run qa:english:phase4
      - name: English Phase 5 language QA
        run: npm run qa:english:phase5
      - name: English language skills quality QA
        run: npm run qa:english:language-skills-quality
      - name: Reasoning content and wiring QA
        run: npm run qa:reasoning
      - name: Canonical subject progress QA
        run: npm run qa:subject-progress
      - name: Canonical subject analytics QA
        run: npm run qa:subject-analytics
      - name: Canonical subject runtime QA
        run: npm run qa:subject-runtime
      - name: Canonical legacy migration QA
        run: npm run qa:subject-legacy-migration
      - name: Canonical subject catalog QA
        run: npm run qa:subject-catalog
      - name: Supabase progress contract QA
        run: npm run qa:supabase-contract
      - name: Preparation meter QA
        run: npm run qa:preparation-meter
      - name: XP Phase 1 QA
        run: npm run qa:xp
      - name: XP Phase 2 Smart Rules QA
        run: npm run qa:xp:phase2
      - name: Build application
        run: npm run build
      # English, reasoning, canonical progress, analytics, runtime coverage, legacy migration, homepage/chapter catalog, Supabase contract, preparation meter, and XP integrity are included in full verification.
      # XP remains local-first; the Supabase XP files define the backend contract only until a client is intentionally enabled.
