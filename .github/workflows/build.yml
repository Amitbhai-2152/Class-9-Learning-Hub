name: Verify Learning Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Science content QA
        run: npm run qa:science
      - name: Hindi gadhya content QA
        run: npm run qa:hindi:gadhya
      - name: Hindi kavya content QA
        run: npm run qa:hindi:kavya
      - name: Hindi Varnika content QA
        run: npm run qa:hindi:varnika
      - name: Hindi grammar content QA
        run: npm run qa:hindi:grammar
      - name: Hindi grammar dedicated-page QA
        run: npm run qa:hindi:grammar:dedicated
      - name: Hindi unseen passage QA
        run: npm run qa:hindi:unseen
      - name: Civics content QA
        run: npm run qa:civics
      - name: Economics content QA
        run: npm run qa:economics
      - name: SST structure QA
        run: npm run qa:sst:structure
      - name: SST data QA
        run: npm run qa:sst:data
      - name: SST engine QA
        run: npm run qa:sst:engines
      - name: SST wiring QA
        run: npm run qa:sst:wiring
      - name: History subjective QA
        run: node scripts/qaHistorySubjective.mjs
      - name: Sanskrit content QA
        run: npm run qa:sanskrit
      - name: Sanskrit Grammar QA
        run: npm run qa:sanskrit:grammar
      - name: English content QA
        run: npm run qa:english
      - name: English Reader QA
        run: npm run qa:english:reader
      - name: English Phase 2 pedagogy QA
        run: npm run qa:english:phase2
      - name: English Phase 3 prose revision QA
        run: npm run qa:english:phase3
      - name: English Phase 4 language QA
        run: npm run qa:english:phase4
      - name: English Phase 5 language skills QA
        run: npm run qa:english:phase5
      - name: Build application
        run: npm run build
      # English modules included in full verification
      # Trigger a fresh full run after Reader QA contract alignment.
