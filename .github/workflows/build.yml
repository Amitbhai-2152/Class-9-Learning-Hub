name: Verify Learning Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Science content QA
        run: npm run qa:science
      - name: Hindi gadhya content QA
        run: npm run qa:hindi:gadhya
      - name: Hindi kavya content QA
        run: npm run qa:hindi:kavya
      - name: Hindi Varnika content QA
        run: npm run qa:hindi:varnika
      - name: Hindi grammar content QA
        run: npm run qa:hindi:grammar
      - name: Hindi grammar dedicated-page QA
        run: npm run qa:hindi:grammar:dedicated
      - name: Hindi unseen passage QA
        run: npm run qa:hindi:unseen
      - name: Civics content QA
        run: npm run qa:civics
      - name: Economics content QA
        run: npm run qa:economics
      - name: SST structure QA
        run: npm run qa:sst:structure
      - name: SST data QA
        run: npm run qa:sst:data
      - name: SST engine QA
        run: npm run qa:sst:engines
      - name: SST wiring QA
        run: npm run qa:sst:wiring
      - name: Build application
        run: npm run build
