name: Verify Learning Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Science content QA
        run: npm run qa:science
      - name: Hindi gadhya content QA
        run: npm run qa:hindi:gadhya
      - name: Hindi kavya content QA
        run: npm run qa:hindi:kavya
      - name: Build application
        run: npm run build
