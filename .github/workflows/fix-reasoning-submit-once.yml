name: Repair Reasoning Quiz UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch reasoning quiz flow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/ReasoningLabV2.jsx')
          s=p.read_text(encoding='utf-8')
          if 'questionIndex' not in s:
              old="const[chapterId,setChapterId]=useState(chapterInitial);const[mode,setMode]=useState(modeInitial);const[session,setSession]=useState(null);const[answers,setAnswers]=useState({});const answersRef=useRef({});const[score,setScore]=useState(0);const[completed,setCompleted]=useState(false);const[testStarted,setTestStarted]=useState(false);const[timeLeft,setTimeLeft]=useState(TIMER_CONFIG.practice.minutes*60);"
              new="const[chapterId,setChapterId]=useState(chapterInitial);const[mode,setMode]=useState(modeInitial);const[session,setSession]=useState(null);const[answers,setAnswers]=useState({});const answersRef=useRef({});const[score,setScore]=useState(0);const[completed,setCompleted]=useState(false);const[testStarted,setTestStarted]=useState(false);const[timeLeft,setTimeLeft]=useState(TIMER_CONFIG.practice.minutes*60);const[questionIndex,setQuestionIndex]=useState(0);const[reviewFilter,setReviewFilter]=useState('all');"
              if old not in s: raise SystemExit('State anchor not found')
              s=s.replace(old,new,1)
          old="const resetQuiz=()=>{setSession(null);setAnswers({});answersRef.current={};setScore(0);setCompleted(false);setTestStarted(false)};"
          if old in s:
              new="const resetQuiz=()=>{setSession(null);setAnswers({});answersRef.current={};setScore(0);setCompleted(false);setTestStarted(false);setQuestionIndex(0);setReviewFilter('all')};"
              s=s.replace(old,new,1)
          quiz=re.compile(r"\{session&&testStarted&&<section className=\"rlab-quiz\">.*?</section>\}\s*\{completed&&",re.S)
          new_quiz='''{session&&testStarted&&<section className="rlab-quiz"><div className="quiz-top"><div><b>{mode==='test'?'FINAL TEST':mode==='practice'?'PRACTICE':'CHALLENGE'}</b><span>Question {questionIndex+1} of {session.length} • {Object.keys(answers).length} answered</span></div><div className={`countdown ${timeLeft<=60?'danger':''}`}>⏱️ {mm}:{ss}</div></div><div className="progressbar"><span style={{width:`${((questionIndex+1)/session.length)*100}%`}}/></div>{session[questionIndex]&&<div className="question-card"><div className="q-meta">Q{questionIndex+1} <span>{session[questionIndex].difficulty}</span></div><h3>{session[questionIndex].question}</h3><div className="options">{session[questionIndex].options.map((o,j)=><button type="button" key={j} className={answers[questionIndex]?.text===o.text?'selected':''} onClick={()=>choose(questionIndex,o)}><span>{String.fromCharCode(65+j)}</span>{o.text}</button>)}</div></div>}<div className="quiz-navigation"><button type="button" className="nav-btn" disabled={questionIndex===0} onClick={()=>setQuestionIndex(i=>Math.max(0,i-1))}>← Previous</button><div className="question-dots">{session.map((_,i)=><button type="button" key={i} className={`${i===questionIndex?'active':''} ${answers[i]?'done':''}`} onClick={()=>setQuestionIndex(i)}>{i+1}</button>)}</div><button type="button" className="nav-btn" disabled={questionIndex===session.length-1} onClick={()=>setQuestionIndex(i=>Math.min(session.length-1,i+1))}>Next →</button></div><div className="submit-panel"><div><b>{Object.keys(answers).length}/{session.length} answered</b><span>{Object.keys(answers).length===session.length?'All questions answered. Ready to submit.':'Unanswered questions will be marked as skipped.'}</span></div><button type="button" className="submit-main" onClick={()=>finish(false)}>Submit {mode==='test'?'Final Test':mode==='practice'?'Practice':'Challenge'} ✓</button></div></section>}{completed&&'''
          s,n=quiz.subn(new_quiz,s,1)
          if n!=1: raise SystemExit('Quiz block replacement failed')
          result=re.compile(r"\{completed&&<section className=\"rlab-result\">.*?</section>\}\s*</main>",re.S)
          new_result='''{completed&&<section className="rlab-result"><div className="result-hero"><div><span>RESULT • {mode==='test'?'FINAL TEST':mode==='practice'?'PRACTICE':'CHALLENGE'}</span><h2>Attempt Complete</h2></div><div className="result-score"><strong>{score}/{session?.length||0}</strong><small>{session?.length?Math.round(score/session.length*100):0}%</small></div></div><div className="result-metrics"><div><strong>{score}</strong><span>Correct</span></div><div><strong>{Math.max(0,Object.keys(answers).length-score)}</strong><span>Wrong</span></div><div><strong>{Math.max(0,(session?.length||0)-Object.keys(answers).length)}</strong><span>Skipped</span></div></div><div className="review-head"><div><h3>📋 Answer Review</h3><p>Review every question with your answer, the correct answer and the explanation.</p></div><div className="review-filters">{[['all','All'],['correct','✓ Correct'],['wrong','✗ Wrong'],['skipped','— Skipped']].map(([f,l])=><button type="button" className={reviewFilter===f?'active':''} onClick={()=>setReviewFilter(f)} key={f}>{l}</button>)}</div></div><div className="review-list">{session.map((q,i)=>{const picked=answers[i];const status=!picked?'skipped':picked.correct?'correct':'wrong';if(reviewFilter!=='all'&&reviewFilter!==status)return null;return <article key={i} className={`review-card ${status}`}><div className="review-top"><b>Q{i+1}</b><span>{status==='correct'?'✓ Correct':status==='wrong'?'✗ Wrong':'— Skipped'}</span></div><h4>{q.question}</h4><div className="review-answer"><div><small>Your answer</small><strong>{picked?picked.text:'Not answered'}</strong></div><div><small>Correct answer</small><strong>{q.correct}</strong></div></div>{q.explanation&&<div className="review-explain">💡 {q.explanation}</div>}</article>})}</div><div className="result-actions"><button type="button" onClick={()=>{resetQuiz();setMode('learn')}}>← Back to Chapter</button><button type="button" onClick={()=>begin(mode)}>↻ Try Again</button></div></section>}</main>'''
          s,n=result.subn(new_result,s,1)
          if n!=1: raise SystemExit('Result block replacement failed')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Build
        run: |
          npm install --legacy-peer-deps
          npm run build
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ReasoningLabV2.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: add reasoning submit button and result review'
          git push
