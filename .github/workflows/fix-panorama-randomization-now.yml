name: Fix Panorama Randomization Now

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Chapter 1 React quiz
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path = Path('src/english/EnglishPanoramaChapter1.jsx')
          text = path.read_text(encoding='utf-8')

          old = '''function shuffleQuestion(q,i){
  const shift=(i*3)%q.o.length;
  const o=q.o.map((_,idx)=>q.o[(idx+shift)%q.o.length]);
  const a=(q.a-shift+q.o.length)%q.o.length;
  return {...q,o,a};
}'''
          new = '''function shuffleQuestion(q){
  const options=q.o.map((text,sourceIndex)=>({text,sourceIndex}));
  for(let i=options.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [options[i],options[j]]=[options[j],options[i]];
  }
  if(options.length>1&&options.every((item,index)=>item.sourceIndex===index)){
    [options[0],options[1]]=[options[1],options[0]];
  }
  return {
    ...q,
    o:options.map(item=>item.text),
    a:options.findIndex(item=>item.sourceIndex===q.a)
  };
}'''
          if old not in text:
              raise SystemExit('Old Chapter 1 shuffle helper not found')
          text=text.replace(old,new,1)

          old_block = '''  const [score,setScore]=useState(0);
  const [result,setResult]=useState(null);
  const bank=useMemo(()=>mode==='practice'?practice:mode==='challenge'?challenge:mode==='test'?finalTest:[],[mode]);
  const current=bank[idx]?shuffleQuestion(bank[idx],idx):null;
  const begin=m=>{setMode(m);setIdx(0);setSelected(null);setScore(0);setResult(null)};'''
          new_block = '''  const [score,setScore]=useState(0);
  const [result,setResult]=useState(null);
  const [quizRun,setQuizRun]=useState(0);
  const bank=useMemo(()=>mode==='practice'?practice:mode==='challenge'?challenge:mode==='test'?finalTest:[],[mode]);
  const current=useMemo(()=>bank[idx]?shuffleQuestion(bank[idx]):null,[bank,idx,quizRun]);
  const begin=m=>{setMode(m);setIdx(0);setSelected(null);setScore(0);setResult(null);setQuizRun(r=>r+1)};'''
          if old_block not in text:
              raise SystemExit('Old Chapter 1 quiz state block not found')
          text=text.replace(old_block,new_block,1)
          path.write_text(text,encoding='utf-8')

          main=Path('src/main2.jsx')
          main_text=main.read_text(encoding='utf-8').replace("import './english/englishChapter1OptionRandomizer.js';\n",'',1)
          main.write_text(main_text,encoding='utf-8')
          Path('src/english/englishChapter1OptionRandomizer.js').unlink(missing_ok=True)
          Path('.github/workflows/fix-english-ch1-randomization.yml').unlink(missing_ok=True)
          Path('.github/workflows/repair-panorama-randomization.yml').unlink(missing_ok=True)

          result=path.read_text(encoding='utf-8')
          assert 'function shuffleQuestion(q){' in result
          assert 'Math.random()' in result
          assert 'sourceIndex' in result
          assert 'const [quizRun,setQuizRun]=useState(0);' in result
          assert 'const current=useMemo(()=>bank[idx]?shuffleQuestion(bank[idx]):null,[bank,idx,quizRun]);' in result
          assert 'englishChapter1OptionRandomizer' not in main.read_text(encoding='utf-8')

          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','src/english/EnglishPanoramaChapter1.jsx','src/main2.jsx','src/english/englishChapter1OptionRandomizer.js','.github/workflows/fix-english-ch1-randomization.yml','.github/workflows/repair-panorama-randomization.yml'],check=True)
          subprocess.run(['git','commit','-m','Fix Panorama Chapter 1 option randomization'],check=True)
          subprocess.run(['git','push'],check=True)
          PY

      - name: Remove this one-time workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-panorama-randomization-now.yml
          git commit -m 'Remove one-time Panorama randomization workflow'
          git push
