name: Wire Phase 4 Grammar Banks

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire dedicated phase 4 banks
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/english/EnglishGenericLanguageSkillsQuiz.jsx')
          s=p.read_text(encoding='utf-8')
          if "import {PHASE4_BANKS} from './EnglishGenericLanguageSkillsBanks.jsx';" not in s:
              s=s.replace("import React,{useMemo}from'react';import EnglishTimedQuiz from'./EnglishTimedQuiz.jsx';", "import React,{useMemo}from'react';import EnglishTimedQuiz from'./EnglishTimedQuiz.jsx';import {PHASE4_BANKS} from './EnglishGenericLanguageSkillsBanks.jsx';", 1)
          old="const getBank=useMemo(()=>mode=>rotateForMode(topic.banks.practice,mode),[topic]);"
          new="const dedicatedBank=PHASE4_BANKS[topicId];const getBank=useMemo(()=>mode=>dedicatedBank?.[mode]||rotateForMode(topic.banks.practice,mode),[topic,dedicatedBank]);"
          if old not in s: raise SystemExit('Expected getBank line not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          q=Path('scripts/qaEnglishPhase5LanguageSkills.mjs')
          qs=q.read_text(encoding='utf-8')
          if "genericBanks" not in qs:
              qs=qs.replace("const subject=fs.readFileSync('src/english/EnglishSubjectSection.jsx','utf8');", "const subject=fs.readFileSync('src/english/EnglishSubjectSection.jsx','utf8');\nconst generic=fs.readFileSync('src/english/EnglishGenericLanguageSkillsQuiz.jsx','utf8');\nconst genericBanks=fs.readFileSync('src/english/EnglishGenericLanguageSkillsBanks.jsx','utf8');", 1)
          marker="if(!timedQuiz.includes('answered')||!timedQuiz.includes('percent'))errors.push('Timed quiz score/percentage review missing');"
          inject=marker+"\n\nconst phase4Topics=['agreement','determiners','prepositions','idioms','translation'];\nif(!generic.includes('PHASE4_BANKS'))errors.push('Generic quiz wrapper is not wired to dedicated Phase 4 banks');\nfor(const id of phase4Topics){const block=new RegExp(`${id}:\\\\{[\\\\s\\\\S]*?\\\\n\\\\}`);if(!genericBanks.includes(`${id}:{`))errors.push(`Phase 4 bank missing: ${id}`);}\nconst bankArrays=(genericBanks.match(/(practice|challenge|test):\\\\[/g)||[]).length;if(bankArrays<15)errors.push(`Phase 4 dedicated bank sections incomplete: ${bankArrays}/15 minimum");"
          qs=qs.replace(marker,inject,1)
          q.write_text(qs,encoding='utf-8')
      - name: Verify and build
        run: |
          test "$(grep -o "PHASE4_BANKS" src/english/EnglishGenericLanguageSkillsQuiz.jsx | wc -l)" -ge 1
          test "$(grep -o "agreement:" src/english/EnglishGenericLanguageSkillsBanks.jsx | wc -l)" -ge 1
          npm install
          npm run qa:english:phase5
          npm run build
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/english/EnglishGenericLanguageSkillsQuiz.jsx src/english/EnglishGenericLanguageSkillsBanks.jsx scripts/qaEnglishPhase5LanguageSkills.mjs
          git commit -m 'feat(english): wire deeper phase 4 grammar banks'
          git push
