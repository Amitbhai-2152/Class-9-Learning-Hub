name: Phase 5 Subject Catalog Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message != 'refactor(progress): wire canonical subject catalog into App' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App subject catalog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.jsx')
          text = path.read_text(encoding='utf-8')
          marker = "import {cbtConfig} from './cbtConfig';"
          if "import {subjects} from './subjectCatalog';" not in text:
              text = text.replace(marker, marker + "\nimport {subjects} from './subjectCatalog';", 1)
          start = text.index('const subjects=[')
          end = text.index(';\n\nconst initial=', start) + 1
          text = text[:start] + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/phase5-subject-catalog-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx .github/workflows/phase5-subject-catalog-once.yml
          git commit -m 'refactor(progress): wire canonical subject catalog into App' || exit 0
          git push
