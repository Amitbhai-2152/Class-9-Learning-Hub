name: Apply Paragraph Essay Content Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply paragraph essay patch
        run: python scripts/apply-paragraph-essay-content.py
      - name: Verify paragraph essay patch
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('src/english/EnglishParagraphEssayTopic.jsx').read_text(encoding='utf-8')
          required = ['const MODEL_WRITINGS=', 'const HINDI_GUIDE=', 'pe-hindi', 'The first step towards a clean school is proper waste management.', 'Paragraph एक ही मुख्य विचार']
          missing = [x for x in required if x not in s]
          if missing: raise SystemExit(f'Missing: {missing}')
          print('verified')
          PY
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/english/EnglishParagraphEssayTopic.jsx scripts/apply-paragraph-essay-content.py
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'feat(english): expand paragraph essay examples with Hindi guidance'
          git push
