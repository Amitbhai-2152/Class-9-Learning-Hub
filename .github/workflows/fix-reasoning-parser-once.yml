name: Fix Reasoning V2 parser once
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor == 'Amitbhai-2152'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair Reasoning V2 parser block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/ReasoningLabV2.jsx')
          s = p.read_text(encoding='utf-8')

          broken = "tip:'कम-से-कम 3 transitions verify करके answer चुनें।'},\n{id:'alphabet-series'"
          fixed = "tip:'कम-से-कम 3 transitions verify करके answer चुनें।'}},\n{id:'alphabet-series'"
          if broken in s:
              s = s.replace(broken, fixed, 1)
              print('fixed missing chapter brace')
          elif fixed in s:
              print('chapter brace already fixed')
          else:
              raise SystemExit('number-series chapter boundary not found')

          pattern = r" const begin=\(nextMode\)=>.*?\n const mm="
          replacement = """ const begin=(nextMode)=>{\n  setMode(nextMode);\n  setAnswers({});\n  setScore(0);\n  setCompleted(false);\n  if(nextMode==='test'){\n   setSession(prepare(bank,25));\n   setTimeLeft(15*60);\n   setTestStarted(false);\n  }else{\n   setSession(prepare(bank,counts[nextMode]));\n   setTestStarted(true);\n  }\n };\n const startTest=()=>{\n  setAnswers({});\n  setScore(0);\n  setCompleted(false);\n  setSession(prepare(bank,25));\n  setTimeLeft(15*60);\n  setTestStarted(true);\n };\n const finish=(timedOut=false)=>{\n  if(!session)return;\n  const correct=session.reduce((n,q,i)=>n+(answers[i] && answers[i].correct ? 1 : 0),0);\n  setScore(correct);\n  setCompleted(true);\n  finishSession({subject:'reasoning',chapter:active.id,mode,correct,total:session.length,timedOut,at:new Date().toISOString()});\n  addXp(correct);\n  setTestStarted(false);\n };\n useEffect(()=>{\n  if(mode!=='test'||!testStarted||!session)return;\n  const id=setInterval(()=>{\n   setTimeLeft(t=>{\n    if(t<=1){\n     clearInterval(id);\n     finish(true);\n     return 0;\n    }\n    return t-1;\n   });\n  },1000);\n  return()=>clearInterval(id);\n },[mode,testStarted,session]);\n useEffect(()=>{\n  setSession(null);\n  setTestStarted(false);\n  setAnswers({});\n  setScore(0);\n  setCompleted(false);\n },[chapterId]);\n const mm="""
          out, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one state block, found {n}')
          p.write_text(out, encoding='utf-8')
          print('state block normalized', n)
          PY

      - name: Verify with Babel and Vite
        run: |
          npm install --legacy-peer-deps
          npm install --no-save --legacy-peer-deps @babel/parser
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {parse} from '@babel/parser';
          parse(fs.readFileSync('src/ReasoningLabV2.jsx','utf8'),{sourceType:'module',plugins:['jsx']});
          console.log('BABEL_PARSE_OK');
          NODE
          npm run build

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ReasoningLabV2.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: repair Reasoning V2 chapter syntax'
          git push
