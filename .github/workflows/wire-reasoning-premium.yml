name: Wire premium reasoning hub
on:
  push:
    branches: [main]
    paths:
      - 'src/AppWithChapter5.jsx'
      - 'src/ReasoningHubPremium.jsx'
      - '.github/workflows/wire-reasoning-premium.yml'
permissions:
  contents: write
jobs:
  wire:
    if: ${{ github.event.head_commit.message != 'chore: wire premium reasoning import' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch reasoning import
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/AppWithChapter5.jsx')
          s=p.read_text(encoding='utf-8')
          old="import ReasoningHub from'./ReasoningHub.jsx';"
          new="import ReasoningHub from'./ReasoningHubPremium.jsx';"
          if old not in s:
              raise SystemExit('Expected reasoning import not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          print('Premium ReasoningHub wired successfully')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/AppWithChapter5.jsx
          git commit -m 'chore: wire premium reasoning import'
          git push
