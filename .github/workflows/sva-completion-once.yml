name: SVA Completion Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Complete SVA lesson and assessment coverage
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/english/EnglishSubjectVerbAgreementTopic.jsx')
          s=p.read_text(encoding='utf-8')

          old_lesson="""{id:'16',group:'EXAM MASTER',title:'Five-second agreement audit',meaning:'When an agreement question looks difficult, reduce it to the controlling subject. Ignore distracting phrases, identify number, then choose the finite verb. Finally read the whole sentence for meaning.',structure:'1 Find subject → 2 remove distractions → 3 decide singular/plural → 4 choose verb → 5 reread.',examples:[['The box of old books is heavy.','box → singular → is'],['Neither of the answers is correct.','neither → singular → is'],['Either the boys or the teacher is coming.','nearer subject teacher → is'],['There are many reasons.','reasons → plural → are']],clue:'SUBJECT → NUMBER → VERB → MEANING CHECK.'}\n];"""
          new_lesson="""{id:'16',group:'EXAM MASTER',title:'Five-second agreement audit',meaning:'When an agreement question looks difficult, reduce it to the controlling subject. Ignore distracting phrases, identify number, then choose the finite verb. Finally read the whole sentence for meaning.',structure:'1 Find subject → 2 remove distractions → 3 decide singular/plural → 4 choose verb → 5 reread.',examples:[['The box of old books is heavy.','box → singular → is'],['Neither of the answers is correct.','neither → singular → is'],['Either the boys or the teacher is coming.','nearer subject teacher → is'],['There are many reasons.','reasons → plural → are']],clue:'SUBJECT → NUMBER → VERB → MEANING CHECK.'},
{id:'17',group:'SPECIAL AGREEMENT',title:'Many a, more than one and one of…who',meaning:'Some patterns look plural but are grammatically singular in standard school grammar. Many a + singular noun and more than one + singular noun normally take singular verbs. In one of the students who work hard, who refers to students, so the relative-clause verb is plural.',structure:'many a + singular noun + singular verb • more than one + singular noun + singular verb • one of + plural noun + who + plural verb',examples:[['Many a student has worked hard.','many a + student → has'],['More than one student is absent.','more than one + student → is'],['She is one of the students who work hard.','who → students → work'],['She is the only one of the students who works hard.','who → one → works']],clue:'Do not judge by the word nearest the verb; identify the construction and what the relative pronoun refers to.'},
{id:'18',group:'SPECIAL AGREEMENT',title:'Not only…but also and final contrast control',meaning:'With not only…but also and similar paired constructions, agreement commonly follows the subject nearest the finite verb in school-level grammar. Always re-check the grammatical subject before deciding.',structure:'not only A but also B + verb → check B, the nearer subject, for mixed-number pairs.',examples:[['Not only the teacher but also the students are ready.','nearer subject students → are'],['Not only the students but also the teacher is ready.','nearer subject teacher → is'],['The captain, as well as the players, is ready.','as well as is not a compound subject'],['Either the boys or the teacher is coming.','same nearest-subject logic']],clue:'Paired structures need a deliberate nearest-subject check; interrupting phrases do not.'}
];"""
          if old_lesson in s:
              s=s.replace(old_lesson,new_lesson,1)
          elif "id:'18',group:'SPECIAL AGREEMENT'" not in s:
              raise SystemExit('SVA lesson insertion marker not found')

          dup="['The students in my class studies daily.','The students in my class study daily.','The students in my class studies daily.','The students in my class has study daily.']"
          fixed="['The students in my class studies daily.','The students in my class study daily.','The students in my class are studying daily.','The students in my class has studied daily.']"
          if dup in s:
              s=s.replace(dup,fixed,1)

          anchor="\n];\n\nconst bankFor=mode=>mode==='practice'?QUESTIONS.slice(0,15):mode==='challenge'?QUESTIONS.slice(15,30):QUESTIONS.slice(25,45).concat(QUESTIONS.slice(5,25)).slice(0,20);"
          additions="""\nQ('Choose the best completion: “Many a student ___ hard for the exam.”',['study','studies','are studying','have studied'],1,'Many a + singular noun takes a singular verb: studies.'),\nQ('Choose the best completion: “She is one of the students who ___ hard.”',['works','work','is working','has worked'],1,'Who refers to the plural antecedent students, so the relative-clause verb is plural: work.'),"""
          if anchor in s and "Many a student ___ hard for the exam." not in s:
              s=s.replace(anchor, additions+anchor,1)
          elif "Many a student ___ hard for the exam." not in s:
              raise SystemExit('SVA question bank marker not found')

          old_bank="const bankFor=mode=>mode==='practice'?QUESTIONS.slice(0,15):mode==='challenge'?QUESTIONS.slice(15,30):QUESTIONS.slice(25,45).concat(QUESTIONS.slice(5,25)).slice(0,20);"
          new_bank="const bankFor=mode=>mode==='practice'?QUESTIONS.slice(0,15):mode==='challenge'?QUESTIONS.slice(15,27):QUESTIONS.slice(27,47);"
          if old_bank in s:
              s=s.replace(old_bank,new_bank,1)
          elif new_bank not in s:
              raise SystemExit('SVA bank split marker not found')

          p.write_text(s,encoding='utf-8')

      - name: Validate SVA completion
        shell: bash
        run: |
          test -f src/english/EnglishSubjectVerbAgreementTopic.jsx
          test -f src/english/EnglishSubjectVerbAgreementTopic.css
          grep -q "id:'18'" src/english/EnglishSubjectVerbAgreementTopic.jsx
          grep -q "Many a student" src/english/EnglishSubjectVerbAgreementTopic.jsx
          grep -q "QUESTIONS.slice(15,27)" src/english/EnglishSubjectVerbAgreementTopic.jsx
          grep -q "QUESTIONS.slice(27,47)" src/english/EnglishSubjectVerbAgreementTopic.jsx
          node -e "const fs=require('fs'); const s=fs.readFileSync('src/english/EnglishSubjectVerbAgreementTopic.jsx','utf8'); if(!s.includes('Subject–Verb Agreement')||!s.includes('EnglishTimedQuiz')) process.exit(1); console.log('SVA source markers OK')"

      - name: Remove one-time workflow
        shell: bash
        run: rm .github/workflows/sva-completion-once.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/english/EnglishSubjectVerbAgreementTopic.jsx .github/workflows/sva-completion-once.yml
          git commit -m 'feat(english): complete subject verb agreement rules and level split'
          git push

  clauses_ui:
    name: Clauses visual polish
    if: always() && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Sync latest branch tip
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply visual-only Clauses UI
        shell: python
        run: |
          from pathlib import Path
          jsx=Path('src/english/EnglishPanoramaLanguageSkills.jsx')
          css=Path('src/english/EnglishPanoramaLanguageSkills.css')
          s=jsx.read_text(encoding='utf-8')
          old='return <div className="english-language-skills"><button className="english-book-back" onClick={onBack}>← Back to Language & Skills</button>'
          new='return <div className={`english-language-skills english-ls-topic-page english-ls-topic--${topic.id}`}><button className="english-book-back" onClick={onBack}>← Back to Language & Skills</button>'
          if old in s:
              s=s.replace(old,new,1)
              jsx.write_text(s,encoding='utf-8')
          elif 'english-ls-topic--${topic.id}' not in s:
              raise SystemExit('Expected topic wrapper not found')

          c=css.read_text(encoding='utf-8')
          marker='/* === CLAUSES UI POLISH: visual-only, content untouched === */'
          if marker not in c:
              c += r'''

/* === CLAUSES UI POLISH: visual-only, content untouched === */
.english-ls-topic-page.english-ls-topic--clauses{--clause-ink:#172b3d;--clause-line:#d8e5ee;--clause-accent-soft:#e6f1f7;padding-bottom:82px}
.english-ls-topic--clauses .english-ls-topic-hero{min-height:260px;padding:34px 36px 28px;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:radial-gradient(circle at 87% 18%,rgba(182,222,241,.17),transparent 25%),radial-gradient(circle at 8% 90%,rgba(112,171,203,.13),transparent 27%),linear-gradient(135deg,#0f2941 0%,#214c69 57%,#37799d 100%);box-shadow:0 24px 54px rgba(18,55,79,.18)}
.english-ls-topic--clauses .english-ls-topic-hero:before{content:"CLAUSE LAB";position:absolute;right:28px;top:24px;padding:7px 10px;border:1px solid rgba(255,255,255,.17);border-radius:999px;background:rgba(255,255,255,.07);color:#d9ebf5;font-size:.56rem;font-weight:950;letter-spacing:.14em}
.english-ls-topic--clauses .english-ls-topic-hero h1{max-width:760px;margin-bottom:12px;font-size:clamp(2.7rem,5.4vw,4.45rem);line-height:.96}
.english-ls-topic--clauses .english-ls-topic-hero p{max-width:820px;color:#dce9f1;font-size:1rem;line-height:1.75}
.english-ls-topic--clauses .english-ls-lesson-map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:23px;max-height:168px;overflow:auto;padding-right:2px}
.english-ls-topic--clauses .english-ls-lesson-map button{min-height:48px;justify-content:flex-start;padding:9px 11px;text-align:left;border-radius:12px;background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease}
.english-ls-topic--clauses .english-ls-lesson-map button:hover{transform:translateY(-2px);background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
.english-ls-topic--clauses .english-ls-lesson-map button.active{transform:none;box-shadow:0 8px 20px rgba(5,24,39,.2)}
.english-ls-topic--clauses .english-ls-lesson-map button span{flex:0 0 auto;min-width:22px;height:22px;display:grid;place-items:center;border-radius:7px;background:rgba(255,255,255,.1);color:#b7d4e3;font-size:.58rem}
.english-ls-topic--clauses .english-ls-lesson-map button.active span{background:#e7f3f9;color:#285b79}
.english-ls-topic--clauses .english-ls-dock{top:8px;margin-top:18px;margin-bottom:20px;padding:7px;border-radius:18px;border-color:#d5e3ec;background:rgba(247,250,252,.94);box-shadow:0 12px 28px rgba(22,53,75,.09)}
.english-ls-topic--clauses .english-ls-dock button{min-height:48px;font-size:.78rem}
.english-ls-topic--clauses .english-ls-content{grid-template-columns:minmax(0,1.3fr) minmax(290px,.7fr);gap:16px}
.english-ls-topic--clauses .english-ls-lesson-card{min-height:190px;padding:30px 31px 32px;border-radius:21px;border-color:#cddde8;background:linear-gradient(180deg,#fff,#fbfdfe);box-shadow:0 12px 30px rgba(20,50,72,.06)}
.english-ls-topic--clauses .english-ls-lesson-card:before{width:5px;background:linear-gradient(180deg,#6e9fbd,#c2dce9)}
.english-ls-topic--clauses .english-ls-step{min-width:48px;height:31px;background:var(--clause-accent-soft);color:#2b6384;box-shadow:inset 0 0 0 1px #ccdfeb}
.english-ls-topic--clauses .english-ls-lesson-card h2{max-width:780px;margin-top:14px;color:var(--clause-ink);font-size:clamp(1.48rem,2.15vw,1.9rem);line-height:1.28}
.english-ls-topic--clauses .english-ls-lesson-card p{max-width:820px;color:#50677a;font-size:1rem;line-height:1.95}
.english-ls-topic--clauses .english-ls-examples,.english-ls-topic--clauses .english-ls-clinic{border-radius:20px;box-shadow:0 10px 26px rgba(20,50,72,.055)}
.english-ls-topic--clauses .english-ls-examples{border-color:#d4e2eb;background:linear-gradient(180deg,#fff,#f7fbfd)}
.english-ls-topic--clauses .english-ls-clinic{border-color:#ebdfc2;background:linear-gradient(180deg,#fffdf8,#fff8ea)}
.english-ls-topic--clauses .english-ls-examples h2,.english-ls-topic--clauses .english-ls-clinic h2{margin-bottom:13px;color:#27475f;font-size:1.04rem}
.english-ls-topic--clauses .english-ls-example{min-height:56px;padding:12px 13px;border-radius:12px;background:#fbfdfe}
.english-ls-topic--clauses .english-ls-example strong{color:#294b63;font-size:.8rem}
.english-ls-topic--clauses .english-ls-example p{color:#64788a;font-size:.77rem}
.english-ls-topic--clauses .english-ls-clinic>div{padding:12px 13px;border-radius:12px;background:rgba(255,255,255,.66);color:#6b603f;font-size:.77rem;line-height:1.6}
.english-ls-topic--clauses .english-ls-quiz{border-radius:21px;border-color:#cfdfe9;box-shadow:0 14px 34px rgba(20,50,72,.075)}
.english-ls-topic--clauses .english-ls-question h2{color:#233f56;font-size:1.08rem;line-height:1.62}
.english-ls-topic--clauses .english-ls-options button{min-height:49px;padding:13px 14px;border-radius:12px;font-size:.82rem;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease}
.english-ls-topic--clauses .english-ls-options button:hover{transform:translateX(2px);box-shadow:0 6px 15px rgba(22,53,75,.06)}
.english-ls-topic--clauses .english-ls-feedback{border:1px solid #dce6ed;background:#f4f8fb;font-size:.78rem;line-height:1.6}
.english-ls-topic--clauses .english-ls-next{min-height:46px;padding-inline:18px;border-radius:11px;box-shadow:0 8px 18px rgba(18,52,74,.13)}
.english-ls-topic--clauses .english-ls-bottom-nav{gap:12px;margin-top:18px;padding:11px;border-radius:17px}
.english-ls-topic--clauses .english-ls-bottom-nav button{min-height:46px;border-radius:11px;font-size:.77rem}
@media (max-width:900px){.english-ls-topic--clauses .english-ls-lesson-map{grid-template-columns:repeat(3,minmax(0,1fr))}.english-ls-topic--clauses .english-ls-content{grid-template-columns:1fr}}
@media (max-width:640px){.english-ls-topic--clauses .english-ls-topic-hero{padding:25px 19px 20px;border-radius:22px}.english-ls-topic--clauses .english-ls-topic-hero:before{right:16px;top:16px}.english-ls-topic--clauses .english-ls-topic-hero h1{font-size:clamp(2.25rem,12vw,3.15rem)}.english-ls-topic--clauses .english-ls-lesson-map{grid-template-columns:repeat(2,minmax(0,1fr));max-height:222px}.english-ls-topic--clauses .english-ls-lesson-card{padding:24px 21px 25px}.english-ls-topic--clauses .english-ls-lesson-card p{font-size:.93rem;line-height:1.84}.english-ls-topic--clauses .english-ls-dock{top:5px}.english-ls-topic--clauses .english-ls-bottom-nav{flex-direction:column}}
'''
          css.write_text(c,encoding='utf-8')
          print('Clauses visual-only UI patch applied; content unchanged.')

      - name: Commit Clauses UI patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/english/EnglishPanoramaLanguageSkills.jsx src/english/EnglishPanoramaLanguageSkills.css
          if git diff --cached --quiet; then echo 'No Clauses UI diff needed.'; exit 0; fi
          git commit -m 'style(english): redesign clauses topic ui'
          git push origin main
