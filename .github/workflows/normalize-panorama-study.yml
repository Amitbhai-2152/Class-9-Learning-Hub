name: Normalize Panorama Study Language

on:
  push:
    paths:
      - '.github/workflows/normalize-panorama-study.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize guided reading language
        run: node scripts/normalizePanoramaStudy.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/english/EnglishPanoramaChapter1.jsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use separate English and Hindi guided reading blocks [skip ci]"
          git push
