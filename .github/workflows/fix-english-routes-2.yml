name: Fix English routes 2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-english-routes-2.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix App English routes
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/App.jsx')
          s=p.read_text(encoding='utf-8')
          old="if(subject?.id==='sanskrit')return <Simple title={chapter} back={back}><SanskritChapterEngine chapter={chapter} initialMode={mode} onModeChange={changeMode} back={back} addXp={addXp} finishSession={finishSession}/></Simple>;if(isEnglishReader1)return <Simple title={chapter} back={back}><EnglishReaderChapter1 initialMode={mode} onBack={back} addXp={addXp} finishSession={finishSession}/></Simple>;const isEnglishReader1=subject?.id==='english'&&chapter==='Reader • 1 I’m going to dance again';"
          new="if(subject?.id==='sanskrit')return <Simple title={chapter} back={back}><SanskritChapterEngine chapter={chapter} initialMode={mode} onModeChange={changeMode} back={back} addXp={addXp} finishSession={finishSession}/></Simple>;const isEnglishReader1=subject?.id==='english'&&chapter==='Reader • 1 I’m going to dance again';if(isEnglishReader1)return <Simple title={chapter} back={back}><EnglishReaderChapter1 initialMode={mode} onBack={back} addXp={addXp} finishSession={finishSession}/></Simple>;if(subject?.id==='english'&&chapter==='Panorama • Prose 1 Dharam Juddha')return <Simple title={chapter} back={back}><EnglishPanoramaChapter1 initialMode={mode} onBack={back} addXp={addXp} finishSession={finishSession}/></Simple>;"
          if old not in s: raise SystemExit('English chapter route anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/fix-english-routes-2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.jsx .github/workflows/fix-english-routes-2.yml
          git commit -m 'Fix English route ordering [skip ci]'
          git push
