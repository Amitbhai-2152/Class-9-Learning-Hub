name: Fix English Reader syntax
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-english-reader-syntax.yml']
permissions:
  contents: write
jobs:
  fix:
    if: contains(github.event.head_commit.message, 'Fix English Reader syntax') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch syntax
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/english/EnglishReaderChapter1.jsx')
          s=p.read_text(encoding='utf-8')
          old="if(mode==='learn')return <Lesson onBack={()=>setMode(null}/>;"
          new="if(mode==='learn')return <Lesson onBack={()=>setMode(null)}/>;"
          if old not in s: raise SystemExit('syntax anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Remove temp workflow and commit
        shell: bash
        run: |
          rm .github/workflows/fix-english-reader-syntax.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/english/EnglishReaderChapter1.jsx .github/workflows/fix-english-reader-syntax.yml
          git commit -m 'Fix English Reader syntax [skip ci]'
          git push
