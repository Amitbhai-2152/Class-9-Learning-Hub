name: Patch English Chapter 1 Quiz Randomization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix: runtime-randomize English Chapter 1 options') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Chapter 1 safely
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/english/EnglishPanoramaChapter1.jsx')
          text = path.read_text(encoding='utf-8')

          old_helper = """function shuffleQuestion(q,i){
  const shift=(i*3)%q.o.length;
  const o=q.o.map((_,idx)=>q.o[(idx+shift)%q.o.length]);
  const a=(q.a-shift+q.o.length)%q.o.length;
  return {...q,o,a};
}"""
          new_helper = """function shuffleQuestion(q){
  const indexed=q.o.map((option,index)=>({option,index}));
  for(let i=indexed.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [indexed[i],indexed[j]]=[indexed[j],indexed[i]];
  }
  const o=indexed.map(item=>item.option);
  const a=indexed.findIndex(item=>item.index===q.a);
  return {...q,o,a};
}"""
          if old_helper not in text:
              raise SystemExit('Expected shuffleQuestion helper was not found; refusing to modify the file.')
          text=text.replace(old_helper,new_helper,1)

          old_state = """  const [result,setResult]=useState(null);
  const bank=useMemo(()=>mode==='practice'?practice:mode==='challenge'?challenge:mode==='test'?finalTest:[],[mode]);
  const current=bank[idx]?shuffleQuestion(bank[idx],idx):null;
  const begin=m=>{setMode(m);setIdx(0);setSelected(null);setScore(0);setResult(null)};"""
          new_state = """  const [result,setResult]=useState(null);
  const [shuffleNonce,setShuffleNonce]=useState(0);
  const bank=useMemo(()=>mode==='practice'?practice:mode==='challenge'?challenge:mode==='test'?finalTest:[],[mode]);
  const randomizedBank=useMemo(()=>bank.map(q=>shuffleQuestion(q)),[bank,shuffleNonce]);
  const current=randomizedBank[idx]||null;
  const begin=m=>{setMode(m);setIdx(0);setSelected(null);setScore(0);setResult(null);setShuffleNonce(n=>n+1)};"""
          if old_state not in text:
              raise SystemExit('Expected quiz state block was not found; refusing to modify the file.')
          text=text.replace(old_state,new_state,1)

          path.write_text(text,encoding='utf-8')
          PY

          git diff --check
          git diff -- src/english/EnglishPanoramaChapter1.jsx
          test -f .github/workflows/patch-english-randomization.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/english/EnglishPanoramaChapter1.jsx
          git rm .github/workflows/patch-english-randomization.yml
          git commit -m 'fix: runtime-randomize English Chapter 1 options'
          git push
