name: Wire English Chapter 1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-english-app.yml']
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Wire Panorama Chapter 1') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App.jsx
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/App.jsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace("import {EnglishReaderChapter1} from './english/EnglishReaderChapter1';", "import {EnglishReaderChapter1} from './english/EnglishReaderChapter1';\nimport {EnglishPanoramaChapter1} from './english/EnglishPanoramaChapter1';", 1)
          old="const isMath=subject?.id==='math';const isHindi=subject?.id==='hindi';const isSanskrit=subject?.id==='sanskrit';const isEnglish=subject?.id==='english';"
          new=old+"const isPanoramaProse1=subject?.id==='english'&&chapter==='Panorama • Prose 1 Dharam Juddha';"
          old2="if(subject?.id==='sanskrit')return <Simple title={chapter} back={back}><SanskritChapterEngine chapter={chapter} initialMode={mode} onModeChange={changeMode} back={back} addXp={addXp} finishSession={finishSession}/></Simple>;if(isEnglishReader1)return <Simple title={chapter} back={back}><EnglishReaderChapter1 initialMode={mode} onBack={back} addXp={addXp} finishSession={finishSession}/></Simple>;const isEnglishReader1=subject?.id==='english'&&chapter==='Reader • 1 I’m going to dance again';"
          new2="if(subject?.id==='sanskrit')return <Simple title={chapter} back={back}><SanskritChapterEngine chapter={chapter} initialMode={mode} onModeChange={changeMode} back={back} addXp={addXp} finishSession={finishSession}/></Simple>;const isEnglishReader1=subject?.id==='english'&&chapter==='Reader • 1 I’m going to dance again';if(isEnglishReader1)return <Simple title={chapter} back={back}><EnglishReaderChapter1 initialMode={mode} onBack={back} addXp={addXp} finishSession={finishSession}/></Simple>;if(isPanoramaProse1)return <Simple title={chapter} back={back}><EnglishPanoramaChapter1 initialMode={mode} onBack={back} addXp={addXp} finishSession={finishSession}/></Simple>;"
          if old not in s: raise SystemExit('SubjectPage anchor not found')
          s=s.replace(old,new,1)
          if old2 not in s: raise SystemExit('ChapterPage English anchor not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/patch-english-app.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.jsx .github/workflows/patch-english-app.yml
          git commit -m 'Wire Panorama Chapter 1 into app [skip ci]'
          git push
