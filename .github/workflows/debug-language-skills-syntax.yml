name: Debug Language Skills Syntax
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect reported Vite position
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/english/EnglishPanoramaLanguageSkills.jsx')
          s=p.read_text(encoding='utf-8')
          pos=22437
          print('length=',len(s))
          print('--- around reported position ---')
          print(s[max(0,pos-900):pos+900])
          print('--- numbered lines near position ---')
          for i,line in enumerate(s.splitlines(),1):
              a=sum(len(x)+1 for x in s.splitlines()[:i-1])
              b=a+len(line)
              if a <= pos <= b:
                  print('LINE',i,'start',a,'end',b)
                  print(line)
          PY
