name: One-Time Reasoning Timers
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'feat: add compatible reasoning timers' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch timer configuration
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/ReasoningLabV2.jsx')
          s=p.read_text(encoding='utf-8')

          s=s.replace(
            "const prepare=(bank,count)=>shuffle(bank).slice(0,Math.min(count,bank.length)).map(q=>({...q,options:shuffle(q.options.map(text=>({text:String(text),correct:String(text)===q.correct})))}));",
            "const TIMER_CONFIG={practice:{seconds:15*60,perQuestion:'45 sec/question',label:'15:00'},challenge:{seconds:20*60,perQuestion:'60 sec/question',label:'20:00'},test:{seconds:30*60,perQuestion:'60 sec/question',label:'30:00'}};\nconst prepare=(bank,count)=>shuffle(bank).slice(0,Math.min(count,bank.length)).map(q=>({...q,options:shuffle(q.options.map(text=>({text:String(text),correct:String(text)===q.correct})))}));",
            1
          )
          s=s.replace("const[chapterId,setChapterId]=useState(chapterInitial);const[mode,setMode]=useState(modeInitial);const[session,setSession]=useState(null);const[answers,setAnswers]=useState({});const[score,setScore]=useState(0);const[completed,setCompleted]=useState(false);const[testStarted,setTestStarted]=useState(false);const[timeLeft,setTimeLeft]=useState(15*60);",
                      "const[chapterId,setChapterId]=useState(chapterInitial);const[mode,setMode]=useState(modeInitial);const[session,setSession]=useState(null);const[answers,setAnswers]=useState({});const[score,setScore]=useState(0);const[completed,setCompleted]=useState(false);const[testStarted,setTestStarted]=useState(false);const[timeLeft,setTimeLeft]=useState(TIMER_CONFIG.practice.seconds);")
          old_begin="const begin=nextMode=>{setMode(nextMode);setAnswers({});setScore(0);setCompleted(false);if(nextMode==='test'){setSession(null);setTimeLeft(15*60);setTestStarted(false)}else{setSession(prepare(bank,counts[nextMode]));setTestStarted(true)}};"
          new_begin="const begin=nextMode=>{setMode(nextMode);setAnswers({});setScore(0);setCompleted(false);if(nextMode==='test'){setSession(null);setTimeLeft(TIMER_CONFIG.test.seconds);setTestStarted(false)}else if(TIMER_CONFIG[nextMode]){setSession(prepare(bank,counts[nextMode]));setTimeLeft(TIMER_CONFIG[nextMode].seconds);setTestStarted(true)}else{setSession(null);setTestStarted(false)}};"
          s=s.replace(old_begin,new_begin,1)
          s=s.replace("const startTest=()=>{setAnswers({});setScore(0);setCompleted(false);setSession(prepare(bank,30));setTimeLeft(15*60);setTestStarted(true)};",
                      "const startTest=()=>{setAnswers({});setScore(0);setCompleted(false);setSession(prepare(bank,30));setTimeLeft(TIMER_CONFIG.test.seconds);setTestStarted(true)};",1)
          old_effect="useEffect(()=>{if(mode!=='test'||!testStarted||!session)return;const id=setInterval(()=>{setTimeLeft(t=>{if(t<=1){clearInterval(id);finish(true);return 0}return t-1})},1000);return()=>clearInterval(id)},[mode,testStarted,session]);"
          new_effect="useEffect(()=>{if(!TIMER_CONFIG[mode]||!testStarted||!session)return;const id=setInterval(()=>{setTimeLeft(t=>{if(t<=1){clearInterval(id);finish(true);return 0}return t-1})},1000);return()=>clearInterval(id)},[mode,testStarted,session]);"
          s=s.replace(old_effect,new_effect,1)
          old_practice="{(mode==='practice'||mode==='challenge')&&!session&&<section className=\"rlab-start\"><div className=\"start-icon\">{mode==='practice'?'✍️':'🔥'}</div><h2>{mode==='practice'?'Guided Practice':'Challenge Mode'}</h2><p>{mode==='practice'?'20 questions with instant explanation.':'20 higher-difficulty questions with mixed patterns.'}</p><button type=\"button\" onClick={()=>begin(mode)}>Start {mode==='practice'?'Practice':'Challenge'} →</button></section>}"
          new_practice="{(mode==='practice'||mode==='challenge')&&!session&&<section className=\"rlab-start\"><div className=\"start-icon\">{mode==='practice'?'✍️':'🔥'}</div><div className=\"timer-preview\">{TIMER_CONFIG[mode].label}</div><h2>{mode==='practice'?'Guided Practice':'Challenge Mode'}</h2><p>{mode==='practice'?'20 questions • 15 minutes • 45 sec/question.':'20 questions • 20 minutes • 60 sec/question.'}</p><div className=\"test-rules\"><span>⏱️ Auto-submit on timeout</span><span>🔀 Random options</span><span>📊 Instant explanation</span></div><button type=\"button\" onClick={()=>begin(mode)}>Start {mode==='practice'?'Practice':'Challenge'} →</button></section>}"
          s=s.replace(old_practice,new_practice,1)
          old_test="{mode==='test'&&!testStarted&&<section className=\"rlab-start test-start\"><div className=\"start-icon\">🎯</div><div className=\"timer-preview\">15:00</div><h2>Final Test</h2><p>30 प्रश्न • 15 मिनट • प्रत्येक attempt में options randomised होंगे।</p>"
          new_test="{mode==='test'&&!testStarted&&<section className=\"rlab-start test-start\"><div className=\"start-icon\">🎯</div><div className=\"timer-preview\">{TIMER_CONFIG.test.label}</div><h2>Final Test</h2><p>30 प्रश्न • 30 मिनट • mixed + challenge level • 60 sec/question.</p>"
          s=s.replace(old_test,new_test,1)
          s=s.replace("{mode==='test'&&<div className={`countdown ${timeLeft<=60?'danger':''}`}>⏱️ {mm}:{ss}</div>}",
                      "{TIMER_CONFIG[mode]&&<div className={`countdown ${timeLeft<=60?'danger':''}`}>⏱️ {mm}:{ss}</div>}",1)

          required=["const TIMER_CONFIG=","TIMER_CONFIG[practice]","TIMER_CONFIG.test","Auto-submit on timeout"]
          for r in required:
              if r not in s:
                  raise SystemExit(f'missing expected timer patch: {r}')
          p.write_text(s,encoding='utf-8')
      - name: Verify production build
        run: |
          npm install --legacy-peer-deps
          npm run build
          git diff --check
      - name: Commit source and remove patcher
        shell: bash
        run: |
          rm -f .github/workflows/one-time-reasoning-timers.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ReasoningLabV2.jsx .github/workflows/one-time-reasoning-timers.yml
          git commit -m 'feat: add compatible reasoning timers'
          git push
