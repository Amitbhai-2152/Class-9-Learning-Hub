name: Legacy Pages Patch Guard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/fix-pages-legacy-patch.yml'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate source-controlled Pages workflow
        run: |
          grep -q "npm install --legacy-peer-deps" .github/workflows/pages.yml
          ! grep -q "TIMER_CONFIG" .github/workflows/pages.yml
          test -s public/404.html
