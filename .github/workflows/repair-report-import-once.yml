name: Repair Report Import Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add missing Report Writing import
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/AppWithChapter5.jsx')
          s=p.read_text(encoding='utf-8')
          imp="import EnglishReportWritingTopic from './english/EnglishReportWritingTopic.jsx';"
          if imp not in s:
              marker="import EnglishNoticeWritingTopic from './english/EnglishNoticeWritingTopic.jsx';"
              if marker not in s:
                  raise SystemExit('Notice Writing import marker not found')
              s=s.replace(marker, marker+imp, 1)
          if "genericTopic==='report'" not in s:
              raise SystemExit('Report route missing')
          p.write_text(s,encoding='utf-8')
      - name: Build
        run: |
          npm install
          npm run build
      - name: Commit and remove repair workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/AppWithChapter5.jsx
          git rm .github/workflows/repair-report-import-once.yml
          git commit -m 'fix(english): import report writing module' || exit 0
          git push
