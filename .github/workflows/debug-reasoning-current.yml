name: One-time Reasoning Content Upgrade
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'Amitbhai-2152'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch reasoning source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/ReasoningLabV2.jsx')
          s=p.read_text(encoding='utf-8')
          blocks={
          'numberBank':r'''const numberBank=[...Array.from({length:20},(_,i)=>{const d=2+i%7,a=5+i,v=[a,a+d,a+2*d,a+3*d],ans=a+4*d;return make(`${v.join(', ')}, ?`,ans,[ans-d,ans+d,ans+2*d],`हर बार +${d}।`,'अभ्यास')}),...Array.from({length:20},(_,i)=>{const k=2+i%3,a=2+i%6,v=[a,a*k,a*k*k,a*k*k*k],ans=a*k**4;return make(`${v.join(', ')}, ?`,ans,[ans-k,ans+k,ans+2*k],`हर बार ×${k}।`,'अभ्यास')}),...Array.from({length:20},(_,i)=>{const d=2+i%5,a=3+i,v=[a,a+d,a+3*d,a+6*d],ans=a+10*d;return make(`${v.join(', ')}, ?`,ans,[ans-d,ans+d,ans+2*d],`अंतर +${d}, +${2*d}, +${3*d}; अगला +${4*d}।`,'चैलेंज')}),...Array.from({length:20},(_,i)=>{const a=3+i,v=[a,a*2,a*2+3,(a*2+3)*2],ans=(a*2+3)*2+3;return make(`${v.join(', ')}, ?`,ans,[ans-3,ans+2,ans+5],`×2, +3 का alternating pattern।`,'चैलेंज')}),...Array.from({length:20},(_,i)=>{const n=4+i,v=i%2===0?[n*n,(n+1)**2,(n+2)**2]:[n,n+2,n+6,n+12],ans=i%2===0?(n+3)**2:n+20;return make(`${v.join(', ')}, ?`,ans,[ans-1,ans+1,ans+4],i%2===0?'क्रमिक पूर्ण वर्ग।':'अंतर +2,+4,+6; अगला +8।','कठिन')})];''',
          'alphabetBank':r'''const alphabetBank=[...Array.from({length:20},(_,i)=>{const d=2+i%5,a=1+i%8,v=[a,a+d,a+2*d,a+3*d].map(letter),ans=letter(a+4*d);return make(`${v.join(', ')}, ?`,ans,[letter(a+4*d+1),letter(a+4*d-1),letter(a+4*d+2)],`हर बार +${d} position।`,'अभ्यास')}),...Array.from({length:20},(_,i)=>{const d=2+i%5,a=26-i%8,v=[a,a-d,a-2*d,a-3*d].map(letter),ans=letter(a-4*d);return make(`${v.join(', ')}, ?`,ans,[letter(a-4*d+1),letter(a-4*d-1),letter(a-4*d+2)],`हर बार −${d} position।`,'अभ्यास')}),...Array.from({length:20},(_,i)=>{const a=1+i%7,v=[a,a+1,a+3,a+6,a+10].map(letter),ans=letter(a+15);return make(`${v.join(', ')}, ?`,ans,[letter(a+14),letter(a+16),letter(a+17)],'Jump +1,+2,+3,+4; अगला +5।','चैलेंज')}),...Array.from({length:20},(_,i)=>{const a=2+i%7,v=[a,a+3,a+7,a+12].map(letter),ans=letter(a+18);return make(`${v.join(', ')}, ?`,ans,[letter(a+17),letter(a+19),letter(a+20)],'Jump +3,+4,+5; अगला +6।','चैलेंज')}),...Array.from({length:20},(_,i)=>{const a=1+i%10,v=[a,a+4,a+3,a+7,a+6].map(letter),ans=letter(a+10);return make(`${v.join(', ')}, ?`,ans,[letter(a+9),letter(a+11),letter(a+12)],'Alternating +4, −1।','कठिन')})];''',
          'analogyBank':r'''const analogyBank=[...[['Doctor : Hospital :: Teacher : ?','School',['Court','Market','Farm'],'काम का स्थान।'],['Bird : Nest :: Bee : ?','Hive',['Cage','Hole','Pond'],'जीव : निवास।'],['Book : Read :: Food : ?','Eat',['Cook','Sell','Wash'],'वस्तु : क्रिया।'],['Day : Night :: Hot : ?','Cold',['Warm','Dry','Bright'],'विलोम संबंध।'],['Hand : Finger :: Foot : ?','Toe',['Leg','Knee','Arm'],'भाग : पूर्ण।'],['Author : Book :: Painter : ?','Painting',['Brush','Paper','Color'],'सृजनकर्ता : सृजन।'],['Seed : Plant :: Egg : ?','Bird',['Fruit','Tree','Leaf'],'उत्पत्ति संबंध।'],['Clock : Time :: Thermometer : ?','Temperature',['Weather','Distance','Speed'],'उपकरण : माप।'],['Puppy : Dog :: Calf : ?','Cow',['Goat','Horse','Sheep'],'शिशु : वयस्क।'],['India : New Delhi :: Nepal : ?','Kathmandu',['Thimphu','Dhaka','Colombo'],'देश : राजधानी।'],['Knife : Cut :: Pen : ?','Write',['Read','Draw','Erase'],'उपकरण : कार्य।'],['Milk : Cow :: Wool : ?','Sheep',['Hen','Horse','Dog'],'स्रोत संबंध।'],['Eye : See :: Ear : ?','Hear',['Speak','Smell','Touch'],'इंद्रिय : कार्य।'],['Fish : Water :: Bird : ?','Air',['Soil','Road','Cave'],'जीव : वातावरण।'],['Triangle : 3 :: Square : ?','4',['5','6','8'],'भुजाओं की संख्या।'],['Gold : Metal :: Rose : ?','Flower',['Fruit','Tree','Seed'],'वर्ग : सदस्य।']].map(x=>make(...x)),...Array.from({length:84},(_,i)=>{const a=6+i,t=i%6;if(t===0)return make('Book : Read :: Food : ?','Eat',['Cook','Sell','Wash'],'वस्तु : क्रिया।','चैलेंज');if(t===1)return make(`${a} : ${a*a} :: ${a+3} : ?`,(a+3)**2,[(a+3)*2,(a+3)*3,(a+3)*4],'Square relation।','चैलेंज');if(t===2)return make(`${a} : ${a+5} :: ${a+12} : ?`,a+17,[a+14,a+19,a+22],'दोनों में +5।','चैलेंज');if(t===3){const z=[['Painter','Painting'],['Composer','Music'],['Sculptor','Statue']][i%3];return make(`Creator : Work :: ${z[0]} : ?`,z[1],['Brush','Paper','Stage'],'सृजनकर्ता : सृजन।','कठिन')}if(t===4)return make(`${a} : ${a**3} :: ${a+1} : ?`,(a+1)**3,[(a+1)**2,(a+1)*2,(a+1)*4],'Cube relation।','कठिन');return make(`${a} : ${a-3} :: ${a+8} : ?`,a+5,[a+2,a+11,a+14],'दोनों में −3।','चैलेंज')})];''',
          'classificationBank':r'''const classificationBank=[...[['अलग चुनिए: 2, 4, 6, 9','9',['8','10','12'],'पहली तीन सम हैं।'],['अलग चुनिए: 3, 5, 7, 9','9',['11','13','15'],'9 अभाज्य नहीं है।'],['अलग शब्द: आम, केला, संतरा, गाजर','गाजर',['सेब','अमरूद','पपीता'],'गाजर सब्जी है।'],['अलग इकाई: मीटर, सेंटीमीटर, किलोमीटर, किलोग्राम','किलोग्राम',['मिलीमीटर','डेसीमीटर','मीटर'],'किलोग्राम द्रव्यमान की इकाई है।'],['अलग: सोमवार, मंगलवार, मार्च, शुक्रवार','मार्च',['बुधवार','गुरुवार','शनिवार'],'मार्च महीना है।'],['अलग: 16, 25, 36, 45','45',['49','64','81'],'45 पूर्ण वर्ग नहीं है।'],['अलग: 8, 27, 64, 100','100',['125','216','343'],'100 पूर्ण घन नहीं है।'],['अलग अक्षर: A, E, I, B','B',['O','U','E'],'B स्वर नहीं है।'],['अलग: गंगा, यमुना, नर्मदा, हिमालय','हिमालय',['गोदावरी','कावेरी','सोन'],'हिमालय नदी नहीं है।'],['अलग: बस, ट्रेन, कार, आम','आम',['साइकिल','ट्रक','रिक्शा'],'आम वाहन नहीं है।'],['अलग संख्या: 11, 13, 17, 21','21',['19','23','29'],'21 अभाज्य नहीं है।'],['अलग माप: लीटर, मिलीलीटर, गैलन, किलोग्राम','किलोग्राम',['मीटर','सेमी','किमी'],'किलोग्राम आयतन की इकाई नहीं है।']].map(x=>make(...x)),...Array.from({length:88},(_,i)=>{const b=4+i,t=i%7;if(t===0){const n=[b*2,b*4,b*6,b*7+1];return make(`अलग संख्या: ${n.join(', ')}`,String(n[3]),[String(b*8),String(b*10),String(b*12)],`पहली तीन ${b} के सम गुणज हैं।`,'चैलेंज')}if(t===1){const n=[b*b,(b+1)**2,(b+2)**2,b*b+3];return make(`अलग संख्या: ${n.join(', ')}`,String(n[3]),[String((b+3)**2),String((b+4)**2),String((b+5)**2)],'बाकी पूर्ण वर्ग हैं।','कठिन')}if(t===2){const n=[b*3,b*5,b*7,b*8+1];return make(`अलग संख्या: ${n.join(', ')}`,String(n[3]),[String(b*9),String(b*11),String(b*13)],`पहली तीन ${b} के विषम गुणज हैं।`,'कठिन')}if(t===3){const w=[['आम','सेब','केला','कुर्सी'],['कुत्ता','बिल्ली','गाय','टेबल'],['लाल','नीला','हरा','सात']][i%3];return make(`अलग शब्द: ${w.join(', ')}`,w[3],['सेब','मेज','पाँच'],'बाकी तीन एक ही category में हैं।','अभ्यास')}if(t===4){const n=[2,3,5,7].map(x=>b+x);return make(`अलग संख्या: ${n.join(', ')}`,String(n[3]),[String(b+11),String(b+13),String(b+15)],'अंतिम संख्या दिए हुए prime-offset pattern से बाहर है।','चैलेंज')}if(t===5){const w=['A','E','I','O','B'];return make(`अलग अक्षर: ${w.join(', ')}`,'B',['U','E','I'],'B स्वर नहीं है।','अभ्यास')}const w=['मीटर','सेमी','किमी','किलोग्राम'];return make(`अलग इकाई: ${w.join(', ')}`,'किलोग्राम',['मिलीमीटर','डेसीमीटर','मीटर'],'किलोग्राम लंबाई की इकाई नहीं है।','अभ्यास')})];''',
          'codingBank':r'''const codingWords=['CAT','DOG','PEN','SUN','BOX','HEN','MAP','FISH','BIRD','LAMP','TREE','HOME','GAME','ROAD','BOOK','MANGO','GRAPE','BLUE','GOLD','FIRE','APPLE','TRAIN','SCHOOL','CHAIR','MUSIC'];
const codingBank=[...Array.from({length:50},(_,i)=>{const ref=codingWords[i%codingWords.length],target=codingWords[(i+7)%codingWords.length],step=1+i%5,code=wordShift(ref,step),ans=wordShift(target,step);return make(`यदि ${ref} को ${code} लिखा जाए, तो ${target} को उसी नियम से कैसे लिखेंगे?`,ans,[wordShift(target,step-1),wordShift(target,step+1),target],`हर अक्षर में ${step} position का shift।`,'अभ्यास')}),...Array.from({length:25},(_,i)=>{const ref=codingWords[(i+3)%codingWords.length],target=codingWords[(i+11)%codingWords.length],step=2+i%4,code=wordShift(ref,step),ans=wordShift(target,step);return make(`यदि ${ref} → ${code}, तो ${target} → ?`,ans,[wordShift(target,step-1),wordShift(target,step+1),wordShift(target,-step)],`दिए उदाहरण के अनुसार हर अक्षर +${step}।`,'चैलेंज')}),...Array.from({length:25},(_,i)=>{const ref=codingWords[(i+5)%codingWords.length],target=codingWords[(i+15)%codingWords.length],step=-2-(i%4),code=wordShift(ref,step),ans=wordShift(target,step);return make(`यदि ${ref} → ${code}, तो ${target} → ?`,ans,[wordShift(target,step+1),wordShift(target,step-1),wordShift(target,-step)],`दिए उदाहरण के अनुसार हर अक्षर ${step} position move करता है।`,'कठिन')})];''',
          'directionBank':r'''const directionBank=[...[['उत्तर की ओर मुख है; 90° दाएँ मुड़ें। दिशा?','पूर्व',['पश्चिम','उत्तर','दक्षिण'],'उत्तर से right = पूर्व।'],['पूर्व की ओर मुख है; 90° बाएँ मुड़ें। दिशा?','उत्तर',['दक्षिण','पूर्व','पश्चिम'],'पूर्व से left = उत्तर।'],['दक्षिण की ओर मुख है; 90° दाएँ मुड़ें। दिशा?','पश्चिम',['पूर्व','उत्तर','दक्षिण'],'दक्षिण से right = पश्चिम।'],['पश्चिम की ओर मुख है; 90° बाएँ मुड़ें। दिशा?','दक्षिण',['उत्तर','पूर्व','पश्चिम'],'पश्चिम से left = दक्षिण।'],['5m उत्तर और 5m पूर्व जाएँ। प्रारम्भिक बिंदु से दिशा?','उत्तर-पूर्व',['उत्तर-पश्चिम','दक्षिण-पूर्व','दक्षिण-पश्चिम'],'उत्तर + पूर्व = उत्तर-पूर्व।'],['8m उत्तर, 5m पूर्व, 8m दक्षिण। प्रारम्भिक बिंदु से दिशा?','पूर्व',['पश्चिम','उत्तर','दक्षिण'],'उत्तर और दक्षिण cancel; पूर्व बचता है।'],['P, Q का पिता है और Q, R की बहन है। P का R से संबंध?','पिता',['भाई','चाचा','दादा'],'P, R का पिता है।'],['A, B का पिता है और B, C की माँ है। A का C से संबंध?','नाना',['पिता','मामा','चाचा'],'माँ का पिता = नाना।'],['P, Q की बहन है और Q, R का पिता है। P का R से संबंध?','बुआ',['माँ','दादी','बहन'],'पिता की बहन = बुआ।'],['A, B का भाई है और B, C का पिता है। A का C से संबंध?','चाचा',['मामा','भाई','पिता'],'पिता का भाई = चाचा।']].map(x=>make(...x)),...Array.from({length:45},(_,i)=>{const dirs=['उत्तर','पूर्व','दक्षिण','पश्चिम'],d=dirs[i%4],turns=[90,180,270][i%3],order={उत्तर:0,पूर्व:1,दक्षिण:2,पश्चिम:3},ans=dirs[(order[d]+turns/90)%4];return make(`${d} की ओर मुख है; ${turns}° दाएँ मुड़ने पर दिशा?`,ans,dirs.filter(x=>x!==ans),`${d} से ${turns}° clockwise turn = ${ans}।`,i<15?'अभ्यास':i<30?'चैलेंज':'कठिन')}),...Array.from({length:45},(_,i)=>{const g=[['A','B','C'],['P','Q','R'],['M','N','O'],['X','Y','Z']][i%4],t=i%6;let q,ans,exp;if(t===0){q=`${g[0]}, ${g[1]} का भाई है और ${g[1]}, ${g[2]} का पिता है। ${g[0]} का ${g[2]} से संबंध?`;ans='चाचा';exp='पिता का भाई = चाचा।'}else if(t===1){q=`${g[0]}, ${g[1]} की बहन है और ${g[1]}, ${g[2]} की माँ है। ${g[0]} का ${g[2]} से संबंध?`;ans='मौसी';exp='माँ की बहन = मौसी।'}else if(t===2){q=`${g[0]}, ${g[1]} का पिता है और ${g[1]}, ${g[2]} का भाई है। ${g[0]} का ${g[2]} से संबंध?`;ans='पिता';exp='दोनों का पिता समान है।'}else if(t===3){q=`${g[0]}, ${g[1]} की माँ है और ${g[1]}, ${g[2]} का पिता है। ${g[0]} का ${g[2]} से संबंध?`;ans='दादी';exp='पिता की माँ = दादी।'}else if(t===4){q=`${g[0]}, ${g[1]} की बहन है; ${g[1]}, ${g[2]} का पिता है। ${g[0]} का ${g[2]} से संबंध?`;ans='बुआ';exp='पिता की बहन = बुआ।'}else{q=`${g[0]}, ${g[1]} की माँ है; ${g[1]}, ${g[2]} की बहन है। ${g[0]} का ${g[2]} से संबंध?`;ans='माँ';exp='दोनों भाई-बहन हैं।'}return make(q,ans,['भाई','चाचा','दादी'],exp,i<15?'अभ्यास':i<30?'चैलेंज':'कठिन')})];'''
          }
          for name,block in blocks.items():
              s,n=re.subn(r'const '+name+r'=.*?(?=\nconst )',block,s,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'missing {name}')
          old="const prepare=(bank,count)=>shuffle(bank).slice(0,Math.min(count,bank.length)).map(q=>({...q,options:shuffle(q.options.map(text=>({text:String(text),correct:String(text)===q.correct})))}));"
          new="const prepare=(bank,count,mode='practice')=>{const rank={अभ्यास:0,चैलेंज:1,कठिन:2};const target=mode==='practice'?q=>rank[q.difficulty]!==2:mode==='challenge'?q=>rank[q.difficulty]>=1:q=>true;const pool=bank.filter(target);return shuffle(pool.length>=count?pool:bank).slice(0,Math.min(count,bank.length)).map(q=>({...q,options:shuffle(q.options.map(text=>({text:String(text),correct:String(text)===q.correct})))}))};"
          if old not in s: raise SystemExit('missing prepare')
          s=s.replace(old,new,1).replace("setSession(prepare(bank,counts[nextMode]));","setSession(prepare(bank,counts[nextMode],nextMode));",1).replace("setSession(prepare(bank,30));","setSession(prepare(bank,30,'test'));",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove patch workflow
        run: rm -f .github/workflows/one-time-reasoning-content-upgrade.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ReasoningLabV2.jsx .github/workflows/one-time-reasoning-content-upgrade.yml
          git commit -m 'feat: upgrade reasoning question banks'
          git push
