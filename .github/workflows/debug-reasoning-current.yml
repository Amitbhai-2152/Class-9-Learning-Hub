name: Debug Reasoning Current
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolate exact parser token
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/ReasoningLabV2.jsx').read_text(encoding='utf-8')
          for start,end in [(9850,10150),(9950,10030),(10030,10120)]:
              print(f'WINDOW {start}:{end}')
              print(repr(s[start:end]))
          print('CODEPOINTS')
          for i,ch in enumerate(s[9960:10020],9960):
              print(i,repr(ch),hex(ord(ch)))
          PY
          npm install --legacy-peer-deps
          npm run build
