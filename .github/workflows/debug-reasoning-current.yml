name: Debug Reasoning Current
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Reasoning V2 with Babel
        run: |
          npm install --no-save --legacy-peer-deps @babel/parser
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {parse} from '@babel/parser';
          const s=fs.readFileSync('src/ReasoningLabV2.jsx','utf8');
          try{
            parse(s,{sourceType:'module',plugins:['jsx']});
            console.log('BABEL_PARSE_OK');
          }catch(e){
            console.log('BABEL_PARSE_ERROR',e.message);
            console.log('LOC',e.loc);
            const lines=s.split(/\n/); const l=e.loc?.line||1;
            console.log('SOURCE_LINE',lines[l-1]);
          }
          NODE
          npm install --legacy-peer-deps
          npm run build
