name: Apply timed quiz UI
on:
  push:
    paths:
      - '.github/workflows/timed-quiz-ui-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'trigger timed quiz UI')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch topic quiz views
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if new.strip() in s:
                  print(path, 'already patched'); return
              if old not in s:
                  raise SystemExit(f'Pattern not found in {path}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')
              print(path,'patched')

          once('src/english/EnglishTensesTopic.jsx',
               "import './EnglishTensesTopic.css';",
               "import './EnglishTensesTopic.css';\nimport EnglishTimedQuiz from './EnglishTimedQuiz.jsx';")
          once('src/english/EnglishTensesTopic.jsx',
               " const openLesson=i=>{setSection('learn');setLesson(i);window.scrollTo({top:0,behavior:'smooth'})};\n return <div className=\"tenses-hub\">",
               " const openLesson=i=>{setSection('learn');setLesson(i);window.scrollTo({top:0,behavior:'smooth'})};\n if(section!=='learn')return <EnglishTimedQuiz title=\"Tenses\" mode={section} getBank={m=>m==='practice'?QUESTIONS:m==='challenge'?[...QUESTIONS.slice(3),...QUESTIONS.slice(0,3),...QUESTIONS.slice(7,12)]:QUESTIONS} onModeChange={startMode} onBack={()=>setSection('learn')} addXp={addXp} finishSession={finishSession}/>;\n return <div className=\"tenses-hub\">")

          once('src/english/EnglishModalsTopic.jsx',
               "import './EnglishModalsTopic.css';",
               "import './EnglishModalsTopic.css';\nimport EnglishTimedQuiz from './EnglishTimedQuiz.jsx';")
          once('src/english/EnglishModalsTopic.jsx',
               " const backHub=()=>{if(onBack)onBack();};\n return <div className=\"modals-hub\">",
               " const backHub=()=>{if(onBack)onBack();};\n if(mode!=='learn')return <EnglishTimedQuiz title=\"Modals\" mode={mode} getBank={m=>m==='practice'?QUESTIONS.slice(0,10):m==='challenge'?[...QUESTIONS.slice(10),...QUESTIONS.slice(0,6)]:QUESTIONS} onModeChange={start} onBack={()=>setMode('learn')} addXp={addXp} finishSession={finishSession}/>;\n return <div className=\"modals-hub\">")

          once('src/english/EnglishActivePassiveTopic.jsx',
               "import './EnglishActivePassiveTopic.css';",
               "import './EnglishActivePassiveTopic.css';\nimport EnglishTimedQuiz from './EnglishTimedQuiz.jsx';")
          old="<Quiz title={mode==='practice'?'Practice — core transformations':mode==='challenge'?'Challenge — mixed voice reasoning':'Final Test — Active & Passive Voice'} bank={mode==='practice'?PRACTICE:mode==='challenge'?CHALLENGE:FINAL} mode={mode==='test'?'final test':mode} onBack={()=>nav('learn')} addXp={addXp}/>"
          new="<EnglishTimedQuiz title=\"Active & Passive Voice\" mode={mode} getBank={m=>m==='practice'?PRACTICE:m==='challenge'?CHALLENGE:FINAL} onModeChange={nav} onBack={()=>nav('learn')} addXp={addXp}/ >"
          p=Path('src/english/EnglishActivePassiveTopic.jsx'); s=p.read_text(encoding='utf-8')
          if old not in s: raise SystemExit('Active/Passive quiz call not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Remove the old local Quiz component now that the shared engine is used.
          p=Path('src/english/EnglishActivePassiveTopic.jsx'); s=p.read_text(encoding='utf-8')
          start=s.find('\nfunction Quiz({title,bank,mode,onBack,addXp}){')
          end=s.find('\nexport default function EnglishActivePassiveTopic',start)
          if start<0 or end<0: raise SystemExit('Old Active/Passive Quiz block not found')
          p.write_text(s[:start]+s[end:],encoding='utf-8')
          print('active/passive old Quiz removed')
          PY
      - name: Remove one-time workflow and trigger
        run: |
          rm -f .github/workflows/apply-timed-quiz-ui.yml .github/workflows/timed-quiz-ui-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/english/EnglishTensesTopic.jsx src/english/EnglishModalsTopic.jsx src/english/EnglishActivePassiveTopic.jsx .github/workflows/apply-timed-quiz-ui.yml .github/workflows/timed-quiz-ui-trigger.txt
          git commit -m 'feat(english): add timed quiz results and review'
          git push origin HEAD:main