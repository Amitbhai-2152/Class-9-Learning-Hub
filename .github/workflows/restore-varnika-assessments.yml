name: Restore Varnika assessment sets

on:
  push:
    branches: [fix/hindi-varnika-assessment-restore]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore distinct assessment banks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/HindiVarnikaChapter12View.jsx')
          s = p.read_text(encoding='utf-8')
          needle = "const bank=questions.slice(0,MODES[mode]?.count||questions.length);"
          replacement = "const modeQuestions=(all,mode)=>mode==='practice'?all.slice(0,15):mode==='challenge'?all.slice(15,27):[all[0],...all.slice(1,20)];const bank=mode==='learn'?[]:modeQuestions(questions,mode);"
          if needle not in s:
              raise SystemExit('Target assessment-bank line not found; no safe edit made.')
          p.write_text(s.replace(needle, replacement, 1), encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/HindiVarnikaChapter12View.jsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore distinct Varnika practice challenge test sets"
          git push
