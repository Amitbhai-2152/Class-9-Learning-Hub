name: Wire Panorama Timed Quiz

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire Chapter 1 and Chapter 2 to timed quiz engine
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_component(path, export_name, learn_markup):
              p = Path(path)
              text = p.read_text(encoding='utf-8')

              text = re.sub(
                  r"^import React,\{[^}]+\} from 'react';",
                  "import React,{useState} from 'react';\nimport PanoramaTimedQuiz from './PanoramaTimedQuiz.jsx';",
                  text,
                  count=1,
                  flags=re.M,
              )

              text, removed = re.subn(
                  r"\nfunction shuffleQuestion\(q\)\{.*?\n\}\n\n(?=function StudyView)",
                  "\n",
                  text,
                  count=1,
                  flags=re.S,
              )
              if removed != 1:
                  raise SystemExit(f'{path}: could not remove legacy shuffleQuestion helper')

              marker = f"export function {export_name}"
              start = text.find(marker)
              meta_name = 'englishPanoramaChapter1Meta' if export_name.endswith('Chapter1') else 'englishPanoramaChapter2Meta'
              meta = f"export const {meta_name}="
              meta_pos = text.find(meta, start)
              if start < 0 or meta_pos < 0:
                  raise SystemExit(f'{path}: could not find component boundaries')

              component = f'''export function {export_name}({{initialMode=null,onBack,addXp,finishSession}}) {{
                const [mode,setMode]=useState(initialMode||'learn');
                const begin=m=>setMode(m);
                if(mode==='learn'||mode===null)return {learn_markup};
                const bank=mode==='practice'?practice:mode==='challenge'?challenge:mode==='test'?finalTest:[];
                return <PanoramaTimedQuiz mode={{mode}} title={{study.title}} bank={{bank}} onBack={{()=>begin('learn')}} addXp={{addXp}} finishSession={{payload=>finishSession?.({{subject:'english',book:'The Panorama',...payload}})}} />;
              }}

'''
              text = text[:start] + component + text[meta_pos:]
              p.write_text(text, encoding='utf-8')

          chapter1_learn = """<div className=\"pg-shell\">
                <header className=\"pg-hero\"><div className=\"pg-kicker\">THE PANORAMA • PROSE 1</div><h1>{study.title}</h1><p>{study.author} · Complete guided study</p><div className=\"pg-hero-stats\"><span>12 Guided Parts</span><span>60+ Vocabulary</span><span>Infinitive Lab</span><span>15 + 23 + 20 Questions</span></div></header>
                <div className=\"pg-modebar\"><button className=\"active\" onClick={{()=>begin('learn')}}><b>Learn</b><span>पूरा chapter समझें</span></button><button onClick={{()=>begin('practice')}}><b>Practice</b><span>15 questions • 11:15 min</span></button><button onClick={{()=>begin('challenge')}}><b>Challenge</b><span>23 questions • 23:00 min</span></button><button onClick={{()=>begin('test')}}><b>Final Test</b><span>20 questions • 25:00 min</span></button></div>
                <button className=\"pg-back\" onClick={{onBack}}>← English books</button><StudyView/>
              </div>"""
          chapter2_learn = """<div className=\"pg-shell\">
                <div className=\"pg-hero\"><span className=\"badge\">CLASS 9 • THE PANORAMA • PROSE 2</span><h1>{study.title}</h1><p>{study.author} • Guided learning</p></div>
                <div className=\"pg-modebar\"><button className=\"active\" onClick={{()=>begin('learn')}}><b>Learn</b><span>पूरा chapter समझें</span></button><button onClick={{()=>begin('practice')}}><b>Practice</b><span>15 questions • 11:15 min</span></button><button onClick={{()=>begin('challenge')}}><b>Challenge</b><span>23 questions • 23:00 min</span></button><button onClick={{()=>begin('test')}}><b>Final Test</b><span>20 questions • 25:00 min</span></button></div>
                <button className=\"pg-back\" onClick={{onBack}}>← English books</button><StudyView/>
              </div>"""

          replace_component('src/english/EnglishPanoramaChapter1.jsx','EnglishPanoramaChapter1',chapter1_learn)
          replace_component('src/english/EnglishPanoramaChapter2.jsx','EnglishPanoramaChapter2',chapter2_learn)

          for path in ['src/english/EnglishPanoramaChapter1.jsx','src/english/EnglishPanoramaChapter2.jsx']:
              t=Path(path).read_text(encoding='utf-8')
              for forbidden in ['const [selected,setSelected]', 'const [score,setScore]', 'shuffleQuestion(q)', 'pg-feedback']:
                  if forbidden in t:
                      raise SystemExit(f'{path}: legacy quiz logic still present: {forbidden}')
              if "PanoramaTimedQuiz from './PanoramaTimedQuiz.jsx'" not in t:
                  raise SystemExit(f'{path}: timed quiz engine import missing')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/english/EnglishPanoramaChapter1.jsx src/english/EnglishPanoramaChapter2.jsx
          if git diff --cached --quiet; then
            echo "No source changes needed"
          else
            git commit -m "Use timed Panorama quiz for chapters 1 and 2"
            git push
          fi
          # trigger this workflow from the new workflow revision during the initial wiring pass
