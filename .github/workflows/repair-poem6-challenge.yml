name: Repair Poetry Chapter 6

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair Self-Introduction Challenge bank
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/english/EnglishPanoramaPoem6.jsx')
          text = path.read_text(encoding='utf-8')
          match = re.search(r"const challenge=\[(.*?)\];", text, re.S)
          if not match:
              raise SystemExit('Challenge bank not found')
          body = match.group(1)
          count = len(re.findall(r'\bq\s*\(', body))
          print(f'Current Chapter 6 challenge questions: {count}')
          if count >= 25:
              raise SystemExit(0)
          if count != 15:
              raise SystemExit(f'Unexpected Chapter 6 challenge count: {count}')

          additions = """q('Which phrase shows that the speaker’s creativity is linked to domestic work?',['To home and children','Through a decade of togetherness','My ordinariness','A few sad tears'],0,'The poem directly says her creativity is confined to home and children.'),q('What does “silent blows” suggest in context?',['Unspoken emotional hurts','Physical exercise','Happy surprises','Musical sounds'],0,'The phrase presents repeated, unspoken emotional hurts.'),q('Why is the tortoise shell image important?',['It suggests emotional hardening and self-protection','It describes a household object','It shows the speaker loves animals','It represents travel'],0,'The image shows sensitivity becoming hard like a protective shell.'),q('What does “entrapped” most nearly mean?',['Trapped or confined','Celebrated','Repaired','Expanded'],0,'Entrapped means trapped or confined.'),q('Which word in the final stanza is closest in meaning to “label”?',['Tag','Tears','Cost','Home'],0,'The poem calls ordinariness a “tag”.'),q('What contrast is central to the final stanza?',['Ordinary and extraordinary','Home and school','Books and carpets','Silence and music'],0,'The stanza contrasts an imposed ordinary identity with the possibility of becoming extraordinary.'),q('What may the “few sad tears” symbolise?',['Suppressed feelings seeking expression','Physical strength','A change of weather','Household duties'],0,'The tears symbolise feelings that have been suppressed and may finally emerge.'),q('Which statement best describes the speaker’s attitude?',['She recognises confinement but imagines change','She is completely satisfied with every restriction','She rejects all responsibility','She is mainly describing nature'],0,'The poem acknowledges domestic confinement while keeping open the possibility of transformation.'),q('What does the phrase “bind me conveniently” imply?',['A social label makes the domestic role appear acceptable and easy to maintain','The speaker is physically tied with rope','The speaker is learning how to bind books','The speaker is arranging carpets'],0,'The phrase criticises how a convenient label can keep a person within an expected role.'),q('Which theme connects all three stanzas most strongly?',['Identity and restricted self-expression','Weather and seasons','Travel and adventure','School discipline'],0,'Across the three stanzas, the speaker moves from restricted creativity to silenced selfhood and possible self-expression.')"""
          replacement = body.rstrip() + additions
          text = text[:match.start(1)] + replacement + text[match.end(1):]
          path.write_text(text, encoding='utf-8')

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- src/english/EnglishPanoramaPoem6.jsx; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/english/EnglishPanoramaPoem6.jsx
          git commit -m 'fix(english): restore Chapter 6 poetry challenge bank'
          git push
