name: Finalize Science Chapter 8

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/finalize-science-ch8.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upgrade Chapter 8 renderer and interactions
        shell: python
        run: |
          from pathlib import Path

          p=Path('src/ScienceNextChapterEngine.jsx')
          s=p.read_text(encoding='utf-8')

          old="""function SafeVisual({visual,title}){\n if(!visual)return null;\n const items=Array.isArray(visual.items)?visual.items:[];\n return <div className=\"sc3-safe-visual\" aria-label={`दृश्य: ${title}`}><div className=\"sc3-visual-grid\"><span className=\"sc3-visual-kicker\">अध्याय दृश्य</span><strong>{visual.title||title}</strong><div className=\"sc3-visual-items\">{items.map((item,index)=><div className=\"sc3-visual-item\" key={`${item}-${index}`}><b>{index+1}</b><span>{item}</span></div>)}</div></div></div>;\n}\n"""
          new="""function VisualDiagram({visual}){\n const type=visual?.type||'generic';\n if(type==='force'||type==='pushPull'||type==='effects'||type==='balanced'||type==='secondLaw'||type==='thirdLaw'||type==='friction') return <div className={`sc3-motion-diagram sc3-${type}`} aria-hidden=\"true\"><div className=\"sc3-track\"><span className=\"sc3-object sc3-object-a\"/><span className=\"sc3-object sc3-object-b\"/></div>{type==='balanced'&&<div className=\"sc3-forces\"><span>← 10 N</span><strong>वस्तु</strong><span>10 N →</span></div>}{type==='pushPull'&&<div className=\"sc3-force-arrows\"><span>↤ खिंचाव</span><span>धक्का ↦</span></div>}{type==='secondLaw'&&<div className=\"sc3-force-arrows\"><span>F ↦</span><strong>m</strong><span>a ↦</span></div>}{type==='thirdLaw'&&<div className=\"sc3-force-arrows\"><span>क्रिया ↦</span><strong>◉ ◉</strong><span>↤ प्रतिक्रिया</span></div>}{type==='friction'&&<div className=\"sc3-force-arrows\"><span>बल ↦</span><strong>▰</strong><span>← घर्षण</span></div>}{(type==='force'||type==='effects')&&<div className=\"sc3-action-sequence\"><span>बल</span><i>→</i><span>परिवर्तन</span><i>→</i><span>नई अवस्था</span></div>}</div>;\n if(type==='inertia'||type==='busStart'||type==='busStop'||type==='firstLaw') return <div className={`sc3-motion-diagram sc3-${type}`} aria-hidden=\"true\"><div className=\"sc3-ground\"/><div className=\"sc3-bus\">🚌</div><div className=\"sc3-person\">●</div>{type==='firstLaw'&&<div className=\"sc3-law-label\">नेट बल = 0</div>}{type==='inertia'&&<div className=\"sc3-inertia-flow\"><span>अवस्था</span><i>→</i><span>बदलाव का प्रयास</span><i>→</i><span>जड़त्व</span></div>}{(type==='busStart'||type==='busStop')&&<div className=\"sc3-bus-caption\">{type==='busStart'?'बस आगे → शरीर पीछे की ओर':'बस रुकती है → शरीर आगे की ओर'}</div>}</div>;\n if(type==='momentum') return <div className=\"sc3-motion-diagram sc3-momentum\" aria-hidden=\"true\"><div className=\"sc3-momentum-items\"><span className=\"sc3-ball small\">●</span><b>m</b><i>×</i><span className=\"sc3-speed-arrow\">v →</span><strong>= p</strong></div><div className=\"sc3-momentum-note\">द्रव्यमान × वेग = संवेग</div></div>;\n if(type==='circular') return <div className=\"sc3-motion-diagram sc3-circular\" aria-hidden=\"true\"><div className=\"sc3-circle-path\"><span>●</span></div><span className=\"sc3-circle-arrow\">↗ दिशा बदलती है</span></div>;\n if(type==='momentumCollision'||type==='collision') return <div className=\"sc3-motion-diagram sc3-collision\" aria-hidden=\"true\"><div className=\"sc3-collision-balls\"><span>● →</span><span>← ●</span></div><div className=\"sc3-collision-caption\">टक्कर → कुल संवेग संरक्षित</div></div>;\n return null;\n}\n\nfunction SafeVisual({visual,title}){\n if(!visual)return null;\n const items=Array.isArray(visual.items)?visual.items:[];\n return <div className=\"sc3-safe-visual\" aria-label={`दृश्य: ${title}`}><div className=\"sc3-visual-grid\"><span className=\"sc3-visual-kicker\">अध्याय दृश्य</span><strong>{visual.title||title}</strong><VisualDiagram visual={visual}/><div className=\"sc3-visual-items\">{items.map((item,index)=><div className=\"sc3-visual-item\" key={`${item}-${index}`}><b>{index+1}</b><span>{item}</span></div>)}</div></div></div>;\n}\n"""
          if old not in s: raise SystemExit('SafeVisual pattern missing')
          s=s.replace(old,new,1)

          old2=""" const next=()=>{if(!item)return;if(item.question&&selected===undefined)return;if(index<lessons.length-1){goTo(index+1);return;}if(completed)return;setCompleted(true);const correct=lessons.reduce((n,x,i)=>n+(x.question&&Number(answers[i])===Number(x.answer)?1:0),0);addXp?.(20);finishSession?.({subject:'विज्ञान',chapter,mode:'learn',attempted:lessons.filter(x=>x.question).length,correct,completed:true,at:Date.now()});window.scrollTo({top:0,left:0,behavior:'auto'});};"""
          new2=""" const next=()=>{if(!item)return;if(item.question&&selected===undefined)return;if(index<lessons.length-1){goTo(index+1);return;}if(completed)return;const pending=lessons.some((x,i)=>x.question&&answers[i]===undefined);if(pending)return;setCompleted(true);const correct=lessons.reduce((n,x,i)=>n+(x.question&&Number(answers[i])===Number(x.answer)?1:0),0);addXp?.(20);finishSession?.({subject:'विज्ञान',chapter,mode:'learn',attempted:lessons.filter(x=>x.question).length,correct,completed:true,at:Date.now()});window.scrollTo({top:0,left:0,behavior:'auto'});};"""
          if old2 not in s: raise SystemExit('Learn next pattern missing')
          s=s.replace(old2,new2,1)

          old3=""" className={`answer-option pressable ${selected!==null&&i===item.answer?'correct':''} ${selected===i&&i!==item.answer?'wrong':''} ${selected!==null&&i!==selected?'muted':''}`}`"""
          # Exact class fragment varies only by backtick placement; use direct fragment replacement.
          s=s.replace("${selected!==null&&i!==selected?'muted':''}","${selected!==null&&i!==selected&&i!==item.answer?'muted':''}",1)

          old4="""<div className=\"science-quiz-actions\"><span>{selected===null?'उत्तर चुनें':'उत्तर दर्ज हो गया'}</span>"""
          new4="""<div className=\"science-quiz-actions\"><span>{selected===null?'उत्तर चुनें':'उत्तर दर्ज हो गया • सही उत्तर देखें'}</span>"""
          if old4 in s: s=s.replace(old4,new4,1)

          p.write_text(s,encoding='utf-8')

          css=Path('src/science3-learn.css')
          c=css.read_text(encoding='utf-8')
          addon='''\n.sc3-motion-diagram{position:relative;min-height:112px;border:1px solid #d8ebe7;border-radius:16px;background:radial-gradient(circle at 20% 20%,#fff,#eef8f6);overflow:hidden;padding:14px;margin:2px 0 4px;display:grid;place-items:center}.sc3-track{width:88%;height:48px;border-bottom:2px dashed #9bcac3;position:relative}.sc3-object{position:absolute;top:15px;width:22px;height:22px;border-radius:50%;background:#3c827a;box-shadow:0 7px 14px rgba(28,91,84,.18)}.sc3-object-a{left:6%;animation:sc3-travel 3s ease-in-out infinite}.sc3-object-b{right:6%;opacity:.25}.sc3-force-arrows,.sc3-forces,.sc3-action-sequence,.sc3-inertia-flow,.sc3-momentum-items{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-size:.78rem;font-weight:850;color:#385a56}.sc3-force-arrows span{padding:6px 9px;border-radius:999px;background:#e5f4f1}.sc3-forces strong,.sc3-momentum-items strong{padding:9px 13px;border-radius:10px;background:#fff;border:1px solid #cfe5e1}.sc3-action-sequence i,.sc3-inertia-flow i{font-style:normal;color:#4a8f87}.sc3-ground{position:absolute;left:8%;right:8%;bottom:22px;height:2px;background:#9bc5bf}.sc3-bus{position:absolute;left:12%;bottom:26px;font-size:2.2rem;animation:sc3-bus-drive 3.4s ease-in-out infinite}.sc3-person{position:absolute;left:30%;bottom:44px;font-size:2rem;animation:sc3-lean 3.4s ease-in-out infinite}.sc3-bus-caption,.sc3-law-label,.sc3-inertia-flow,.sc3-momentum-note,.sc3-collision-caption{font-size:.74rem;font-weight:850;color:#44635f;text-align:center}.sc3-person{transform-origin:bottom center}.sc3-momentum-items{font-size:1rem}.sc3-speed-arrow{padding:8px 12px;border-radius:999px;background:#e8f5f2}.sc3-ball{font-size:1.8rem}.sc3-circle-path{width:82px;height:82px;border:3px solid #68a69e;border-radius:50%;position:relative;animation:sc3-spin 4s linear infinite}.sc3-circle-path span{position:absolute;top:-8px;right:8px;font-size:1.7rem}.sc3-circle-arrow{position:absolute;bottom:10px;font-size:.72rem;font-weight:850;color:#44635f}.sc3-collision-balls{display:flex;gap:40px;font-size:2rem;animation:sc3-collision 2.4s ease-in-out infinite}.sc3-safe-visual{animation:sc3-visual-in .45s ease-out both}.sc3-visual-item{transition:transform .18s ease,box-shadow .18s ease}.sc3-visual-item:hover{transform:translateY(-2px);box-shadow:0 7px 14px rgba(29,83,78,.08)}@keyframes sc3-travel{0%,100%{transform:translateX(0)}50%{transform:translateX(380%)}}@keyframes sc3-bus-drive{0%,100%{transform:translateX(0)}50%{transform:translateX(210%)}}@keyframes sc3-lean{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg) translateY(-1px)}}@keyframes sc3-spin{to{transform:rotate(360deg)}}@keyframes sc3-collision{0%,100%{transform:translateX(0)}45%{transform:translateX(12px)}55%{transform:translateX(-12px)}}@keyframes sc3-visual-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n@media(max-width:560px){.sc3-motion-diagram{min-height:122px}.sc3-motion-diagram .sc3-track{width:94%}.sc3-force-arrows{gap:7px;font-size:.7rem}.sc3-bus{font-size:1.8rem}.sc3-person{font-size:1.65rem}}\n@media(prefers-reduced-motion:reduce){.sc3-motion-diagram,.sc3-visual-item{animation:none!important}.sc3-object-a,.sc3-bus,.sc3-person,.sc3-circle-path,.sc3-collision-balls{animation:none!important}}\n'''
          if '.sc3-motion-diagram{' not in c:
              c += addon
          css.write_text(c,encoding='utf-8')
      - name: Commit finalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ScienceNextChapterEngine.jsx src/science3-learn.css
          git commit -m 'Finalize Science Chapter 8 interactions and visuals' || exit 0
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/finalize-science-ch8.yml
          git commit -m 'Remove one-time Chapter 8 finalization workflow' || exit 0
          git push
