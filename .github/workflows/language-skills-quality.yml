name: Language & Skills Quality
on:
  push:
    paths:
      - 'src/english/**'
      - 'src/main2.jsx'
      - 'scripts/qaEnglishLanguageSkillsQuality.mjs'
      - 'package.json'
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run qa:english:language-skills-quality
      - run: npm run qa:english:phase5
      - run: npm run build
