name: Normalize Language Skills Assessments Once

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply normalization
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/AppWithChapter5.jsx')
          s = app.read_text(encoding='utf-8')
          marker = "const GENERIC_LANGUAGE_SKILLS=new Set"
          if marker not in s:
              raise SystemExit('router marker missing')
          if 'const UNIFIED_LANGUAGE_SKILLS_ASSESSMENT_TOPICS=' not in s:
              topics = "const UNIFIED_LANGUAGE_SKILLS_ASSESSMENT_TOPICS=new Set(['agreement','narration','clauses','determiners','prepositions','idioms','translation','formal-letter','informal-letter','notice','report','speech','message','paragraph-essay','composition','factual-reading','literary-reading','poetry-reading']);\n"
              pos = s.find(marker)
              s = s[:pos] + topics + s[pos:]
          if 'UNIFIED_LANGUAGE_SKILLS_ASSESSMENT_TOPICS.has(genericTopic)' not in s:
              candidates = ['const mode=routeMode();','const m=routeMode();']
              needle = next((x for x in candidates if x in s), None)
              if not needle:
                  raise SystemExit('route mode marker missing')
              route = "const mode=routeMode();if(genericTopic&&mode!=='learn'&&UNIFIED_LANGUAGE_SKILLS_ASSESSMENT_TOPICS.has(genericTopic))return <EnglishGenericLanguageSkillsQuiz topicId={genericTopic} {...props}/>;"
              s = s.replace(needle, route, 1)
          app.write_text(s, encoding='utf-8')

          generic = Path('src/english/EnglishPanoramaLanguageSkills.jsx')
          g = generic.read_text(encoding='utf-8')
          if "import EnglishTimedQuiz from './EnglishTimedQuiz.jsx';" not in g:
              g = g.replace("import EnglishTensesTopic from './EnglishTensesTopic.jsx';", "import EnglishTensesTopic from './EnglishTensesTopic.jsx';\nimport EnglishTimedQuiz from './EnglishTimedQuiz.jsx';", 1)
          if "if(topicId==='tenses')return <EnglishTensesTopic" in g and "if(topicId&&mode!=='learn'&&topicId!=='tenses'&&topicId!=='modals'&&topicId!=='voice')" not in g:
              needle = "if(topicId==='tenses')return <EnglishTensesTopic onBack={onBack} addXp={addXp} finishSession={finishSession}/>;"
              route = needle + "\n if(topicId&&mode!=='learn'&&topicId!=='tenses'&&topicId!=='modals'&&topicId!=='voice')return <EnglishTimedQuiz title={topic.title} mode={mode==='test'?'test':mode} getBank={()=>topic.quiz.map(([q,opts,a])=>[q,[...opts].reverse(),opts.length-1-a])} onModeChange={m=>navigate(topicId,m)} onBack={()=>navigate(topicId,'learn')} addXp={addXp} finishSession={finishSession}/>;"
              g = g.replace(needle, route, 1)
          generic.write_text(g, encoding='utf-8')

          main2 = Path('src/main2.jsx')
          m = main2.read_text(encoding='utf-8')
          m = m.replace('const timer=setInterval(check,5000);','const timer=setInterval(check,2000);',1)
          main2.write_text(m, encoding='utf-8')
          PY

      - name: Verify source and build
        run: |
          grep -q 'UNIFIED_LANGUAGE_SKILLS_ASSESSMENT_TOPICS.has(genericTopic)' src/AppWithChapter5.jsx
          grep -q "import EnglishTimedQuiz from './EnglishTimedQuiz.jsx';" src/english/EnglishPanoramaLanguageSkills.jsx
          npm install --legacy-peer-deps
          npm run build

      - name: Commit source fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/AppWithChapter5.jsx src/english/EnglishPanoramaLanguageSkills.jsx src/main2.jsx
          if git diff --cached --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git commit -m 'fix(english): standardize language skills assessments'
          git push
