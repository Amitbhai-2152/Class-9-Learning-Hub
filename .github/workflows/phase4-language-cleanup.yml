name: Phase 4 Language Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Phase 4 cleanup
        run: node scripts/phase4LanguageCleanup.mjs
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/english
          git status --short
          git commit -m "fix(english): complete phase four language cleanup [phase4]" || echo "No source changes to commit"
          git push origin main
      - name: Remove temporary Phase 4 tooling
        run: |
          rm -f scripts/phase4LanguageCleanup.mjs .github/workflows/phase4-language-cleanup.yml
          git add scripts/phase4LanguageCleanup.mjs .github/workflows/phase4-language-cleanup.yml
          git commit -m "chore(english): remove temporary phase four tooling [phase4]" || echo "Temporary tooling already removed"
          git push origin main
