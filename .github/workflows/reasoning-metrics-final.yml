name: Reasoning Metrics Final

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'reasoning-metrics-finalized') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align metrics
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/ReasoningHub.jsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace("?'36':'16'</b><span>कुल प्रश्न", "?'48':'16'</b><span>कुल प्रश्न", 1)
          s=s.replace("?'10':'8'</b><span>Practice", "?'12':'8'</b><span>Practice", 1)
          s=s.replace("?'10':'8'</b><span>Challenge", "?'12':'8'</b><span>Challenge", 1)
          s=s.replace("?'15':'12'</b><span>Final Test", "?'20':'12'</b><span>Final Test", 1)
          p.write_text(s,encoding='utf-8')
          t=p.read_text(encoding='utf-8')
          assert "?'48':'16'</b><span>कुल प्रश्न" in t
          assert "?'12':'8'</b><span>Practice" in t
          assert "?'12':'8'</b><span>Challenge" in t
          assert "?'20':'12'</b><span>Final Test" in t
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ReasoningHub.jsx
          git commit -m "fix: reasoning-metrics-finalized"
          git push
