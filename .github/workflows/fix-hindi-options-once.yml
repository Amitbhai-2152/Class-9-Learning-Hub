name: Fix Hindi MCQ option order
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch active Hindi assessment
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/HindiChapterStudyView.jsx')
          text = p.read_text(encoding='utf-8')
          old_helper = "function normalizeQuestions(source,mode){\n  const count=mode==='practice'?15:mode==='challenge'?12:20;\n  return (Array.isArray(source)?source:[]).slice(0,count).map(item=>({...item,options:[...(item.options||[])],answer:Number.isInteger(Number(item.answer))?Number(item.answer):0})).filter(item=>item.options.length>=2&&item.answer>=0&&item.answer<item.options.length);\n}"
          new_helper = old_helper + "\n\nfunction shuffleQuestionOptions(question,seed){\n  const options=question.options.map((text,index)=>({text,correct:index===question.answer}));\n  let state=(Math.floor((seed+1)*2654435761)>>>0)||1;\n  const random=()=>{state=(state+0x6D2B79F5)|0;let t=Math.imul(state^state>>>15,1|state);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296;};\n  for(let i=options.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[options[i],options[j]]=[options[j],options[i]];}\n  return {...question,options:options.map(item=>item.text),answer:options.findIndex(item=>item.correct)};\n}"
          if 'function shuffleQuestionOptions(' not in text:
            if old_helper not in text:
              raise SystemExit('Expected normalizeQuestions block not found; aborting.')
            text = text.replace(old_helper, new_helper, 1)
          old_use = "const list=useMemo(()=>normalizeQuestions(questions,mode),[questions,mode]);"
          new_use = "const list=useMemo(()=>normalizeQuestions(questions,mode).map((question,index)=>shuffleQuestionOptions(question,index)),[questions,mode]);"
          if old_use in text:
            text = text.replace(old_use, new_use, 1)
          elif new_use not in text:
            raise SystemExit('Expected active Assessment list expression not found; aborting.')
          p.write_text(text, encoding='utf-8')
      - name: Validate patch
        run: |
          grep -n "shuffleQuestionOptions" src/HindiChapterStudyView.jsx
          grep -n "normalizeQuestions(questions,mode).map" src/HindiChapterStudyView.jsx
          npm run build
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/HindiChapterStudyView.jsx .github/workflows/fix-hindi-options-once.yml
          git commit -m "fix: randomize active Hindi gadhya and kavya options"
          git rm .github/workflows/fix-hindi-options-once.yml
          git commit -m "chore: remove temporary Hindi option fix job"
          git push