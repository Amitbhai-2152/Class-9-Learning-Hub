name: Fix Timed Quiz Wiring Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Active Passive and harden quiz finalization
        shell: python
        run: |
          from pathlib import Path
          import re

          active = Path('src/english/EnglishActivePassiveTopic.jsx')
          s = active.read_text(encoding='utf-8')

          if "import EnglishTimedQuiz from './EnglishTimedQuiz.jsx';" not in s:
              s = s.replace("import './EnglishActivePassiveTopic.css';\n", "import './EnglishActivePassiveTopic.css';\nimport EnglishTimedQuiz from './EnglishTimedQuiz.jsx';\n", 1)

          m = re.search(r'function Quiz\(\{title,bank,mode,onBack,addXp\}\)\{.*?\n\}\n\nexport default function EnglishActivePassiveTopic', s, re.S)
          if m:
              s = s[:m.start()] + '''function Quiz({title,bank,mode,onBack,addXp,finishSession,onModeChange){\n return <EnglishTimedQuiz title="Active & Passive Voice" mode={mode==='final test'?'test':mode} getBank={()=>bank} onModeChange={onModeChange} onBack={onBack} addXp={addXp} finishSession={finishSession}/>;\n}\n\nexport default function EnglishActivePassiveTopic''' + s[m.end():]

          s = s.replace('export default function EnglishActivePassiveTopic({addXp}){', 'export default function EnglishActivePassiveTopic({addXp,finishSession=()=>{}}){', 1)

          pattern = r'<Quiz title=\{mode===\'practice\'\?\'Practice — core transformations\':mode===\'challenge\'\?\'Challenge — mixed voice reasoning\':\'Final Test — Active & Passive Voice\'\} bank=\{mode===\'practice\'\?PRACTICE:mode===\'challenge\'\?CHALLENGE:FINAL\} mode=\{mode===\'test\'?\'final test\':mode\} onBack=\{\(\)=>nav\(\'learn\'\)\} addXp=\{addXp\}/>'
          replacement = '<Quiz title="Active & Passive Voice" bank={mode===\'practice\'?PRACTICE:mode===\'challenge\'?CHALLENGE:FINAL} mode={mode===\'test\'?\'test\':mode} onBack={()=>nav(\'learn\')} onModeChange={nav} addXp={addXp} finishSession={finishSession}/>'
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n:
              s = s2
          else:
              s = re.sub(r'<Quiz[\\s\\S]*?/>', replacement, s, count=1)

          active.write_text(s, encoding='utf-8')

          timed = Path('src/english/EnglishTimedQuiz.jsx')
          t = timed.read_text(encoding='utf-8')
          t = t.replace("import React,{useEffect,useMemo,useState}from'react';", "import React,{useEffect,useMemo,useRef,useState}from'react';", 1)
          old = " useEffect(()=>{if(submitted){const score=bank.reduce((s,item,i)=>s+(answers[i]===item.a?1:0),0);addXp(Math.max(5,score*2));finishSession({kind:'language-skills',topic:title.toLowerCase().replace(/[^a-z]+/g,'-'),mode,score,total:bank.length,at:Date.now()})}},[submitted]);"
          new = " const finalized=useRef(false);\n useEffect(()=>{if(!submitted||finalized.current)return;finalized.current=true;const finalScore=bank.reduce((s,item,i)=>s+(answers[i]===item.a?1:0),0);addXp(Math.max(5,finalScore*2));finishSession({kind:'language-skills',topic:title.toLowerCase().replace(/[^a-z]+/g,'-'),mode,score:finalScore,total:bank.length,at:Date.now()})},[submitted,bank,answers,addXp,finishSession,title,mode]);"
          if old in t:
              t = t.replace(old, new, 1)
          t = t.replace(" useEffect(()=>{setTimeLeft(Math.max(10,bank.length*timeFor(mode)));setIndex(0);setAnswers([]);setSubmitted(false);setStarted(false)},[mode,bank.length]);", " useEffect(()=>{setTimeLeft(Math.max(10,bank.length*timeFor(mode)));setIndex(0);setAnswers([]);setSubmitted(false);setStarted(false);finalized.current=false},[mode,bank.length]);", 1)
          timed.write_text(t, encoding='utf-8')

      - name: Verify source changes
        shell: bash
        run: |
          grep -q "EnglishTimedQuiz" src/english/EnglishActivePassiveTopic.jsx
          grep -q "<EnglishTimedQuiz" src/english/EnglishActivePassiveTopic.jsx
          grep -q "useRef" src/english/EnglishTimedQuiz.jsx
          grep -q "finalized.current" src/english/EnglishTimedQuiz.jsx

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/english/EnglishActivePassiveTopic.jsx src/english/EnglishTimedQuiz.jsx
          if git diff --cached --quiet; then
            echo 'Already fixed.'
            exit 0
          fi
          git commit -m 'fix(english): harden timed quiz finalization'
          git push
