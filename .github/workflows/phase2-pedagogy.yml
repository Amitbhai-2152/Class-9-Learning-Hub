name: One-off Phase 2 Pedagogy Migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[phase2]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply Phase 2 migrations
        run: |
          node scripts/phase2Ch2.mjs
          node scripts/phase2Ch3.mjs
          node scripts/phase2Ch4.mjs
      - name: Validate migrated files before commit
        run: |
          test "$(grep -o "{title:'Part [0-9]*" src/english/EnglishPanoramaChapter2.jsx | wc -l)" -eq 10
          test "$(grep -o "{title:'Part [0-9]*" src/english/EnglishPanoramaChapter3.jsx | wc -l)" -eq 10
          test "$(grep -o "{title:'Part [0-9]*" src/english/EnglishPanoramaChapter4.jsx | wc -l)" -eq 10
          grep -q "<span>10 Guided Parts</span>" src/english/EnglishPanoramaChapter2.jsx
          grep -q "10 guided parts" src/english/EnglishPanoramaChapter3.jsx
          grep -q "10 guided parts" src/english/EnglishPanoramaChapter4.jsx
      - name: Commit migration and remove one-off tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/phase2Ch2.mjs scripts/phase2Ch3.mjs scripts/phase2Ch4.mjs scripts/phase2Pedagogy.mjs .github/workflows/phase2-pedagogy.yml
          git add src/english/EnglishPanoramaChapter2.jsx src/english/EnglishPanoramaChapter3.jsx src/english/EnglishPanoramaChapter4.jsx
          git add -u
          git commit -m "chore(english): complete phase 2 pedagogy [phase2]"
          git push
