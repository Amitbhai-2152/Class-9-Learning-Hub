name: Finalize Science Chapter 11
on:
  push:
    paths:
      - '.github/workflows/finalize-science-ch11.yml'
jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Chapter 11 integration
        shell: python
        run: |
          from pathlib import Path

          app=Path('src/App.jsx')
          s=app.read_text(encoding='utf-8')
          s=s.replace("import {ScienceChapter10Engine} from './ScienceChapter10Engine';", "import {ScienceChapter10Engine} from './ScienceChapter10Engine';\nimport {ScienceChapter11Engine} from './ScienceChapter11Engine';")
          s=s.replace("import {scienceChapter10Learning} from './scienceChapter10Learning';", "import {scienceChapter10Learning} from './scienceChapter10Learning';\nimport {scienceChapter11Learning} from './scienceChapter11Learning';")
          s=s.replace("'कार्य तथा ऊर्जा']", "'कार्य तथा ऊर्जा','ध्वनि']", 1)
          s=s.replace("'कार्य तथा ऊर्जा':scienceChapter10Learning};", "'कार्य तथा ऊर्जा':scienceChapter10Learning,'ध्वनि':scienceChapter11Learning};", 1)
          s=s.replace("const isScienceChapter10=subject.name==='विज्ञान'&&chapter==='कार्य तथा ऊर्जा';", "const isScienceChapter10=subject.name==='विज्ञान'&&chapter==='कार्य तथा ऊर्जा';const isScienceChapter11=subject.name==='विज्ञान'&&chapter==='ध्वनि';", 1)
          s=s.replace(":isScienceChapter10?scienceChapter10Learning:baseData;", ":isScienceChapter10?scienceChapter10Learning:isScienceChapter11?scienceChapter11Learning:baseData;", 1)
          s=s.replace("if(isScienceChapter10)return <ScienceChapter10Engine chapter={chapter} onBack={back} addXp={addXp} finishSession={finishSession}/>;", "if(isScienceChapter10)return <ScienceChapter10Engine chapter={chapter} onBack={back} addXp={addXp} finishSession={finishSession}/>;if(isScienceChapter11)return <ScienceChapter11Engine chapter={chapter} onBack={back} addXp={addXp} finishSession={finishSession}/>;", 1)
          app.write_text(s,encoding='utf-8')

          eng=Path('src/ScienceChapter11Engine.jsx')
          s=eng.read_text(encoding='utf-8')
          s=s.replace("import {scienceChapter11Learning} from './scienceChapter11Learning';", "import {scienceChapter11Learning} from './scienceChapter11Learning';\nimport './science11.css';", 1)
          eng.write_text(s,encoding='utf-8')

          p=Path('src/ScienceNextChapterEngine.jsx')
          s=p.read_text(encoding='utf-8')
          marker=" const type=visual?.type||'generic';"
          visuals="""
 if(type==='soundSource'||type==='medium'||type==='longitudinal'||type==='compressRare') return <div className={`sc3-motion-diagram sc3-${type}`} aria-hidden=\"true\"><div className=\"sc11-wave\"><span className=\"sc11-source\">◉</span><div className=\"sc11-particles\">{Array.from({length:11},(_,i)=><span key={i}/>)}</div><span className=\"sc11-arrow\">→</span></div></div>;
 if(type==='amplitude') return <div className=\"sc3-motion-diagram sc3-amplitude\" aria-hidden=\"true\"><div className=\"sc11-compare\"><div className=\"sc11-amp-col\"><span className=\"sc11-amp-small\"/></div><div className=\"sc11-amp-col\"><span className=\"sc11-amp-big\"/></div></div></div>;
 if(type==='frequency') return <div className=\"sc3-motion-diagram sc3-frequency\" aria-hidden=\"true\"><div className=\"sc11-bars\"><i className=\"sc11-bar low\"/><i className=\"sc11-bar high\"/></div></div>;
 if(type==='period') return <div className=\"sc3-motion-diagram sc3-period\" aria-hidden=\"true\"><div className=\"sc11-dots\">{Array.from({length:8},(_,i)=><span key={i}/>)}</div><strong>T = 1/ν</strong></div>;
 if(type==='wavelength') return <div className=\"sc3-motion-diagram sc3-wavelength\" aria-hidden=\"true\"><div className=\"sc11-wavelength\"><span className=\"sc11-mark\"><span>λ</span></span><span className=\"sc11-mark\"><span>λ</span></span></div></div>;
 if(type==='waveSpeed'||type==='speedExample') return <div className={`sc3-motion-diagram sc3-${type}`} aria-hidden=\"true\"><div className=\"sc11-formulas\"><strong>{type==='speedExample'?'λ = 2 m':'λ'}</strong><strong>{type==='speedExample'?'ν = 3 Hz':'ν'}</strong><strong>{type==='speedExample'?'v = 6 m/s':'v = λν'}</strong></div></div>;
 if(type==='mediumSpeed') return <div className=\"sc3-motion-diagram sc3-mediumSpeed\" aria-hidden=\"true\"><div className=\"sc11-stack\"><div><b>ठोस</b><span>अधिक</span></div><div><b>द्रव</b><span>मध्य</span></div><div><b>गैस</b><span>कम</span></div></div></div>;
 if(type==='audibleRange'||type==='ultraInfra') return <div className={`sc3-motion-diagram sc3-${type}`} aria-hidden=\"true\"><div className=\"sc11-range\"/></div>;
 if(type==='pitch') return <div className=\"sc3-motion-diagram sc3-pitch\" aria-hidden=\"true\"><div className=\"sc11-bars\"><i className=\"sc11-bar low\"/><i className=\"sc11-bar high\"/><strong>ν ↑ → पिच ↑</strong></div></div>;
 if(type==='reflection'||type==='echo'||type==='echoDistance') return <div className={`sc3-motion-diagram sc3-${type}`} aria-hidden=\"true\"><div className=\"sc11-echo\"><span>◉</span><i className=\"sc11-pulse\"/><div className=\"wall\"/><i className=\"sc11-pulse\"/><span>◉</span></div>{type==='echoDistance'&&<strong>d = vt/2</strong>}</div>;
 if(type==='reverberation') return <div className=\"sc3-motion-diagram sc3-reverberation\" aria-hidden=\"true\"><div className=\"sc11-crowd\">{Array.from({length:13},(_,i)=><i key={i}/>)}</div><strong>↔ ↔ ↔ कई परावर्तन</strong></div>;
 if(type==='ear') return <div className=\"sc3-motion-diagram sc3-ear\" aria-hidden=\"true\"><div className=\"sc11-ear\"><span>◉ →</span><span>👂</span><span>→ 🧠</span></div></div>;
 if(type==='sonar') return <div className=\"sc3-motion-diagram sc3-sonar\" aria-hidden=\"true\"><span className=\"sc11-boat\">⛴</span><i className=\"sc11-ray\"/><span className=\"sc11-target\">●</span></div>;
 if(type==='dailySound') return <div className=\"sc3-motion-diagram sc3-dailySound\" aria-hidden=\"true\"><div className=\"sc11-stack\"><div>🎵<b>संगीत</b></div><div>🩺<b>Ultrasound</b></div><div>⛴<b>SONAR</b></div></div></div>;
 if(type==='soundSummary') return <div className=\"sc3-motion-diagram sc3-soundSummary\" aria-hidden=\"true\"><div className=\"sc11-formulas\"><strong>v = λν</strong><strong>T = 1/ν</strong><strong>d = vt/2</strong></div></div>;
"""
          if "sc11-formulas" not in s:
              s=s.replace(marker, marker+visuals, 1)
          p.write_text(s,encoding='utf-8')

          print('Chapter 11 integration patched')

      - name: Remove temporary finalizer
        run: |
          rm .github/workflows/finalize-science-ch11.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.jsx src/ScienceChapter11Engine.jsx src/ScienceNextChapterEngine.jsx .github/workflows/finalize-science-ch11.yml
          git commit -m "feat: finalize science chapter 11 sound" || exit 0
          git push
