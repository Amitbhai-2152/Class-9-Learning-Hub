name: Integrate Science Chapter 9
on:
  push:
    paths:
      - '.github/workflows/add-science-chapter9.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/App.jsx'); s=p.read_text(encoding='utf-8')
          reps=[
          ("import {ScienceChapter8Engine} from './ScienceChapter8Engine';", "import {ScienceChapter8Engine} from './ScienceChapter8Engine';\nimport {ScienceChapter9Engine} from './ScienceChapter9Engine';"),
          ("import {scienceChapter8Learning} from './scienceChapter8Learning';", "import {scienceChapter8Learning} from './scienceChapter8Learning';\nimport {scienceChapter9Learning} from './scienceChapter9Learning';"),
          ("'गति']", "'गति','गुरुत्वाकर्षण']"),
          ("  'गति':scienceChapter7Learning", "  'गति':scienceChapter7Learning,\n  'गुरुत्वाकर्षण':scienceChapter9Learning"),
          (" const isScienceChapter8=subject.name==='विज्ञान'&&chapter==='बल तथा गति के नियम';", " const isScienceChapter8=subject.name==='विज्ञान'&&chapter==='बल तथा गति के नियम';\n const isScienceChapter9=subject.name==='विज्ञान'&&chapter==='गुरुत्वाकर्षण';"),
          ("isScienceChapter8?scienceChapter8Learning:baseData;", "isScienceChapter8?scienceChapter8Learning:isScienceChapter9?scienceChapter9Learning:baseData;"),
          (" if(isScienceChapter8)return <ScienceChapter8Engine chapter={chapter} onBack={back} addXp={addXp} finishSession={finishSession}/>;", " if(isScienceChapter8)return <ScienceChapter8Engine chapter={chapter} onBack={back} addXp={addXp} finishSession={finishSession}/>;\n if(isScienceChapter9)return <ScienceChapter9Engine chapter={chapter} onBack={back} addXp={addXp} finishSession={finishSession}/>;"),
          ]
          # Chapter 8 may not yet exist in the pattern if integration differs; use targeted replacements for known current structure.
          for old,new in reps:
              if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          git commit -m 'Integrate Science Chapter 9' || exit 0
          git push
      - name: Remove workflow
        run: |
          git rm .github/workflows/add-science-chapter9.yml
          git commit -m 'Remove one-time Chapter 9 integration workflow' || exit 0
          git push
