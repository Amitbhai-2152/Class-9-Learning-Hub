name: Quiz Fix Runner

on: push

permissions:
  contents: write

jobs:
  run-fix:
    if: contains(github.event.head_commit.message, 'trigger quiz fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shuffle answers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=[Path('src/english/EnglishTensesTopic.jsx'),Path('src/english/EnglishModalsTopic.jsx'),Path('src/english/EnglishActivePassiveTopic.jsx')]
          pat=re.compile(r"\[(?:'((?:\\'|[^'])*)'|\"((?:\\\"|[^\"])*)\"),(?:'((?:\\'|[^'])*)'|\"((?:\\\"|[^\"])*)\"),(?:'((?:\\'|[^'])*)'|\"((?:\\\"|[^\"])*)\"),(?:'((?:\\'|[^'])*)'|\"((?:\\\"|[^\"])*)\")\],0,")
          total=0
          for p in files:
            s=p.read_text(encoding='utf-8')
            counter=[0]
            def f(m):
              idx=counter[0]
              vals=[next(x for x in (m.group(1),m.group(2)) if x is not None),next(x for x in (m.group(3),m.group(4)) if x is not None),next(x for x in (m.group(5),m.group(6)) if x is not None),next(x for x in (m.group(7),m.group(8)) if x is not None)]
              shift=[1,2,3,0][idx%4]
              order=[(i+shift)%4 for i in range(4)]
              counter[0]=idx+1
              return '['+','.join("'"+vals[i].replace("'","\\'")+"'" for i in order)+'],%d,'%order.index(0)
            ns,n=pat.subn(f,s)
            p.write_text(ns,encoding='utf-8')
            print(f'{p}: changed {n} questions')
            total+=n
          if total < 30:
            raise SystemExit(f'Expected >=30 assessment questions, changed {total}')
          PY
      - name: Commit fix and remove runner
        run: |
          rm -f .github/workflows/quiz-fix-run.yml quiz-fix-trigger.txt quiz-fix-trigger-2.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/english/EnglishTensesTopic.jsx src/english/EnglishModalsTopic.jsx src/english/EnglishActivePassiveTopic.jsx .github/workflows/quiz-fix-run.yml quiz-fix-trigger.txt quiz-fix-trigger-2.txt
          git commit -m 'fix(english): distribute quiz answers across options'
          git push origin HEAD:main
