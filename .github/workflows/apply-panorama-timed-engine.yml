name: Apply Panorama Timed Engine

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Chapter 1 and 2 quiz flows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          engine_import = "import TimedPanoramaQuizEngine from './TimedPanoramaQuizEngine.jsx';\n"

          files = [
              ('src/english/EnglishPanoramaChapter1.jsx', 'EnglishPanoramaChapter1', 'englishPanoramaChapter1Meta'),
              ('src/english/EnglishPanoramaChapter2.jsx', 'EnglishPanoramaChapter2', 'englishPanoramaChapter2Meta'),
          ]

          for filename, component, meta in files:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')

              if engine_import not in text:
                  marker = "import './english-panorama.css';\n"
                  if marker not in text:
                      raise SystemExit(f'Missing import marker in {filename}')
                  text = text.replace(marker, marker + engine_import, 1)

              sig = rf"export function {component}\(\{{initialMode=null,onBack,addXp,finishSession\}}\)\{{"
              m = re.search(sig, text)
              if not m:
                  raise SystemExit(f'Component signature not found in {filename}')

              start = m.start()
              meta_pos = text.find(f"\nexport const {meta}", m.end())
              if meta_pos == -1:
                  raise SystemExit(f'Meta export marker not found in {filename}')

              old_function = text[start:meta_pos+1]
              learn_marker = "  if(mode==='learn'||mode===null)"
              learn_pos = old_function.find(learn_marker)
              if learn_pos == -1:
                  raise SystemExit(f'Learn branch not found in {filename}')

              learn_part = old_function[learn_pos:]
              # Strip the old quiz branch after the Learn return block by locating the\n              # final quiz progress declaration.  The Learn JSX itself is preserved.
              quiz_marker = "\n  const progress="
              quiz_pos = learn_part.find(quiz_marker)
              if quiz_pos != -1:
                  learn_part = learn_part[:quiz_pos]
              else:
                  # Chapter 2 has the quiz branch directly after its Learn return too.
                  quiz_pos = learn_part.find("\n const progress=")
                  if quiz_pos != -1:
                      learn_part = learn_part[:quiz_pos]

              # Remove the closing function brace from the preserved Learn segment; it is\n              # re-added below after the timed engine branch.
              if learn_part.endswith('}\n'):
                  learn_part = learn_part[:-2]
              elif learn_part.endswith('}\r\n'):
                  learn_part = learn_part[:-3]

              if component == 'EnglishPanoramaChapter1':
                  state_line = "  const [mode,setMode]=useState(initialMode);\n  const begin=m=>setMode(m);\n"
                  engine_line = "  if(mode==='practice'||mode==='challenge'||mode==='test')return <TimedPanoramaQuizEngine chapterTitle={study.title} mode={mode} questionBank={mode==='practice'?practice:mode==='challenge'?challenge:finalTest} onBack={()=>setMode('learn')} addXp={addXp} finishSession={finishSession}/>;\n"
              else:
                  state_line = " const [mode,setMode]=useState(initialMode||'learn');\n const begin=m=>setMode(m);\n"
                  engine_line = " if(mode==='practice'||mode==='challenge'||mode==='test')return <TimedPanoramaQuizEngine chapterTitle={study.title} mode={mode} questionBank={mode==='practice'?practice:mode==='challenge'?challenge:finalTest} onBack={()=>setMode('learn')} addXp={addXp} finishSession={finishSession}/>;\n"

              new_function = f"export function {component}({{initialMode=null,onBack,addXp,finishSession}}){{\n{state_line}{engine_line}{learn_part}\n}}\n"
              text = text[:start] + new_function + text[meta_pos+1:]
              path.write_text(text, encoding='utf-8')

          main = Path('src/main2.jsx')
          main_text = main.read_text(encoding='utf-8')
          main_text = main_text.replace("import './english/englishChapter1OptionRandomizer.js';\n", '', 1)
          main.write_text(main_text, encoding='utf-8')

          # Remove obsolete workaround/one-time repair workflow files.
          for obsolete in [
              'src/english/englishChapter1OptionRandomizer.js',
              '.github/workflows/fix-english-ch1-randomization.yml',
              '.github/workflows/repair-panorama-randomization.yml',
          ]:
              Path(obsolete).unlink(missing_ok=True)

          # Verify the result before committing.
          for filename, component, _ in files:
              text = Path(filename).read_text(encoding='utf-8')
              if "TimedPanoramaQuizEngine" not in text:
                  raise SystemExit(f'Engine import/use missing after patch: {filename}')
              if "const begin=m=>setMode(m);" not in text:
                  raise SystemExit(f'Begin handler missing after patch: {filename}')
              if "if(mode==='practice'||mode==='challenge'||mode==='test')" not in text:
                  raise SystemExit(f'Timed quiz branch missing after patch: {filename}')

          main_text = main.read_text(encoding='utf-8')
          if 'englishChapter1OptionRandomizer' in main_text:
              raise SystemExit('Obsolete randomizer import still present')

          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/english/EnglishPanoramaChapter1.jsx src/english/EnglishPanoramaChapter2.jsx src/english/TimedPanoramaQuizEngine.jsx src/main2.jsx src/english/englishChapter1OptionRandomizer.js .github/workflows/fix-english-ch1-randomization.yml .github/workflows/repair-panorama-randomization.yml .github/workflows/apply-panorama-timed-engine.yml
          git commit -m 'Apply timed randomized quizzes to Panorama chapters 1 and 2'
          git push
          PY
