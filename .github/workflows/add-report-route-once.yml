name: Wire Report Writing Route Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch router
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/AppWithChapter5.jsx')
          s=p.read_text(encoding='utf-8')
          imp="import EnglishReportWritingTopic from './english/EnglishReportWritingTopic.jsx';"
          if imp not in s:
              s=s.replace("import EnglishNoticeWritingTopic from './english/EnglishNoticeWritingTopic.jsx';", "import EnglishNoticeWritingTopic from './english/EnglishNoticeWritingTopic.jsx';"+imp)
          marker="if(chapter===11&&genericTopic==='notice')return <EnglishNoticeWritingTopic {...props}/>;"
          line="if(chapter===11&&genericTopic==='report')return <EnglishReportWritingTopic {...props}/>;"
          if line not in s:
              s=s.replace(marker, marker+line)
          p.write_text(s,encoding='utf-8')
      - name: Validate and build
        run: |
          grep -q "EnglishReportWritingTopic" src/AppWithChapter5.jsx
          npm install
          npm run build
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/AppWithChapter5.jsx
          git rm .github/workflows/add-report-route-once.yml
          git commit -m 'feat(english): route report writing module' || exit 0
          git push
