name: Fix English Direct Progress Routes Once

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[english-direct-routes-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pass canonical progress bridge to direct English routes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main2.jsx')
          text=p.read_text(encoding='utf-8')
          text=text.replace("if(route.languageSkills&&route.topic==='composition')return <EnglishCompositionTopic onBack={exitLanguageSkills}/>;", "if(route.languageSkills&&route.topic==='composition')return <EnglishCompositionTopic {...sharedProps}/>;")
          text=text.replace("if(route.languageSkills&&route.topic==='paragraph-essay')return <EnglishCompositionTopic onBack={exitLanguageSkills}/>;", "if(route.languageSkills&&route.topic==='paragraph-essay')return <EnglishCompositionTopic {...sharedProps}/>;")
          text=text.replace("if(route.languageSkills&&route.topic==='translation')return <EnglishTranslationTopicComplete onBack={exitLanguageSkills}/>;", "if(route.languageSkills&&route.topic==='translation')return <EnglishTranslationTopicComplete {...sharedProps}/>;")
          p.write_text(text,encoding='utf-8')
          PY
          grep -q "route.topic==='composition')return <EnglishCompositionTopic {...sharedProps}" src/main2.jsx
          grep -q "route.topic==='translation')return <EnglishTranslationTopicComplete {...sharedProps}" src/main2.jsx
      - name: Remove this one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main2.jsx .github/workflows/fix-english-direct-routes-once.yml
          git rm .github/workflows/fix-english-direct-routes-once.yml
          git commit -m "fix: complete English direct progress routes [english-direct-routes-fixed]"
          git push
