name: Deploy Learning Hub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BUILD_VERSION: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build revision manifest
        run: printf '{"version":"%s"}\n' "$VITE_BUILD_VERSION" > public/build-version.json
      - name: Embed build marker
        run: python - <<'PY'
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          marker=f'<meta name="hub-build-version" content="{__import__("os").environ["VITE_BUILD_VERSION"]}">'
          if 'name="hub-build-version"' not in text:
              text=text.replace('<head>', f'<head>\n    {marker}', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Build application
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
