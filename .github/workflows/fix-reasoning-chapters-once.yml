name: Fix Reasoning Chapters UI Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'reasoning-ui-patched') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch ReasoningHub directly
        shell: python
        run: |
          from pathlib import Path

          hub = Path('src/ReasoningHub.jsx')
          css = Path('src/reasoning-section.css')
          index = Path('index.html')
          premium = Path('src/ReasoningHubPremium.jsx')

          text = hub.read_text(encoding='utf-8')
          marker = '<div className="mode-grid">'
          if 'reasoning-smart-panel' not in text and marker in text:
              panel = '''<section className="reasoning-smart-panel"><div className="smart-head"><span className="smart-badge">SMART SOLVE</span><h3>{active.id==='number-series'?'संख्या श्रृंखला — पहले नियम, फिर उत्तर':'अक्षर श्रृंखला — Position → Jump → Pattern'}</h3><p>{active.id==='number-series'?'Sequence को हल करने के लिए हर transition को जाँचें; केवल आखिरी दो संख्याओं पर अनुमान न लगाएँ।':'A=1 … Z=26 में बदलकर jump का direction और size निकालें; फिर pattern verify करें।'}</p></div><div className="smart-grid">{active.id==='number-series'?<><article><b>① Difference</b><span>+3, −4, +5 जैसे लगातार अंतर देखें।</span><strong>उदाहरण: 2, 5, 8, 11 → +3 → 14</strong></article><article><b>② Ratio</b><span>अंतर स्पष्ट न हो तो ×2, ×3, ÷2 जाँचें।</span><strong>उदाहरण: 4, 8, 16, 32 → ×2 → 64</strong></article><article><b>③ Higher Pattern</b><span>बढ़ते differences, squares, cubes और mixed rules देखें।</span><strong>उदाहरण: 1, 4, 9, 16 → 5² → 25</strong></article></>:<><article><b>① Position</b><span>A=1, B=2 … Z=26 लिखें।</span><strong>A, C, E, G → 1,3,5,7 → I</strong></article><article><b>② Jump</b><span>Forward/backward jump की size पहचानें।</span><strong>B, E, H, K → +3 → N</strong></article><article><b>③ Advanced</b><span>+1,+2,+3…, alternating और wrap-around जाँचें।</span><strong>A, B, D, G, K → +1,+2,+3,+4 → P</strong></article></>}</div><div className="smart-tip"><b>🧠 Exam Tip:</b> नियम को कम-से-कम 3 transitions पर verify करें, फिर विकल्प चुनें।</div></section>'''
              text = text.replace(marker, panel + marker, 1)
              hub.write_text(text, encoding='utf-8')

          c = css.read_text(encoding='utf-8')
          if '.reasoning-smart-panel' not in c:
              inject = '.reasoning-smart-panel{margin:16px 0 18px;padding:22px;border:1px solid #dbe6ef;border-radius:22px;background:linear-gradient(135deg,#f8fbfd,#eef7f8);box-shadow:0 12px 32px rgba(19,34,56,.06)}.smart-head{margin-bottom:15px}.smart-badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e4f3f5;color:#176b87;font-size:10px;font-weight:900;letter-spacing:.1em}.smart-head h3{margin:9px 0 5px;color:#132238;font-size:21px}.smart-head p{margin:0;color:#607287;line-height:1.65;font-size:13px}.smart-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.smart-grid article{display:flex;flex-direction:column;gap:7px;padding:15px;border:1px solid #e0e8ef;border-radius:17px;background:#fff}.smart-grid b{color:#132238;font-size:13px}.smart-grid span{color:#5e7185;font-size:12px;line-height:1.55}.smart-grid strong{margin-top:auto;color:#176b87;font-size:12px;line-height:1.5}.smart-tip{margin-top:12px;padding:12px 14px;border-radius:14px;background:#fff;border:1px dashed #cbd8e5;color:#506277;font-size:12px;line-height:1.6}@media(max-width:800px){.smart-grid{grid-template-columns:1fr}.smart-head h3{font-size:18px}}'
              c = c.replace('.reasoning-chapter{', inject + '.reasoning-chapter{', 1)
              css.write_text(c, encoding='utf-8')

          i = index.read_text(encoding='utf-8')
          i = i.replace('    <script src="./reasoning-visible-upgrade.js"></script>\n', '')
          index.write_text(i, encoding='utf-8')

          # Premium Reasoning Lab: make mode buttons explicit buttons so they cannot
          # be swallowed by a parent form/navigation click handler.
          p = premium.read_text(encoding='utf-8')
          old = "<button key={k} className={k==='learn'?'active':''} onClick={()=>setMode(k)}><b>{m.icon} {m.label}</b>"
          new = "<button type=\"button\" key={k} className={k==='learn'?'active':''} onClick={e=>{e.preventDefault();e.stopPropagation();setMode(k)}}><b>{m.icon} {m.label}</b>"
          if old in p:
              p = p.replace(old, new, 1)
          old2 = "<button onClick={()=>setMode('practice')}>Practice शुरू करें →</button>"
          new2 = "<button type=\"button\" onClick={e=>{e.preventDefault();e.stopPropagation();setMode('practice')}}>Practice शुरू करें →</button>"
          if old2 in p:
              p = p.replace(old2, new2, 1)
          premium.write_text(p, encoding='utf-8')

      - name: Commit patched UI
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No reasoning UI changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ReasoningHub.jsx src/reasoning-section.css src/ReasoningHubPremium.jsx index.html
          git commit -m "fix: reasoning-ui-patched direct chapter and test UI"
          git push
