name: Panorama Patch Test

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run migration script
        run: node scripts/patchPanoramaTimedQuiz.mjs
      - name: Commit source migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/english/EnglishPanoramaChapter1.jsx src/english/EnglishPanoramaChapter2.jsx src/main2.jsx
          git add -u src/english/panoramaChapter1RuntimeRandomizer.js
          if git diff --cached --quiet; then
            echo "Source migration already complete"
          else
            git commit -m "Replace Panorama chapter quizzes with timed engine"
            git push
          fi
