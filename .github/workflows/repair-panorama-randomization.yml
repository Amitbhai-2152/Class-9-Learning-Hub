name: Repair Panorama Randomization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reusable timed quiz engine
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          engine_import = "import TimedPanoramaQuizEngine from './TimedPanoramaQuizEngine.jsx';\n"
          targets = [
              ('src/english/EnglishPanoramaChapter1.jsx', 'EnglishPanoramaChapter1', 'englishPanoramaChapter1Meta'),
              ('src/english/EnglishPanoramaChapter2.jsx', 'EnglishPanoramaChapter2', 'englishPanoramaChapter2Meta'),
          ]

          for filename, component, meta in targets:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')

              if engine_import not in text:
                  css_import = "import './english-panorama.css';\n"
                  if css_import not in text:
                      raise SystemExit(f'Missing CSS import marker in {filename}')
                  text = text.replace(css_import, css_import + engine_import, 1)

              function_match = re.search(rf"export function {component}\\(\\{{initialMode=null,onBack,addXp,finishSession\\}}\\)\\{{", text)
              if not function_match:
                  raise SystemExit(f'Function signature not found in {filename}')

              start = function_match.start()
              meta_marker = f"\nexport const {meta}"
              meta_pos = text.find(meta_marker, function_match.end())
              if meta_pos == -1:
                  raise SystemExit(f'Meta export not found in {filename}')

              old_function = text[start:meta_pos+1]
              learn_marker = "  if(mode==='learn'||mode===null)"
              learn_pos = old_function.find(learn_marker)
              if learn_pos < 0:
                  raise SystemExit(f'Learn branch not found in {filename}')

              learn_part = old_function[learn_pos:]
              # Preserve the existing Learn UI byte-for-byte and remove only the old quiz renderer.
              quiz_markers = ["\n  const progress=", "\n const progress="]
              quiz_pos = next((learn_part.find(marker) for marker in quiz_markers if marker in learn_part), -1)
              if quiz_pos >= 0:
                  learn_part = learn_part[:quiz_pos]

              # Remove the original function's final closing brace so the replacement can close cleanly.
              if learn_part.rstrip().endswith('}'):
                  stripped = learn_part.rstrip()
                  learn_part = stripped[:-1] + '\n'

              state_indent = '  ' if component == 'EnglishPanoramaChapter1' else ' '
              state = f"{state_indent}const [mode,setMode]=useState(initialMode{'||\'learn\'' if component == 'EnglishPanoramaChapter2' else ''});\n"
              state += f"{state_indent}const begin=m=>setMode(m);\n"
              engine_line = f"{state_indent}if(mode==='practice'||mode==='challenge'||mode==='test')return <TimedPanoramaQuizEngine chapterTitle={{study.title}} mode={{mode}} questionBank={{mode==='practice'?practice:mode==='challenge'?challenge:finalTest}} onBack={{()=>setMode('learn')}} addXp={{addXp}} finishSession={{finishSession}}/>;\n"

              new_function = f"export function {component}({{initialMode=null,onBack,addXp,finishSession}}){{\n{state}{engine_line}{learn_part}}\n"
              text = text[:start] + new_function + text[meta_pos+1:]
              path.write_text(text, encoding='utf-8')

          main = Path('src/main2.jsx')
          main_text = main.read_text(encoding='utf-8')
          main_text = main_text.replace("import './english/englishChapter1OptionRandomizer.js';\n", '', 1)
          main.write_text(main_text, encoding='utf-8')

          for obsolete in [
              'src/english/englishChapter1OptionRandomizer.js',
              '.github/workflows/fix-english-ch1-randomization.yml',
              '.github/workflows/apply-panorama-timed-engine.yml',
          ]:
              Path(obsolete).unlink(missing_ok=True)

          for filename, component, meta in targets:
              text = Path(filename).read_text(encoding='utf-8')
              if text.count('TimedPanoramaQuizEngine') < 2:
                  raise SystemExit(f'Timed engine not wired correctly: {filename}')
              if f'export function {component}' not in text:
                  raise SystemExit(f'Component missing after migration: {filename}')

          if 'englishChapter1OptionRandomizer' in main.read_text(encoding='utf-8'):
              raise SystemExit('Obsolete randomizer import remains')

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/english/EnglishPanoramaChapter1.jsx src/english/EnglishPanoramaChapter2.jsx src/english/TimedPanoramaQuizEngine.jsx src/main2.jsx src/english/englishChapter1OptionRandomizer.js .github/workflows/fix-english-ch1-randomization.yml .github/workflows/apply-panorama-timed-engine.yml .github/workflows/repair-panorama-randomization.yml
          git commit -m 'Migrate Panorama chapters 1 and 2 to timed randomized quizzes'
          git push

      - name: Remove one-time migration workflow
        if: always()
        shell: bash
        run: |
          git pull --ff-only
          if [ -f .github/workflows/repair-panorama-randomization.yml ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git rm .github/workflows/repair-panorama-randomization.yml
            git commit -m 'Remove one-time Panorama migration workflow'
            git push
          fi
