name: One-time Clauses UI polish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply visual-only Clauses polish
        shell: python
        run: |
          from pathlib import Path

          jsx = Path('src/english/EnglishPanoramaLanguageSkills.jsx')
          css = Path('src/english/EnglishPanoramaLanguageSkills.css')

          text = jsx.read_text(encoding='utf-8')
          old = 'return <div className="english-language-skills"><button className="english-book-back" onClick={onBack}>← Back to Language & Skills</button>'
          new = 'return <div className={`english-language-skills english-ls-topic-page english-ls-topic--${topic.id}`}><button className="english-book-back" onClick={onBack}>← Back to Language & Skills</button>'
          if old not in text:
              raise SystemExit('Expected topic-page markup was not found; no source change made.')
          text = text.replace(old, new, 1)
          jsx.write_text(text, encoding='utf-8')

          c = css.read_text(encoding='utf-8')
          marker = '/* === CLAUSES UI POLISH: visual-only, content untouched === */'
          if marker not in c:
              c += r'''

/* === CLAUSES UI POLISH: visual-only, content untouched === */
.english-ls-topic-page.english-ls-topic--clauses{
  --clause-ink:#172b3d;
  --clause-muted:#607487;
  --clause-line:#d8e5ee;
  --clause-soft:#f5f9fc;
  --clause-accent:#2f6d92;
  --clause-accent-soft:#e6f1f7;
  --clause-warm:#fff8ea;
  padding-bottom:82px;
}

.english-ls-topic--clauses .english-ls-topic-hero{
  min-height:260px;
  padding:34px 36px 28px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:28px;
  background:
    radial-gradient(circle at 87% 18%,rgba(182,222,241,.17),transparent 25%),
    radial-gradient(circle at 8% 90%,rgba(112,171,203,.13),transparent 27%),
    linear-gradient(135deg,#0f2941 0%,#214c69 57%,#37799d 100%);
  box-shadow:0 24px 54px rgba(18,55,79,.18);
}

.english-ls-topic--clauses .english-ls-topic-hero:before{
  content:"CLAUSE LAB";
  position:absolute;
  right:28px;
  top:24px;
  padding:7px 10px;
  border:1px solid rgba(255,255,255,.17);
  border-radius:999px;
  background:rgba(255,255,255,.07);
  color:#d9ebf5;
  font-size:.56rem;
  font-weight:950;
  letter-spacing:.14em;
}

.english-ls-topic--clauses .english-ls-topic-hero h1{
  max-width:760px;
  margin-bottom:12px;
  font-size:clamp(2.7rem,5.4vw,4.45rem);
  line-height:.96;
}

.english-ls-topic--clauses .english-ls-topic-hero p{
  max-width:820px;
  color:#dce9f1;
  font-size:1rem;
  line-height:1.75;
}

.english-ls-topic--clauses .english-ls-lesson-map{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:8px;
  margin-top:23px;
  max-height:168px;
  overflow:auto;
  padding-right:2px;
}

.english-ls-topic--clauses .english-ls-lesson-map button{
  min-height:48px;
  justify-content:flex-start;
  padding:9px 11px;
  text-align:left;
  border-radius:12px;
  background:rgba(255,255,255,.07);
  border-color:rgba(255,255,255,.14);
  transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease;
}

.english-ls-topic--clauses .english-ls-lesson-map button:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.12);
  border-color:rgba(255,255,255,.3);
}

.english-ls-topic--clauses .english-ls-lesson-map button.active{
  transform:none;
  box-shadow:0 8px 20px rgba(5,24,39,.2);
}

.english-ls-topic--clauses .english-ls-lesson-map button span{
  flex:0 0 auto;
  min-width:22px;
  height:22px;
  display:grid;
  place-items:center;
  border-radius:7px;
  background:rgba(255,255,255,.1);
  color:#b7d4e3;
  font-size:.58rem;
}

.english-ls-topic--clauses .english-ls-lesson-map button.active span{
  background:#e7f3f9;
  color:#285b79;
}

.english-ls-topic--clauses .english-ls-dock{
  top:8px;
  margin-top:18px;
  margin-bottom:20px;
  padding:7px;
  border-radius:18px;
  border-color:#d5e3ec;
  background:rgba(247,250,252,.94);
  box-shadow:0 12px 28px rgba(22,53,75,.09);
}

.english-ls-topic--clauses .english-ls-dock button{
  min-height:48px;
  font-size:.78rem;
}

.english-ls-topic--clauses .english-ls-content{
  grid-template-columns:minmax(0,1.3fr) minmax(290px,.7fr);
  gap:16px;
}

.english-ls-topic--clauses .english-ls-lesson-card{
  min-height:190px;
  padding:30px 31px 32px;
  border-radius:21px;
  border-color:#cddde8;
  background:
    linear-gradient(180deg,#fff 0%,#fbfdfe 100%);
  box-shadow:0 12px 30px rgba(20,50,72,.06);
}

.english-ls-topic--clauses .english-ls-lesson-card:before{
  width:5px;
  background:linear-gradient(180deg,#6e9fbd,#c2dce9);
}

.english-ls-topic--clauses .english-ls-step{
  min-width:48px;
  height:31px;
  background:var(--clause-accent-soft);
  color:#2b6384;
  box-shadow:inset 0 0 0 1px #ccdfeb;
}

.english-ls-topic--clauses .english-ls-lesson-card h2{
  max-width:780px;
  margin-top:14px;
  color:var(--clause-ink);
  font-size:clamp(1.48rem,2.15vw,1.9rem);
  line-height:1.28;
}

.english-ls-topic--clauses .english-ls-lesson-card p{
  max-width:820px;
  color:#50677a;
  font-size:1rem;
  line-height:1.95;
}

.english-ls-topic--clauses .english-ls-examples,
.english-ls-topic--clauses .english-ls-clinic{
  border-radius:20px;
  box-shadow:0 10px 26px rgba(20,50,72,.055);
}

.english-ls-topic--clauses .english-ls-examples{
  border-color:#d4e2eb;
  background:linear-gradient(180deg,#fff,#f7fbfd);
}

.english-ls-topic--clauses .english-ls-clinic{
  border-color:#ebdfc2;
  background:linear-gradient(180deg,#fffdf8,#fff8ea);
}

.english-ls-topic--clauses .english-ls-examples h2,
.english-ls-topic--clauses .english-ls-clinic h2{
  margin-bottom:13px;
  color:#27475f;
  font-size:1.04rem;
}

.english-ls-topic--clauses .english-ls-example{
  min-height:56px;
  padding:12px 13px;
  border-radius:12px;
  background:#fbfdfe;
}

.english-ls-topic--clauses .english-ls-example strong{
  color:#294b63;
  font-size:.8rem;
}

.english-ls-topic--clauses .english-ls-example p{
  color:#64788a;
  font-size:.77rem;
}

.english-ls-topic--clauses .english-ls-clinic>div{
  padding:12px 13px;
  border-radius:12px;
  background:rgba(255,255,255,.66);
  color:#6b603f;
  font-size:.77rem;
  line-height:1.6;
}

.english-ls-topic--clauses .english-ls-quiz{
  border-radius:21px;
  border-color:#cfdfe9;
  box-shadow:0 14px 34px rgba(20,50,72,.075);
}

.english-ls-topic--clauses .english-ls-quiz-head{
  padding:15px 18px;
  background:linear-gradient(180deg,#fbfdfe,#fff);
}

.english-ls-topic--clauses .english-ls-question h2{
  color:#233f56;
  font-size:1.08rem;
  line-height:1.62;
}

.english-ls-topic--clauses .english-ls-options button{
  min-height:49px;
  padding:13px 14px;
  border-radius:12px;
  font-size:.82rem;
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease,background .16s ease;
}

.english-ls-topic--clauses .english-ls-options button:hover{
  transform:translateX(2px);
  box-shadow:0 6px 15px rgba(22,53,75,.06);
}

.english-ls-topic--clauses .english-ls-feedback{
  border:1px solid #dce6ed;
  background:#f4f8fb;
  font-size:.78rem;
  line-height:1.6;
}

.english-ls-topic--clauses .english-ls-next{
  min-height:46px;
  padding-inline:18px;
  border-radius:11px;
  box-shadow:0 8px 18px rgba(18,52,74,.13);
}

.english-ls-topic--clauses .english-ls-bottom-nav{
  gap:12px;
  margin-top:18px;
  padding:11px;
  border-radius:17px;
}

.english-ls-topic--clauses .english-ls-bottom-nav button{
  min-height:46px;
  border-radius:11px;
  font-size:.77rem;
}

@media (max-width:900px){
  .english-ls-topic--clauses .english-ls-lesson-map{grid-template-columns:repeat(3,minmax(0,1fr));}
  .english-ls-topic--clauses .english-ls-content{grid-template-columns:1fr;}
}

@media (max-width:640px){
  .english-ls-topic--clauses .english-ls-topic-hero{padding:25px 19px 20px;border-radius:22px;}
  .english-ls-topic--clauses .english-ls-topic-hero:before{right:16px;top:16px;}
  .english-ls-topic--clauses .english-ls-topic-hero h1{font-size:clamp(2.25rem,12vw,3.15rem);}
  .english-ls-topic--clauses .english-ls-lesson-map{grid-template-columns:repeat(2,minmax(0,1fr));max-height:222px;}
  .english-ls-topic--clauses .english-ls-lesson-card{padding:24px 21px 25px;}
  .english-ls-topic--clauses .english-ls-lesson-card p{font-size:.93rem;line-height:1.84;}
  .english-ls-topic--clauses .english-ls-dock{top:5px;}
  .english-ls-topic--clauses .english-ls-bottom-nav{flex-direction:column;}
}
'''
          css.write_text(c, encoding='utf-8')

          print('Applied visual-only Clauses UI scope. Lesson/question/example content was not edited.')

      - name: Commit UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/english/EnglishPanoramaLanguageSkills.jsx src/english/EnglishPanoramaLanguageSkills.css
          git diff --cached --quiet && { echo "No UI diff created."; exit 0; }
          git commit -m "style(english): redesign clauses topic ui"
          git push
