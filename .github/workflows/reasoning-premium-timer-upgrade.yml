name: Reasoning Premium Timer Upgrade

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply upgrade once
        run: python tools/upgrade_reasoning_premium.py

      - name: Ensure Premium Test controls work
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/ReasoningHubPremium.jsx')
          s = p.read_text(encoding='utf-8')
          old = "<button key={k} className={k==='learn'?'active':''} onClick={()=>setMode(k)}><b>{m.icon} {m.label}</b>"
          new = "<button type=\"button\" key={k} className={k==='learn'?'active':''} onClick={e=>{e.preventDefault();e.stopPropagation();setMode(k)}}><b>{m.icon} {m.label}</b>"
          if old in s:
              s = s.replace(old, new, 1)
          old2 = "<button onClick={()=>setMode('practice')}>Practice शुरू करें →</button>"
          new2 = "<button type=\"button\" onClick={e=>{e.preventDefault();e.stopPropagation();setMode('practice')}}>Practice शुरू करें →</button>"
          if old2 in s:
              s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          print('premium test controls checked')

      - name: Commit generated upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ReasoningHubPremium.jsx src/reasoning-premium.css
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "fix: reasoning premium test controls"
          git push
