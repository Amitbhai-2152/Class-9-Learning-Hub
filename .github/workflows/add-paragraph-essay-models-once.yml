name: Add Paragraph Essay Model Examples Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add model writings
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/english/EnglishParagraphEssayTopic.jsx')
          s=path.read_text(encoding='utf-8')
          if 'const MODEL_WRITINGS=' in s:
              raise SystemExit('already patched')
          marker="const TRAPS=["
          models="""const MODEL_WRITINGS=[
          ['Paragraph','Value of Time','Time is one of the most valuable resources in our life. Everyone gets the same twenty-four hours in a day, but people use this time differently. A student who plans the day can complete homework, revise lessons and still find time for rest. Wasting hours on unnecessary activities often creates stress later. Therefore, we should value time, set priorities and complete important work on schedule. Good use of time builds discipline and helps us reach our goals.' ],
          ['Paragraph','A Responsible Student','A responsible student understands that learning is not limited to attending classes. Such a student listens carefully, completes work on time, keeps books organised and asks questions when a concept is unclear. Responsibility also means respecting teachers, classmates and school property. A responsible student does not wait for others to solve every problem. Instead, the student plans work, corrects mistakes and tries to improve every day. These habits make school life more meaningful and prepare students for future responsibilities.' ],
          ['Paragraph','Importance of Trees','Trees are essential for a healthy environment. They provide shade, support many living organisms and help keep surroundings pleasant. In towns and cities, trees also make public spaces cooler and more comfortable. However, careless cutting of trees can reduce green cover and harm local ecosystems. We can help by protecting existing trees, planting suitable species and avoiding unnecessary destruction. Tree conservation is not only an environmental duty; it is also an investment in a healthier future.' ],
          ['Paragraph','A Rainy Morning','The rain began early in the morning and covered the neighbourhood with a cool, fresh atmosphere. Drops of water shone on the leaves, while small puddles appeared along the road. People hurried with umbrellas and raincoats, and the usual traffic moved more slowly. After the heaviest shower, the clouds opened slightly and the wet streets reflected the pale morning light. The scene was calm, fresh and memorable, although everyone had to travel more carefully.' ],
          ['Essay','Clean and Green School','A clean and green school provides a better environment for learning. Clean classrooms reduce discomfort, while trees and plants make the campus more pleasant. Clean surroundings also teach students that public spaces require shared responsibility.\n\nThe first step is regular waste management. Dustbins should be placed where students can easily use them, and waste should be separated where practical. Students can also take part in cleanliness drives and care for school gardens. Teachers and school authorities can support these habits through clear rules and regular awareness activities.\n\nA clean and green school is not created by one person. It is the result of daily cooperation. When students treat cleanliness and greenery as shared responsibilities, the school becomes healthier, more attractive and more suitable for learning.' ],
          ['Essay','The Value of Education','Education gives people knowledge, skills and the ability to think carefully about the world around them. It helps students understand subjects, communicate ideas and make informed decisions. Education can also develop qualities such as discipline, cooperation and responsibility.\n\nThe value of education is not limited to examinations. A learner who understands how to ask questions, evaluate information and apply knowledge can continue learning throughout life. Schools also provide opportunities to work with others and understand different viewpoints.\n\nTherefore, education should be seen as preparation for both academic progress and responsible citizenship. Books, teachers, experience and thoughtful practice all contribute to learning. A strong education helps individuals build useful skills and contribute positively to their families and communities.' ],
          ['Essay','Reducing Plastic Waste','Plastic waste is a growing problem because many plastic items are used briefly and then discarded. When waste is not managed properly, it can make public places dirty and create risks for animals and the environment. Schools and communities can reduce this problem through practical daily actions.\n\nOne useful step is to encourage reusable bottles, lunch containers and bags. Schools can also place clearly labelled bins and organise awareness activities. Shops and local groups can support these efforts by reducing unnecessary single-use packaging where possible. These measures work best when people understand why consistent habits matter.\n\nReducing plastic waste is not solved by one campaign alone. It requires repeated, sensible choices by students, families, institutions and communities. Small changes, when followed regularly, can reduce unnecessary waste and keep surroundings cleaner.' ],
          ['Essay','Should Homework Be Limited on Weekends?','Homework can reinforce classroom learning, but weekend work should be planned carefully. Students need time for revision, reading and practice, yet they also need adequate rest, family time and opportunities for other activities. Excessive weekend homework can make study feel like a continuous burden rather than a useful learning process.\n\nA balanced approach is more effective. Teachers can assign focused tasks that review important concepts instead of large amounts of repetitive work. Students can use part of the weekend to read, organise notes or complete a meaningful project. Clear instructions and realistic deadlines can reduce unnecessary pressure.\n\nTherefore, weekend homework should be limited but purposeful. The goal should be meaningful practice and steady learning, not maximum quantity. A balanced schedule can support academic progress while giving students enough time to rest and return to school prepared.' ]
          ];
          """
          s=s.replace(marker,models+"\n"+marker,1)
          old='<section className="pe-reference"><h2>Quick reference</h2><div className="pe-reference-grid">{EXAMPLES.slice(Math.max(0,lesson-1),Math.min(EXAMPLES.length,Math.max(0,lesson-1)+4)).map(([kind,title,note])=><div key={`${kind}-${title}`}><small>{kind}</small><h3>{title}</h3><p>{note}</p></div>)}</div></section>'
          new='''<section className="pe-reference"><h2>Quick reference</h2><div className="pe-reference-grid">{EXAMPLES.slice(Math.max(0,lesson-1),Math.min(EXAMPLES.length,Math.max(0,lesson-1)+4)).map(([kind,title,note])=><div key={`${kind}-${title}`}><small>{kind}</small><h3>{title}</h3><p>{note}</p></div>)}</div></section>\n    <section className="pe-models"><div className="pe-models-head"><div><span>MODEL WRITING</span><h2>Examples on Different Topics</h2><p>Read these complete samples to see how a paragraph or essay develops one clear purpose from opening to conclusion.</p></div></div><div className="pe-models-grid">{MODEL_WRITINGS.map(([kind,title,text])=><article key={title} className="pe-model-card"><span>{kind}</span><h3>{title}</h3>{text.split('\\n\\n').map((para,i)=><p key={`${title}-${i}`}>{para}</p>)}</article>)}</div></section>'''
          if old not in s:
              raise SystemExit('reference section marker not found')
          s=s.replace(old,new,1)
          path.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/english/EnglishParagraphEssayTopic.jsx
          git commit -m 'feat(english): add paragraph essay model writings'
          git push
