name: Repair Progress Accuracy Sources Once

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[accuracy-source-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch accuracy source handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Mark newly recorded quiz attempts as canonical; legacy imports as legacy.
          p=Path('src/engines/progress/progressStore.js')
          text=p.read_text(encoding='utf-8')
          old="attemptRecords:[...previousAttemptRecords,{attemptId,questionsAnswered,questionsTotal,correctAnswers,percent,at:attemptedAt,stage}].slice(-100)"
          new="attemptRecords:[...previousAttemptRecords,{attemptId,questionsAnswered,questionsTotal,correctAnswers,percent,at:attemptedAt,stage,source:quiz.source||'canonical'}].slice(-100)"
          if old in text:text=text.replace(old,new,1)
          elif "source:quiz.source||'canonical'" not in text: raise SystemExit('progressStore record marker not found')
          old_sig="export function recordCanonicalQuizAttempt({subject,chapter,stage,attemptId,questionsAnswered=0,questionsTotal=0,correctAnswers=0,percent=0,at=null}={})"
          new_sig="export function recordCanonicalQuizAttempt({subject,chapter,stage,attemptId,questionsAnswered=0,questionsTotal=0,correctAnswers=0,percent=0,at=null,source='canonical'}={})"
          if old_sig in text:text=text.replace(old_sig,new_sig,1)
          old_call="quiz:{attemptId,questionsAnswered,questionsTotal,correctAnswers,percent,at}});"
          new_call="quiz:{attemptId,questionsAnswered,questionsTotal,correctAnswers,percent,at,source}});"
          if old_call in text:text=text.replace(old_call,new_call,1)
          old_legacy="at:session.at?new Date(session.at).toISOString():new Date().toISOString()"
          new_legacy="at:session.at?new Date(session.at).toISOString():new Date().toISOString(),source:'legacy'"
          if old_legacy in text:text=text.replace(old_legacy,new_legacy,1)
          p.write_text(text,encoding='utf-8')

          helper="""const isCanonicalAccuracyRecord=(subjectId,record)=>{const source=record?.source;if(source==='legacy')return false;if(source==='canonical')return true;const attemptId=String(record?.attemptId||'');return ['math','science','english'].some(id=>id===subjectId&&attemptId.startsWith(`${id}-`));};"""

          # 2) Subject cards: count only trusted canonical attempts, not historical legacy imports.
          p=Path('src/subject-progress-ui.js')
          text=p.read_text(encoding='utf-8')
          if 'const isCanonicalAccuracyRecord=' not in text:
              marker='function alreadyRecorded(subject,chapter,stage){'
              if marker not in text: raise SystemExit('subject progress insertion marker not found')
              text=text.replace(marker,helper+'\n'+marker,1)
          pattern=r"const analytics=rows\.map\(row=>safeObject\(row\?\.analytics\)\);.*?const accuracy=questionsAnswered\?Math\.round\(\(correctAnswers/questionsAnswered\)\*100\):0;"
          replacement="const analytics=rows.map(row=>safeObject(row?.analytics));const filteredAnalytics=analytics.map(a=>{const records=Array.isArray(a.attemptRecords)?a.attemptRecords.filter(record=>isCanonicalAccuracyRecord(subject.id,record)):[];return records.length?records.reduce((acc,record)=>({...acc,quizAttempts:acc.quizAttempts+1,questionsAnswered:acc.questionsAnswered+safeNum(record.questionsAnswered),questionsTotal:acc.questionsTotal+safeNum(record.questionsTotal),correctAnswers:acc.correctAnswers+safeNum(record.correctAnswers)},{quizAttempts:0,questionsAnswered:0,questionsTotal:0,correctAnswers:0}):{quizAttempts:0,questionsAnswered:0,questionsTotal:0,correctAnswers:0};});const quizAttempts=filteredAnalytics.reduce((sum,a)=>sum+safeNum(a.quizAttempts),0);const questionsAnswered=filteredAnalytics.reduce((sum,a)=>sum+safeNum(a.questionsAnswered),0);const questionsTotal=filteredAnalytics.reduce((sum,a)=>sum+safeNum(a.questionsTotal),0);const correctAnswers=filteredAnalytics.reduce((sum,a)=>sum+safeNum(a.correctAnswers),0);const accuracy=questionsAnswered?Math.round((correctAnswers/questionsAnswered)*100):0;"
          text2,n=re.subn(pattern,replacement,text,count=1,flags=re.S)
          if n!=1: raise SystemExit('subject progress analytics pattern not found')
          p.write_text(text2,encoding='utf-8')

          # 3) Preparation meter: use exactly the same trusted attempt filter for global accuracy/readiness.
          p=Path('src/preparationMeter.js')
          text=p.read_text(encoding='utf-8')
          if 'const isCanonicalAccuracyRecord=' not in text:
              marker='const topicKey=(subjectId,topicId)=>`${subjectId}::${topicId}`;'
              if marker not in text: raise SystemExit('preparation meter insertion marker not found')
              text=text.replace(marker,marker+'\n'+helper,1)
          pattern=r"const analytics=rows\.map\(topic=>safeObject\(topic\?\.analytics\)\);\s+const quizAttempts=.*?const correctAnswers=.*?;"
          replacement="const analytics=rows.map(topic=>safeObject(topic?.analytics));\n  const filteredRecords=analytics.flatMap(item=>Array.isArray(item.attemptRecords)?item.attemptRecords:[]).filter(record=>isCanonicalAccuracyRecord('global',record));\n  const quizAttempts=filteredRecords.length;\n  const questionsAnswered=filteredRecords.reduce((sum,item)=>sum+(Number.isFinite(Number(item.questionsAnswered))?Number(item.questionsAnswered):0),0);\n  const questionsTotal=filteredRecords.reduce((sum,item)=>sum+(Number.isFinite(Number(item.questionsTotal))?Number(item.questionsTotal):0),0);\n  const correctAnswers=filteredRecords.reduce((sum,item)=>sum+(Number.isFinite(Number(item.correctAnswers))?Number(item.correctAnswers):0),0);"
          # For global metrics, canonical source is authoritative; legacy is excluded. Preserve all subject-specific canonical records.
          replacement="const analytics=rows.map(topic=>safeObject(topic?.analytics));\n  const filteredRecords=analytics.flatMap(item=>Array.isArray(item.attemptRecords)?item.attemptRecords:[]).filter(record=>record?.source==='canonical'||(['math','science','english'].some(id=>String(record?.attemptId||'').startsWith(`${id}-`))));\n  const quizAttempts=filteredRecords.length;\n  const questionsAnswered=filteredRecords.reduce((sum,item)=>sum+(Number.isFinite(Number(item.questionsAnswered))?Number(item.questionsAnswered):0),0);\n  const questionsTotal=filteredRecords.reduce((sum,item)=>sum+(Number.isFinite(Number(item.questionsTotal))?Number(item.questionsTotal):0),0);\n  const correctAnswers=filteredRecords.reduce((sum,item)=>sum+(Number.isFinite(Number(item.correctAnswers))?Number(item.correctAnswers):0),0);"
          text2,n=re.subn(pattern,replacement,text,count=1,flags=re.S)
          if n!=1: raise SystemExit('preparation meter analytics pattern not found')
          text=text2
          old_best="const bestPercent=storedTopics.map(topic=>safeObject(topic?.analytics)).reduce((best,item)=>Math.max(best,clampPercent(item.bestPercent)),0);"
          new_best="const bestPercent=storedTopics.flatMap(topic=>Array.isArray(topic?.analytics?.attemptRecords)?topic.analytics.attemptRecords:[]).filter(record=>record?.source==='canonical'||(['math','science','english'].some(id=>String(record?.attemptId||'').startsWith(`${id}-`)))).reduce((best,item)=>Math.max(best,clampPercent(item.percent)),0);"
          if old_best in text:text=text.replace(old_best,new_best,1)
          p.write_text(text,encoding='utf-8')
          print('accuracy source patch applied')
          PY
      - name: Validate
        run: |
          grep -q "source:quiz.source||'canonical'" src/engines/progress/progressStore.js
          grep -q "source:'legacy'" src/engines/progress/progressStore.js
          grep -q "isCanonicalAccuracyRecord" src/subject-progress-ui.js
          grep -q "filteredRecords" src/preparationMeter.js
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engines/progress/progressStore.js src/subject-progress-ui.js src/preparationMeter.js .github/workflows/repair-progress-accuracy-sources-once.yml
          git rm .github/workflows/repair-progress-accuracy-sources-once.yml
          git commit -m "fix: isolate canonical quiz accuracy sources [accuracy-source-fixed]"
          git push
