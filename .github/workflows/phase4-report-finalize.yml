name: Phase 4 Report Finalize

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update phase-four report status
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ENGLISH_PROSE_AUDIT_REPORT.md')
          s=p.read_text(encoding='utf-8')
          s=s.replace('### Overall status: STRONG, WITH PHASE 1, PHASE 2 AND PHASE 3 COMPLETED', '### Overall status: STRONG, WITH PHASE 1, PHASE 2, PHASE 3 AND PHASE 4 COMPLETED')
          s=s.replace('The prose collection is now substantially more consistent and has a dedicated whole-prose cumulative revision layer.', 'The prose collection is now substantially more consistent, has a dedicated whole-prose cumulative revision layer, and has completed the targeted Phase-4 teacher-quality language cleanup.')
          s=s.replace('### Finding 2 — Some language examples still need a final teacher-quality pass', '### Finding 2 — Targeted teacher-quality language pass ✅ completed')
          s=s.replace('A few examples across the prose files may still benefit from pedagogical cleanup after source verification. The next pass should distinguish clearly between:', 'The targeted Phase-4 pass corrected the three language items explicitly identified by the earlier audit: the Chapter 5 gerund example, the Chapter 7 malformed relative-clause example, and the Chapter 5 Hindi translation sentence. The pass keeps source-derived wording distinct from supplemental teaching language; it does not claim an exhaustive retranslation of every textbook exercise. The corrected forms are:')
          s=s.replace('- exact textbook/source wording,\n- source-derived exercises that should be preserved, and\n- supplemental examples created specifically for teaching.', '- `I know how to swim.`\n- `This is the man whom he is talking about.`\n- `मैंने कहीं एक प्यासे आदमी को देखा।`')
          marker='## 8. Remaining quality findings\n'
          insert=('## 8A. Phase 4 — Teacher-quality language cleanup\n\n'
                  '### Completed ✅\n\n'
                  '**1. Chapter 5 Gerund example corrected.**  The unnatural supplemental example `I know swimming.` was replaced with the natural exam-safe construction `I know how to swim.`\n\n'
                  '**2. Chapter 7 Relative Clause example corrected.**  The malformed example `This is the man who he is talking about.` was replaced with `This is the man whom he is talking about.`\n\n'
                  '**3. Chapter 5 Hindi translation corrected.**  The sentence `मैं एक प्यासे हुए आदमी को कहीं देखा।` was replaced with the grammatically natural `मैंने कहीं एक प्यासे आदमी को देखा।`\n\n'
                  '**4. Permanent Phase-4 QA added to CI.** It checks the nine prose chapter files plus the cumulative revision page for the corrected teaching forms and blocks the legacy forms from returning.\n\n')
          if marker in s and '## 8A. Phase 4 — Teacher-quality language cleanup' not in s:
              s=s.replace(marker, insert+marker)
          s=s.replace('### Priority P1 — language-quality pass\n\nReview remaining glossary spelling pairs, grammar examples and translation sentences for natural, exam-safe English/Hindi, with explicit source-versus-supplement labeling where necessary. This remains separate from Phase 3 and is not silently marked complete here.', '### Priority P1 — language-quality pass ✅ completed\n\nThe targeted Phase-4 pass corrected the three previously identified teacher-quality language defects and added permanent CI guards against regression. A broader source-by-source linguistic review can still be done later if new source evidence identifies additional issues; it is not being claimed here.')
          s=s.replace('> sentence/translation cleanup → prose-wide revision test → misconception checks → final cumulative QA.', '> dedicated grammar/writing/reading audit → whole-English release readiness.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ENGLISH_PROSE_AUDIT_REPORT.md
          git commit -m "chore(english): finalize phase four audit report [phase4-final]"
          git push origin main
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/phase4-report-finalize.yml
          git add .github/workflows/phase4-report-finalize.yml
          git commit -m "chore(english): remove temporary phase four report workflow [phase4-final]"
          git push origin main
