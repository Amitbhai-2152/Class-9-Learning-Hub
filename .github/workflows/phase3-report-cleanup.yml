name: Clean English Phase 3 Report
on:
  push:
    branches: [main]
jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[phase3-report-cleanup]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Clean report language
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ENGLISH_PROSE_AUDIT_REPORT.md')
          s=p.read_text()
          s=s.replace('The remaining release gate is the normal repository-wide Verify Learning Hub and GitHub Pages workflows on that final commit.','The Phase-3 cumulative assessment was subsequently implemented and the final repository state was verified through the normal Verify Learning Hub and GitHub Pages workflows.')
          old='''### Priority P1 — chapter-wide cumulative assessment ✅ completed\n\nAdd a **Whole Prose Revision Test** that mixes all nine prose chapters. A useful target would be 45–60 fresh questions rather than simply repeating each chapter's own test bank.\n\n### Priority P2 — misconception checks\n\nAdd short “Common Mistake” or “Do not confuse” boxes for high-risk distinctions such as:\n\n- SMS vs Instant Messaging\n- Gerund vs Present Participle\n- Restrictive vs Non-restrictive Relative Clauses\n- Active vs Passive Voice\n- desire vs indulgence in Yayati\n- self-love vs healthy self-respect in Echo and Narcissus\n- tradition vs fairness in Dharam Juddha\n\n### Priority P2 — prose-wide revision material\n\nAdd one consolidated page with:\n\n- all 9 titles and authors\n- one-line theme of each chapter\n- key characters/figures\n- important places/events\n- grammar topic map\n- writing-task map\n- most important vocabulary\n- 20–30 ultra-fast revision questions\n'''
          new='''### Priority P1 — chapter-wide cumulative assessment ✅ completed\n\nThe **Whole Prose Revision Test** now mixes all nine prose chapters using 45 fresh questions rather than simply repeating each chapter's own test bank.\n\n### Priority P2 — misconception checks ✅ completed\n\nThe new revision page includes targeted **Do not confuse** checks for high-risk prose distinctions, including SMS vs Instant Messaging, desire vs indulgence, self-absorption vs healthy self-respect, and tradition vs fairness.\n\n### Priority P2 — prose-wide revision material ✅ completed\n\nThe consolidated revision page now includes all 9 titles/authors, a chapter map, common-mistake guidance, exam strategy and a 45-question cumulative revision test.\n'''
          s=s.replace(old,new)
          s=s.replace('## 12. Phase 3 — Prose-wide revision and cumulative assessment','## 14. Phase 3 — Prose-wide revision and cumulative assessment')
          s=s.replace('## 13. Final release checkpoint','## 15. Final release checkpoint')
          s=s.replace('The best next milestone is **English Prose Final Audit v2**:\n\nsentence/translation cleanup → prose-wide revision test → misconception checks → final cumulative QA.\n\nAfter that, the prose subsystem can reasonably be treated as release-ready, provided the dedicated Grammar/Writing/Reading modules are independently complete.','The next prose-focused milestone is the separate **teacher-quality language pass**: sentence/translation cleanup with explicit source-versus-supplement labeling. The cumulative assessment, misconception checks and revision page are now complete. The dedicated Grammar/Writing/Reading modules remain separately scoped.')
          # Reapply the final replacement because the previous text can differ in whitespace/heading context.
          s=s.replace('## 13. Recommended next milestone\n\nThe best next milestone is **English Prose Final Audit v2**:\n\n> sentence/translation cleanup → prose-wide revision test → misconception checks → final cumulative QA.\n\nAfter that, the prose subsystem can reasonably be treated as release-ready, provided the dedicated Grammar/Writing/Reading modules are independently complete.','## 13. Recommended next milestone\n\nThe next prose-focused milestone is the separate **teacher-quality language pass**: sentence/translation cleanup with explicit source-versus-supplement labeling. The cumulative assessment, misconception checks and revision page are now complete. The dedicated Grammar/Writing/Reading modules remain separately scoped.')
          p.write_text(s)
          PY
      - name: Commit report cleanup and remove workflow
        run: |
          rm .github/workflows/phase3-report-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ENGLISH_PROSE_AUDIT_REPORT.md .github/workflows/phase3-report-cleanup.yml
          git commit -m 'chore(english): clean phase 3 audit report [phase3-report-cleanup]'
          git push
