name: Maths Progress QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Verify Maths canonical progress hooks
        run: |
          files=(src/PolynomialEngine.jsx src/CoordinateEngine.jsx src/LinearEquationEngine.jsx src/EuclidEngine.jsx src/LinesAnglesEngine.jsx src/TrianglesEngine.jsx src/QuadrilateralEngine.jsx src/AreaEngine.jsx src/CirclesEngine.jsx src/ConstructionsEngine.jsx src/HeronEngine.jsx src/SurfaceVolumeEngine.jsx src/StatisticsEngine.jsx src/ProbabilityEngine.jsx)
          for f in "${files[@]}"; do
            grep -q "recordCanonicalQuizAttempt" "$f"
            grep -q "useEffect" "$f"
          done
      - name: Build
        run: npm run build
