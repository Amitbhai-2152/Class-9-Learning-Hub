name: Integrate English Reader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-english-reader.yml'

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Integrate English Reader into hub') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App routing
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text(encoding='utf-8')

          old_import = "import {SanskritSubjectSection,SanskritChapterEngine} from './sanskrit/SanskritSubjectSection';"
          new_import = old_import + "\nimport {EnglishReaderChapter1} from './english/EnglishReaderChapter1';"
          if old_import in s and "EnglishReaderChapter1" not in s:
              s = s.replace(old_import, new_import, 1)

          old_subject = "{id:'english',name:'अंग्रेज़ी',icon:'A',desc:'पाठ, व्याकरण, शब्दावली और लेखन',chapters:['व्याकरण, काल और शब्दावली']}"
          new_subject = "{id:'english',name:'अंग्रेज़ी',icon:'A',desc:'The Panorama + English Reader • Literature, language and exam practice',chapters:[\"Reader • 1 I’m going to dance again\",\"Reader • 2 Scaling Great Heights\",\"Reader • 3 Saint Kabir\",\"Reader • 4 The eyes are not here\",\"Reader • 5 Ismat Chughtai: A woman with a difference\",\"Reader • 6 The accidental tourist\",\"Reader • 7 Saint Ravidas\",\"Reader • 8 Bharathipura\",\"Panorama • Prose 1 Dharam Juddha\",\"Panorama • Prose 2 Yayati\",\"Panorama • Prose 3 A Silent Revolution\",\"Panorama • Prose 4 Too Many People, Too Few Trees\",\"Panorama • Prose 5 Echo and Narcissus\",\"Panorama • Prose 6 The Shehnai of Bismillah Khan\",\"Panorama • Prose 7 Kathmandu\",\"Panorama • Prose 8 My Childhood\",\"Panorama • Prose 9 The Gift of the Magi\",\"Panorama • Poetry 10 The Grandmother\",\"Panorama • Poetry 11 On His Blindness\",\"Panorama • Poetry 12 Blow, Blow, Thou Winter Wind\",\"Panorama • Poetry 13 To Daffodils\",\"Panorama • Poetry 14 Sound\",\"Panorama • Poetry 15 Self Introduction\",\"Panorama • Poetry 16 I Am Like Grass\",\"Panorama • Poetry 17 Abraham Lincoln’s Letter to His Son’s Teacher\",\"Panorama • Read, Think & Enjoy 1 The Secret of Work\",\"Panorama • Read, Think & Enjoy 2 Gandhiji’s Passion for Nursing\",\"Panorama • Read, Think & Enjoy 3 With the Photographer\"]}"
          if old_subject in s:
              s = s.replace(old_subject, new_subject, 1)

          marker = "const isScienceChapter1=subject.name==='विज्ञान'&&chapter==='हमारे आसपास के पदार्थ';"
          if "const isEnglishReader1" not in s and marker in s:
              s = s.replace(marker, "const isEnglishReader1=subject?.id==='english'&&chapter==='Reader • 1 I’m going to dance again';" + marker, 1)

          return_marker = "if(subject?.id==='sanskrit')return <Simple title={chapter} back={back}><SanskritChapterEngine chapter={chapter} initialMode={mode} onModeChange={changeMode} back={back} addXp={addXp} finishSession={finishSession}/></Simple>;"
          if "if(isEnglishReader1)" not in s and return_marker in s:
              s = s.replace(return_marker, return_marker + "if(isEnglishReader1)return <Simple title={chapter} back={back}><EnglishReaderChapter1 initialMode={mode} onBack={back} addXp={addXp} finishSession={finishSession}/></Simple>;", 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet -- src/App.jsx; then
            echo 'No App changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          git commit -m 'Integrate English Reader into hub [skip ci]'
          git push
